<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Self Review</title>
<link rel="stylesheet" href="/ui/styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">Local Self Review</a>
  <nav class="nav">
    <a href="#/">오버뷰</a>
  </nav>
  <div class="topbar-right">
    <span class="muted small">GitHub 쓰기 0건 · 로컬 전용</span>
    <label>코드 테마 <select id="themeSelect" aria-label="코드 테마"><option value="dark">VS Code Dark+</option><option value="light">VS Code Light+</option></select></label>
  </div>
</header>
<div id="notice" class="notice" hidden></div>
<section class="active-reviews card" aria-label="실행 중인 Local Self Review">
  <div class="card-head">실행 중인 리뷰 <span id="activeReviewCount" class="badge">0</span></div>
  <div id="activeReviewStatus" class="muted small" role="status">조회 중…</div>
  <ul id="activeReviewList"></ul>
</section>
<main id="app" class="app"><p class="muted">로딩 중…</p></main>
<script type="module" src="/ui/app.js"></script>
</body>
</html>
