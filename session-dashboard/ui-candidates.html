<style>

:#e7ebf3;letter-spacing:-.2px}.badge{font-size:10px;color:#9bbcaf;white-space:nowrap;display:flex;align-items:center;gap:5px}.badge:before{content:"";width:5px;height:5px;background:currentColor;border-radius:50%}.badge.wait{color:#d6b67c}.badge.done{color:#8c97a6}.meta{font-size:11px;color:#788497;margin-top:4px}.summary{color:#aeb7c5;font-size:12px;margin:12px 0}.progress-line{display:flex;gap:10px;align-items:center;margin:10px 0}.track{height:4px;background:#2d3542;border-radius:3px;flex:1;overflow:hidden}.fill{width:var(--progress);height:100%;background:#8baaf1;border-radius:3px}.fill.estimated{background:repeating-linear-gradient(90deg,#7e96bd 0,#7e96bd 3px,#61799e 3px,#61799e 5px)}.percent{color:#a6b9db;font-size:11px;font-variant-numeric:tabular-nums;min-width:35px;text-align:right}.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:10px;color:#788497;margin-top:9px}.jump{background:none;border:0;color:#a9bfea;padding:4px 0;font-size:11px}.jump:hover{color:#d8e5ff}.note{font-size:10px;color:#717d8e;margin-top:18px}.card{padding:16px;border:1px solid #303744;background:#1d222b;border-radius:10px;margin:12px 0}.card .row{border:0;padding:0}.card .summary{line-height:1.6;margin-bottom:16px}.steps{display:flex;gap:5px;margin:14px 0 5px}.step{height:3px;background:#354052;flex:1;border-radius:4px}.step.completed{background:#91aacd}.step.current{background:#8aaaf4}.group-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 8px;color:#98a4b5;font-size:11px;font-weight:600}.group-title:first-of-type{margin-top:10px}.group-title span{font-weight:400;color:#6f7b8c}.group .row{background:#1b2028;border:1px solid #2d3541;border-radius:8px;padding:13px;margin-bottom:8px}.group .summary{margin:9px 0}.waiting-group .row{border-color:#4b4131;background:#24221e}.attention{font-size:11px;color:#c9ae80;margin:9px 0 4px}.mock-detail{display:none;margin-top:16px;padding:14px;background:#232b38;border:1px solid #3a4e6d;border-radius:8px;font-size:12px}.mock-detail.visible{display:block}.mock-detail button{float:right;color:#aab9d3;background:none;border:0}.caption{text-align:center;font-size:11px;color:#697689;margin-top:15px}@media(max-width:550px){header{margin-top:24px}main,header{padding-left:16px;padding-right:16px}nav button{padding:8px 10px;font-size:12px}.surface{padding:16px}}

.is-detail .title-row,.is-detail .stats,.is-detail #content,.is-detail .note{display:none}.detail{display:none}.is-detail .detail{display:block}.back-link{background:none;border:0;color:#97aac7;font-size:12px;padding:0;margin-bottom:22px}.detail-heading h2{font-size:20px;line-height:1.35;letter-spacing:-.6px;margin:7px 0 12px}.detail-heading{margin-bottom:20px}.detail-block{background:#1d222b;border:1px solid #303744;border-radius:10px;padding:17px;margin-bottom:12px}.section-label{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:#dce2ed}.section-label span{font-weight:400;color:#8290a5;font-size:10px}.big-progress{font-size:42px;line-height:1.2;font-weight:600;letter-spacing:-1.5px;margin:18px 0 12px;color:#b8cdf8}.big-progress small{font-size:19px;color:#8c9db9;margin-left:3px}.progress-block .track{height:6px}.basis-text{font-size:11px;color:#8290a5;margin-top:8px}.current-task{border-top:1px solid #303744;margin-top:18px;padding-top:14px}.current-task span{font-size:10px;color:#8290a5}.current-task p{font-size:12px;color:#c2ccdc;margin-top:5px}.primary-jump{width:100%;background:#d2dff8;color:#273b60;border:0;border-radius:7px;font-size:12px;font-weight:600;padding:10px;margin-top:17px}.detail-steps{list-style:none;margin:18px 0 0;padding:0}.detail-steps li{display:flex;align-items:center;gap:12px;padding-bottom:17px;position:relative}.detail-steps li:last-child{padding-bottom:0}.detail-steps li:not(:last-child):before{content:'';width:1px;position:absolute;left:11px;top:24px;bottom:0;background:#384353}.step-icon{height:24px;width:24px;border-radius:50%;background:#2b3546;color:#91b69e;font-size:11px;display:grid;place-items:center;flex-shrink:0}.step-active .step-icon{background:#384d72;color:#c6d9ff;border:1px solid #7295cd}.detail-steps strong{font-size:12px;font-weight:500}.detail-steps li div div{font-size:10px;color:#8996aa;margin-top:2px}.agent-row{display:flex;gap:10px;align-items:center;margin-top:17px;font-size:12px}.agent-row strong{font-weight:500}.agent-row .badge{margin-left:auto}.agent-avatar{width:28px;height:28px;background:#2a3445;border:1px solid #3a465b;border-radius:7px;display:grid;place-items:center;color:#b8c9e8;font-size:11px}.child{padding-left:9px;margin-top:13px}.child-mark{width:19px;color:#56677f}.activity{display:flex;gap:11px;margin-top:17px}.activity strong{font-size:11px;font-weight:500;color:#b8c3d5}.activity div div{font-size:10px;color:#77859b;margin-top:4px}.activity-dot{width:5px;height:5px;border-radius:50%;background:#91b2ee;flex-shrink:0;margin-top:6px}.activity-dot.muted{background:#56667e}.session-info{font-size:11px;color:#8290a5;padding:12px 4px}.session-info summary{cursor:pointer}.session-info div{margin-top:9px;font-size:10px}.attention-box{border:1px solid #554833;border-radius:8px;background:#2a251e;color:#d0b585;font-size:11px;padding:12px;margin-bottom:12px}.attention-box div{font-size:10px;margin-top:5px;color:#aa9778}

.request-glance{display:flex;gap:16px;margin:12px 0;color:#77879d;font-size:10px}.request-glance b{font-weight:400;color:#b2bfd2;margin-left:4px}.request-metrics{display:grid;grid-template-columns:1fr 1fr;margin:18px 0 12px;gap:16px}.request-metrics div+div{border-left:1px solid #303744;padding-left:16px}.request-metrics span{display:block;font-size:10px;color:#8290a5}.request-metrics strong{display:block;font-size:25px;font-weight:600;color:#dbe5f5;margin-top:5px}.request-metrics small{font-size:12px;color:#77859b;font-weight:400}.eta-note{font-size:10px;color:#8290a5;line-height:1.7;border-top:1px solid #303744;padding-top:12px}.request-list{margin-top:13px}.request-item{border-top:1px solid #303744}.request-item:first-child{border-top:0}.request-item summary{display:flex;align-items:flex-start;gap:9px;cursor:pointer;font-size:12px;padding:14px 0;list-style:none}.request-item summary::-webkit-details-marker{display:none}.request-number{color:#62728c;font-size:10px;padding-top:3px}.request-state{margin-left:auto;white-space:nowrap;font-size:10px;color:#8996aa}.request-state.running{color:#a6bdeb}.request-state.done{color:#92b5a0}.request-item[open] summary{color:#dce8fc}.request-body{padding:0 0 17px 22px}.answer-line{display:flex;align-items:center;justify-content:space-between;font-size:10px;margin:8px 0}.answer-line span{color:#8290a5}.answer-line strong{font-weight:400;color:#b8c9e1}.request-eta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:7px;font-size:10px;margin-top:13px;padding-top:12px;border-top:1px solid #303744}.request-eta span,.request-next span,.request-finished span{color:#8290a5;font-size:10px}.request-eta strong{font-weight:400;color:#cbb68d}.request-next,.request-finished{margin-top:12px}.request-next p,.request-finished p{font-size:11px;color:#a7b7cd;margin-top:3px}.request-finished ul{padding:0;margin:6px 0 0;list-style:none;font-size:11px;color:#9fb5ac}.request-finished li{margin-top:5px}
</style>
<header>
<h1>세션 대시보드 · UI 후보</h1>
<p>같은 세션 데이터를 다른 정보 배치로 비교합니다.</p>
<nav aria-label="UI 후보"><button data-mode="list" aria-selected="false">① 간결한 리스트</button><button data-mode="cards" aria-selected="true">② 작업 카드</button><button data-mode="groups" aria-selected="false">③ 상태별 그룹</button></nav>
<p class="explanation" id="explanation"></p>
<button class="width-toggle" style="margin-top:12px;font-size:12px" id="width-toggle">패널 넓게 보기</button>
<button class="width-toggle" style="margin-left:8px;font-size:12px" id="detail-preview">상세 화면 미리보기 →</button></header>
<main><div class="preview" id="preview"><div class="chrome"><strong>◉ 세션 대시보드</strong><span>Orca 우측 패널</span></div><div class="surface"><div class="title-row"><h2>세션</h2><span class="live">실시간</span></div><div class="stats"><span><b>4</b>전체</span><span><b>2</b>진행 중</span><span><b>1</b>확인 필요</span></div><div id="content"></div><div class="detail" id="detail"></div><p class="note">~는 단계 추정치입니다. 전체 작업량 기준이 아닙니다.</p></div></div><div class="caption">미리보기용 데이터 · 현재 대시보드에는 적용하지 않음</div></main>
<script>
const sessions=[
 {name:'Orca 플러그인 셀프 리뷰',repo:'orca-plugin',agent:'Claude',state:'진행 중',kind:'running',summary:'터미널 연동 구현 완료 · 통합 검증 중',progress:67,estimated:true,basis:'검증 단계',ago:'방금'},
 {name:'메일함 툴바 개선',repo:'greeting',agent:'Claude',state:'진행 중',kind:'running',summary:'등록된 작업 3개 중 2개 완료',progress:67,estimated:false,basis:'2 / 3개 완료',ago:'12초 전'},
 {name:'세션 실시간 대시보드',repo:'orca-plugin',agent:'Codex',state:'확인 필요',kind:'wait',summary:'구현 완료 · 사용자 확인 대기',progress:67,estimated:true,basis:'검증 단계',ago:'1분 전'},
 {name:'세션별 계정 설정',repo:'orca-plugin',agent:'Claude',state:'응답 완료',kind:'done',summary:'설정 방법 안내 완료',progress:100,estimated:false,basis:'다음 지시 대기',ago:'8분 전'}
];
const explanations={list:'추천 · 좁은 패널에서 가장 빠르게 훑어볼 수 있습니다. 상태, 진행률, 터미널 이동을 한 행에 모으고 장식은 줄였습니다.',cards:'선택한 작업 카드형 · 답변 상태와 작업 진행을 구분합니다. 상세 화면에서 요청별 진행률, 종료 예상, 완료 항목을 확인합니다.',groups:'대응 우선순위 중심 · 확인이 필요한 세션을 맨 위에 모읍니다. 진행 중과 완료 세션을 나눠 여러 프로젝트를 동시에 볼 때 편리합니다.'};
let mode='cards',filter='all';
function row(s,index){return `<div class="row"><div class="heading"><span class="name">${s.name}</span><span class="badge ${s.kind}">${s.state}</span></div><div class="meta">${s.repo} · ${s.agent}</div><div class="summary">${s.summary}</div><div class="request-glance"><span>답변 <b>${s.kind==='done'?'완료':s.kind==='wait'?'완료 · 확인 대기':'작성 중'}</b></span><span>종료 예상 <b>${s.kind==='done'?'종료됨':'산정 중'}</b></span></div>${mode==='cards'?'<div class="steps"><span class="step completed"></span><span class="step completed"></span><span class="step current"></span></div>':''}<div class="progress-line"><div class="track"><div class="fill ${s.estimated?'estimated':''}" style="--progress:${s.progress}%"></div></div><span class="percent">${s.estimated?'~':''}${s.progress}%</span></div><div class="foot"><span>${s.basis} · ${s.ago}</span><button class="jump" data-session="${index}">상세 보기 →</button></div></div>`;}
function render(){document.getElementById('explanation').textContent=explanations[mode];let out='';if(mode==='groups'){for(const [kind,label] of [['wait','확인 필요'],['running','진행 중'],['done','응답 완료']]){const list=sessions.map((s,i)=>({s,i})).filter(x=>x.s.kind===kind);out+=`<section class="group ${kind==='wait'?'waiting-group':''}"><div class="group-title">${label}<span>${list.length}개</span></div>${list.map(x=>row(x.s,x.i)).join('')}</section>`;}}else{out=`<div class="tools">${[['all','전체',4],['running','진행 중',2],['wait','확인 필요',1]].map(([key,label,count])=>`<button class="filter ${filter===key?'active':''}" data-filter="${key}">${label}<span class="count">${count}</span></button>`).join('')}</div>`;out+=sessions.map((s,i)=>({s,i})).filter(x=>filter==='all'||x.s.kind===filter).map(x=>mode==='cards'?`<section class="card">${row(x.s,x.i)}</section>`:row(x.s,x.i)).join('');}document.getElementById('content').innerHTML=out;}
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;filter='all';document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));document.getElementById('preview').classList.remove('is-detail');render();});
function showDetail(index){
 const s=sessions[index];const finished=s.kind==='done';
 const steps=finished?['요청 확인','답변 작성','안내 완료']:['요청 확인·분석','구현·처리','검증·결과 확인'];
 const active=finished?3:2;
 const requests=finished?[{question:'세션마다 다른 계정을 사용할 수 있나?',answer:'답변 완료',state:'done',work:'작업 요청 없음',percent:null,done:['설정 디렉터리 분리 방법 안내','세션별 환경변수 예시 제공'],next:'추가 요청 대기',eta:'종료됨',basis:'현재 답변 완료'}]:[{question:'플러그인으로 리뷰를 보여줘',answer:'답변 완료',state:'done',work:'작업 완료',percent:100,done:['리뷰 서버 구현','기본 UI 구현','플러그인 실행 연결'],next:'완료',eta:'종료됨',basis:'3 / 3개 완료'},{question:'별도 브라우저 대신 탭 안에서 보여줘',answer:'작업 중 · 최종 답변 전',state:'running',work:'작업 진행 중',percent:67,done:['탭 내 렌더링 연결','기본 동작 확인'],next:'통합 검증 및 결과 안내',eta:'예상 시간 산정 중',basis:'2 / 3개 완료'},{question:'리뷰 코멘트 저장도 가능하게 해줘',answer:'요청 접수',state:'pending',work:'대기 중',percent:0,done:[],next:'현재 작업 완료 후 처리',eta:'앞선 작업 완료 후',basis:'0 / 2개 완료'}];
 const agentRows=index===0?[['서버 구현','완료','done'],['UI 구현','완료','done'],['통합 검증','진행 중','running']]:[];
 document.getElementById('detail').innerHTML=`
 <button class="back-link" id="back-to-list">← 세션 목록</button>
 <div class="detail-heading"><div class="meta">${s.repo} / ${s.agent}</div><h2>${s.name}</h2><span class="badge ${s.kind}">${s.state}</span></div>
 ${s.kind==='wait'?'<div class="attention-box"><strong>사용자 확인이 필요합니다</strong><div>구현 결과를 확인한 뒤 다음 작업을 진행할 수 있습니다.</div></div>':''}
 <section class="detail-block request-overview"><div class="section-label">요청별 현황 <span>미리보기 예시</span></div><div class="request-metrics"><div><span>답변 완료</span><strong>${requests.filter(r=>r.answer==='답변 완료').length}<small> / ${requests.length}</small></strong></div><div><span>작업 완료</span><strong>${requests.filter(r=>r.work==='작업 완료').length}<small> / ${requests.filter(r=>r.percent!==null).length}</small></strong></div></div><p class="eta-note">${finished?'현재 답변이 종료되었습니다.':'남은 작업의 실행 시간 근거가 없어 종료 시각을 아직 산정하지 않았습니다.'}</p></section>
 <section class="detail-block"><div class="section-label">질문·요청 <span>${requests.length}건</span></div><div class="request-list">${requests.map((r,i)=>`<details class="request-item" ${r.state==='running'||finished?'open':''}><summary><span class="request-number">${String(i+1).padStart(2,'0')}</span><span>${r.question}</span><span class="request-state ${r.state}">${r.state==='done'?'완료':r.state==='running'?'진행 중':'대기'}</span></summary><div class="request-body"><div class="answer-line"><span>답변</span><strong>${r.answer}</strong></div><div class="answer-line"><span>작업</span><strong>${r.work}</strong></div>${r.percent!==null?`<div class="progress-line"><div class="track"><div class="fill" style="--progress:${r.percent}%"></div></div><span class="percent">${r.percent}%</span></div><div class="basis-text">${r.basis}</div>`:''}<div class="request-eta"><span>종료 예상</span><strong>${r.eta}</strong></div><div class="request-next"><span>다음 작업</span><p>${r.next}</p></div><div class="request-finished"><span>마무리된 항목</span>${r.done.length?'<ul>'+r.done.map(item=>'<li>✓ '+item+'</li>').join('')+'</ul>':'<p>아직 완료한 항목이 없습니다.</p>'}</div></div></details>`).join('')}</div></section>
 <section class="detail-block progress-block"><div class="section-label">세션 작업 단계 <span>${s.estimated?'단계 추정':'등록된 작업 기준'}</span></div><div class="big-progress">${s.estimated?'~':''}${s.progress}<small>%</small></div><div class="progress-line"><div class="track"><div class="fill ${s.estimated?'estimated':''}" style="--progress:${s.progress}%"></div></div></div><div class="basis-text">${s.basis}${s.estimated?' · 전체 작업량 기준 아님':''}</div><div class="current-task"><span>현재 작업</span><p>${s.summary}</p></div><button class="primary-jump" id="detail-jump">터미널로 이동 ↗</button><div class="meta" id="jump-feedback" role="status"></div></section>
 <section class="detail-block"><div class="section-label">작업 단계 <span>${finished?'3':'2'} / 3 완료</span></div><ol class="detail-steps">${steps.map((title,i)=>`<li class="${i<active?'step-done':'step-active'}"><div class="step-icon">${i<active?'✓':i+1}</div><div><strong>${title}</strong><div>${i<active?'완료':s.kind==='wait'?'확인 대기':'진행 중'}</div></div></li>`).join('')}</ol></section>
 <section class="detail-block"><div class="section-label">에이전트 <span>${agentRows.length?agentRows.length+1:1}개</span></div><div class="agent-row"><div class="agent-avatar">${s.agent==='Claude'?'C':'X'}</div><div><strong>메인 에이전트</strong><div class="meta">${s.agent} · ${finished?'응답 완료':'작업 조율'}</div></div><span class="badge ${s.kind}">${s.state}</span></div>${agentRows.map(([title,state,kind])=>`<div class="agent-row child"><div class="child-mark">↳</div><div><strong>${title}</strong><div class="meta">서브에이전트</div></div><span class="badge ${kind}">${state}</span></div>`).join('')}</section>
 <section class="detail-block"><div class="section-label">최근 활동 <span>최신순</span></div><div class="activity"><span class="activity-dot"></span><div><strong>${s.summary}</strong><div>${s.ago}</div></div></div><div class="activity"><span class="activity-dot muted"></span><div><strong>${finished?'답변 작성 완료':'구현·처리 완료'}</strong><div>3분 전</div></div></div><div class="activity"><span class="activity-dot muted"></span><div><strong>요청 확인 및 작업 시작</strong><div>12분 전</div></div></div></section>
 <details class="session-info"><summary>세션 정보</summary><div>프로젝트 · ${s.repo}</div><div>에이전트 · ${s.agent}</div><div>세션 식별자 · preview-session-${index+1}</div></details>`;
 document.getElementById('preview').classList.add('is-detail');
 document.getElementById('back-to-list').onclick=()=>document.getElementById('preview').classList.remove('is-detail');
 document.getElementById('detail-jump').onclick=()=>{document.getElementById('jump-feedback').textContent='미리보기입니다. 실제 대시보드에서는 해당 터미널로 이동합니다.';};
}
 document.getElementById('content').addEventListener('click',e=>{const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();return;}const b=e.target.closest('[data-session]');if(b)showDetail(Number(b.dataset.session));});
 document.getElementById('detail-preview').onclick=()=>showDetail(0);
document.getElementById('width-toggle').onclick=e=>{const wide=document.getElementById('preview').classList.toggle('wide');e.target.textContent=wide?'우측 패널 폭으로 보기':'패널 넓게 보기';};render();
</script>
</html>
