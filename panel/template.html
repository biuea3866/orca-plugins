<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Self Review</title>
<style>
  :root { color-scheme: light dark; --sr-add: rgba(46, 160, 67, .18); --sr-del: rgba(248, 81, 73, .18); --sr-sel: rgba(255, 204, 0, .28); --sr-hunk: rgba(56, 139, 253, .12); }
  html, body { margin: 0; padding: 0; background: var(--background); color: var(--foreground); }
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  button, select, textarea, input { font: inherit; color: inherit; }
  .btn { border: 1px solid var(--border); background: var(--secondary); color: var(--secondary-foreground); border-radius: var(--radius, 6px); padding: 3px 8px; cursor: pointer; font-size: 14px; }
  .btn.primary { background: var(--primary); color: var(--primary-foreground); border-color: transparent; font-weight: 600; }
  .btn.danger { background: var(--destructive); color: var(--destructive-foreground); border-color: transparent; }
  .btn.ghost { background: transparent; }
  .btn.mono { white-space: normal; overflow-wrap: anywhere; text-align: left; max-width: 100%; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:focus-visible, select:focus-visible, textarea:focus-visible, .gutter:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
  select { background: var(--background); border: 1px solid var(--input); border-radius: var(--radius, 6px); padding: 2px 6px; max-width: 100%; }
  textarea { width: 100%; min-height: 64px; background: var(--background); border: 1px solid var(--input); border-radius: var(--radius, 6px); padding: 6px; resize: vertical; }
  .muted { color: var(--muted-foreground); }
  .small { font-size: 13px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; }
  .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .badge { display: inline-block; font-size: 12px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--border); background: var(--accent); color: var(--accent-foreground); white-space: nowrap; }
  .badge.warn { background: var(--sr-sel); border-color: transparent; }
  .card { background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); border-radius: var(--radius, 6px); margin: 8px; }
  .card-head { padding: 6px 10px; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .card-body { padding: 6px 10px; }
  .notice { margin: 8px; padding: 6px 10px; border-radius: var(--radius, 6px); background: var(--sr-sel); color: var(--foreground); font-size: 14px; }
  .notice.error { background: var(--sr-del); }
  .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--card); border-bottom: 1px solid var(--border); }
  .topbar .title { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--border); }
  .tab { padding: 4px 10px; border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0; cursor: pointer; background: transparent; color: var(--muted-foreground); }
  .tab.active { background: var(--card); border-color: var(--border); color: var(--foreground); font-weight: 600; }
  .list-item { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-top: 1px solid var(--border); }
  .list-item:first-child { border-top: 0; }
  .list-item .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; white-space: normal; }
  .pr-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-item { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 4px; cursor: pointer; }
  .file-item:hover { background: var(--accent); }
  .file-item.active { background: var(--accent); font-weight: 600; }
  .file-item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .diff { width: 100%; border-collapse: collapse; table-layout: fixed; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; line-height: 22px; }
  .diff col.g { width: 52px; } .diff col.m { width: 14px; }
  .diff td { padding: 0; vertical-align: top; }
  .diff .gutter { text-align: right; padding-right: 5px; color: var(--muted-foreground); user-select: none; cursor: pointer; background: var(--card); white-space: nowrap; }
  .diff .gutter.disabled { cursor: default; opacity: .4; }
  .diff .gutter:hover:not(.disabled) { color: var(--primary); font-weight: 700; }
  .diff .marker { text-align: center; color: var(--muted-foreground); user-select: none; }
  .diff .code { white-space: pre-wrap; word-break: break-all; padding: 0 6px; }
  .diff tr.add .code, .diff tr.add .marker { background: var(--sr-add); }
  .diff tr.del .code, .diff tr.del .marker { background: var(--sr-del); }
  .diff tr.hunk td { background: var(--sr-hunk); color: var(--muted-foreground); padding: 1px 6px; font-size: 12px; }
  .diff tr.selected .code, .diff tr.selected .marker, .diff tr.selected .gutter { background: var(--sr-sel) !important; }
  .diff tr.thread-row td { padding: 6px 6px 6px 10px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; }
  .thread { border: 1px solid var(--border); border-radius: var(--radius, 6px); background: var(--popover); color: var(--popover-foreground); margin: 4px 0; }
  .thread-head { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--muted-foreground); flex-wrap: wrap; }
  .thread-head .grow { flex: 1; }
  .thread.pending { opacity: .75; border-style: dashed; }
  .comment.pending { opacity: .75; }
  .thread.resolved .thread-body { display: none; }
  .thread.resolved.expanded .thread-body { display: block; }
  .comment.ai { border-left: 3px solid #8957e5; padding-left: 6px; background: color-mix(in srgb, var(--card) 92%, #8957e5 8%); }
  .comment.ai .body { white-space: pre-wrap; }
  .comment { padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .comment:last-of-type { border-bottom: 0; }
  .comment .meta { font-size: 12px; color: var(--muted-foreground); display: flex; gap: 6px; align-items: center; }
  .comment .meta .grow { flex: 1; }
  .comment .body { white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  .form { padding: 6px 8px; }
  .form .actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 4px; }
  .file-block { margin: 0 8px 10px; border: 1px solid var(--border); border-radius: var(--radius, 6px); overflow: hidden; background: var(--background); }
  .file-block.collapsed .file-head { border-bottom: 0; }
  .file-head { position: sticky; top: 38px; z-index: 5; padding: 4px 6px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; gap: 6px; align-items: center; }
  .file-head .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .run { margin: 8px; border: 1px solid var(--border); border-radius: var(--radius, 6px); background: var(--card); }
  .run.live { border-color: var(--primary); }
  .history-row { cursor: pointer; flex-wrap: wrap; padding: 6px 4px; }
  .history-row:hover, .history-row.open { background: var(--accent); }
  .history-thread { padding: 4px 0; border-top: 1px solid var(--border); }
  .history-thread:first-child { border-top: 0; }
  .spinner { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: sr-spin .8s linear infinite; margin-right: 4px; }
  @keyframes sr-spin { to { transform: rotate(360deg); } }
  .run pre { margin: 0; max-height: 160px; overflow: auto; padding: 6px 8px; font-size: 13px; white-space: pre-wrap; word-break: break-word; background: var(--background); }
  details summary { cursor: pointer; color: var(--muted-foreground); }
  .add-count { color: #2ea043; } .del-count { color: #f85149; }
  .files-collapsed .file-list-body { display: none; }
  .empty { padding: 14px 10px; color: var(--muted-foreground); text-align: center; }
  .kbd { font-family: ui-monospace, monospace; font-size: 12px; border: 1px solid var(--border); border-radius: 3px; padding: 0 3px; }
</style>
</head>
<body>
<div class="topbar">
  <span class="title" id="title">Self Review</span>
  <button type="button" class="btn ghost small" id="btnRefreshOverview" title="PR 목록·세션 새로고침">↻</button>
  <button type="button" class="btn ghost small" id="btnWide" title="내장 브라우저에서 넓게 보기">넓게</button>
</div>
<div class="tabs" id="tabs"></div>
<div id="notice" class="notice" hidden></div>
<div id="focusBanner" class="notice" hidden></div>
<div id="app"><div class="empty">로딩 중…</div></div>

<script>/*__ORCA_SELF_REVIEW_DATA__*/</script>
<script>
'use strict'
/*__INLINE:selection__*/
/*__INLINE:threads__*/
/*__INLINE:confirm__*/
/*__INLINE:pin__*/

// ------------------------------------------------------------------ data
const TEMPLATE_VERSION = 'v27'
let DATA = JSON.parse(document.getElementById('orca-panel-data').textContent || '{}')
const PREVIEW = window.parent === window                       // opened in a normal browser (server /panel-preview)
const PREVIEW_TOKEN = document.querySelector('meta[name="sr-token"]')?.content ?? null
let CONTEXT = null                                             // { displayName, branch, terminals: [{id}] }
let ROUTE = 'review'                                            // 'review' | 'overview'
let ACTIVE_WORKTREE = null                                      // worktree entry from DATA.worktrees
const UI = { dismissedRun: null, lastRunStatus: {}, focusCandidate: null, runLogOpen: false, pendingThreads: [], pendingReplies: {}, sending: false, collapsedFiles: new Set(), filesCollapsed: true, file: null, selection: null, dragging: false, pendingForm: false, expanded: new Set(), draft: '', drafts: {}, scrollRestored: false, picker: null, lastMessage: '', historyOpen: undefined, historyLoading: null }

function escapeHtml(value) { return String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char])) }
class Raw { constructor(html) { this.html = html } }
const raw = (html) => new Raw(html)
function h(strings, ...values) { return strings.reduce((out, part, index) => out + part + (index < values.length ? (values[index] instanceof Raw ? values[index].html : escapeHtml(values[index])) : ''), '') }
function formatTime(iso) { if (!iso) return '—'; const d = new Date(iso); return Number.isNaN(d.getTime()) ? String(iso) : d.toLocaleTimeString() }
// Time for today, month/day otherwise: a branch pushed days ago must not look like it was pushed today.
function formatWhen(iso) { if (!iso) return '—'; const d = new Date(iso); if (Number.isNaN(d.getTime())) return String(iso); return d.toDateString() === new Date().toDateString() ? d.toLocaleTimeString() : `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}` }
function notice(message, isError) { const el = document.getElementById('notice'); el.textContent = message; el.className = 'notice' + (isError ? ' error' : ''); el.hidden = !message; UI.lastMessage = message }

// ------------------------------------------------------------------ host bridge (panel actions)
const pending = {}
let counter = 0
function hostCall(action, params) {
  if (PREVIEW) {
    if (action === 'workspace.readContext') { const w = DATA.worktrees[0]; return Promise.resolve(w ? { displayName: w.displayName, branch: w.branch, terminals: (w.bridgeTerminalIds || []).map((id) => ({ id })) } : null) }
    if (action === 'notifications.show') { console.log('notify', params); return Promise.resolve({ delivered: true }) }
    return Promise.reject(new Error('preview: ' + action + ' unavailable'))
  }
  return new Promise((resolve, reject) => {
    const requestId = 'p' + (++counter)
    pending[requestId] = { resolve, reject }
    window.parent.postMessage({ type: 'orca-panel-action', requestId, action, params }, '*')
    setTimeout(() => { if (pending[requestId]) { delete pending[requestId]; reject(new Error('호스트 응답 없음 (' + action + ')')) } }, 8000)
  })
}
window.addEventListener('message', (event) => {
  const data = event.data
  if (!data || event.source !== window.parent) return
  if (data.type === 'orca-panel-action-result') {
    const entry = pending[data.requestId]
    if (!entry) return
    delete pending[data.requestId]
    if (data.ok) entry.resolve(data.value); else entry.reject(new Error(data.error || data.errorCode || 'action failed'))
    return
  }
  if (data.type === 'orca-panel-data' && data.data && data.data.schemaVersion === 1) {   // patched host: data without reload
    // The host re-posts the same document whenever its theme/root attributes change; only real data counts.
    if (data.data.generatedAt && data.data.generatedAt === DATA.generatedAt) return
    DATA = data.data
    UI.pendingThreads = []; UI.pendingReplies = {}
    pickWorktree({ allowAutoSwitch: false })
    notifyRunTransitions()
    scheduleRender({ keepScroll: true })
  }
})

// ------------------------------------------------------------------ sending ops to the server through the bridge terminal
function encodeOp(op) {
  const bytes = new TextEncoder().encode(JSON.stringify(op))
  let binary = ''
  for (const byte of bytes) binary += String.fromCharCode(byte)
  return 'SR ' + btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
}
// The host only lets a panel type into terminals of the FOCUSED worktree, so the bridge we use is
// whichever registered bridge lives among the focused worktree's terminals — regardless of which
// worktree the panel is currently showing (ops carry their own worktree/session ids).
function bridgeTerminalId() {
  if (!CONTEXT) return null
  const focused = new Set((CONTEXT.terminals || []).map((terminal) => terminal.id))
  for (const worktree of DATA.worktrees || []) {
    const hit = (worktree.bridgeTerminalIds || []).find((id) => focused.has(id))
    if (hit) return hit
  }
  return null
}
async function send(op, { silent = false } = {}) {
  if (PREVIEW && PREVIEW_TOKEN) {
    const response = await fetch('/api/bridge', { method: 'POST', headers: { 'X-SR-Token': PREVIEW_TOKEN, 'Content-Type': 'application/json' }, body: JSON.stringify(op) })
    const payload = await response.json().catch(() => null)
    if (!response.ok) throw new Error(payload?.error?.message || ('HTTP ' + response.status))
    if ((op.op !== 'view' && op.op !== 'worktree.pin') || op.loadFile) await previewReload()
    return payload?.result
  }
  const terminalId = bridgeTerminalId()
  if (!terminalId) { showBridgePicker(); throw new Error('브리지 터미널이 없습니다. 먼저 "브리지 시작"을 누르세요.') }
  const line = encodeOp(op)
  const MAX = 3800
  if (line.length <= MAX) {
    const result = await hostCall('terminal.sendText', { terminalId, text: line, enter: true })
    if (!result || !result.accepted) throw new Error('터미널이 입력을 받지 않았습니다')
  } else {
    const chunkId = 'c' + Date.now().toString(36)
    const total = Math.ceil(line.length / MAX)
    for (let index = 0; index < total; index += 1) {
      const result = await hostCall('terminal.sendText', { terminalId, text: 'SRC ' + chunkId + ' ' + index + ' ' + total + ' ' + line.slice(index * MAX, (index + 1) * MAX), enter: true })
      if (!result || !result.accepted) throw new Error('터미널이 입력을 받지 않았습니다 (chunk ' + index + ')')
    }
  }
  if (!silent) notice('전송됨 — 패널이 곧 갱신됩니다.')
  return null
}
async function previewReload() {
  const response = await fetch('/panel-preview', { headers: { 'X-SR-Token': PREVIEW_TOKEN } })
  const html = await response.text()
  const payload = /<script type="application\/json" id="orca-panel-data">([\s\S]*?)<\/script>/.exec(html)
  if (payload) { DATA = JSON.parse(payload[1]); UI.pendingThreads = []; UI.pendingReplies = {}; pickWorktree({ allowAutoSwitch: false }); notifyRunTransitions(); render({ keepScroll: true }) }
}

// ------------------------------------------------------------------ context + worktree selection
async function loadContext(options = {}) {
  try { CONTEXT = await hostCall('workspace.readContext', {}) } catch (error) { CONTEXT = null; notice(error.message, true) }
  pickWorktree(options)
}
function contextKey() { return CONTEXT ? CONTEXT.displayName + '|' + CONTEXT.branch : 'none' }
/** Best worktree for the host's focused context (shared terminals first, then branch, then display name). */
function matchFocusedWorktree() {
  const worktrees = DATA.worktrees || []
  let match = null
  if (CONTEXT) {
    const contextTerminals = new Set((CONTEXT.terminals || []).map((t) => t.id))
    const shortBranch = String(CONTEXT.branch || '').replace(/^refs\/heads\//, '')
    // Score every worktree: shared live terminals count most; branch/displayName break ties.
    const scored = worktrees.map((w) => {
      const shared = (w.terminalIds || []).filter((id) => contextTerminals.has(id)).length
      const score = shared * 100 + (w.branch === shortBranch ? 10 : 0) + (w.displayName === CONTEXT.displayName ? 1 : 0)
      return { w, score }
    }).filter((entry) => entry.score > 0).sort((a, b) => b.score - a.score)
    match = scored.length ? scored[0].w : null
  }
  return match
}
function hasUnsentWork() { return Boolean(UI.pendingForm || UI.selection || UI.draft || Object.keys(UI.drafts).length) }
/**
 * Decides which worktree the panel shows. A worktree pinned by hand stays. Otherwise the panel follows the
 * host focus, except that it never jumps away while a comment is being written: it offers a banner instead.
 */
function pickWorktree({ allowAutoSwitch = true } = {}) {
  const worktrees = DATA.worktrees || []
  const focused = matchFocusedWorktree()
  // A remounted iframe starts empty: take back the hand-picked worktree the server remembered (once, so a later unpin sticks).
  if (!UI.pinRestored) { UI.pinRestored = true; if (!UI.manualWorktree) UI.manualWorktree = restorePinned(DATA.pinnedWorktree, worktrees) }
  if (UI.manualWorktree) {
    ACTIVE_WORKTREE = worktrees.find((w) => w.path === UI.manualWorktree) || ACTIVE_WORKTREE || focused
  } else if (!ACTIVE_WORKTREE || (allowAutoSwitch && !hasUnsentWork())) {
    ACTIVE_WORKTREE = focused || ACTIVE_WORKTREE
  } else if (ACTIVE_WORKTREE) {
    // keep the current one; refresh its entry from the new data
    ACTIVE_WORKTREE = worktrees.find((w) => w.path === ACTIVE_WORKTREE.path) || ACTIVE_WORKTREE
  }
  UI.focusCandidate = focused && ACTIVE_WORKTREE && focused.path !== ACTIVE_WORKTREE.path ? focused : null
}
function activeSession() {
  if (!ACTIVE_WORKTREE || !ACTIVE_WORKTREE.sessionId) return null
  return DATA.sessions?.[ACTIVE_WORKTREE.sessionId] || null
}

// ------------------------------------------------------------------ rendering
const app = document.getElementById('app')
function captureFocus() {
  const el = document.activeElement
  if (!el || !(el instanceof HTMLTextAreaElement || el instanceof HTMLInputElement || el instanceof HTMLSelectElement)) return null
  const key = el.id ? '#' + el.id : el.dataset.replyText ? `[data-reply-text="${el.dataset.replyText}"]` : null
  if (!key) return null
  return { key, start: el.selectionStart, end: el.selectionEnd }
}
function restoreFocus(saved) {
  if (!saved) return
  const el = document.querySelector(saved.key)
  if (!el) return
  el.focus({ preventScroll: true })
  try { if (typeof saved.start === 'number' && el.setSelectionRange) el.setSelectionRange(saved.start, saved.end) } catch { /* ignore */ }
}
// A re-render while a <select> is open closes it under the user's cursor: defer until it settles.
let deferredRender = null
function scheduleRender(options) {
  const active = document.activeElement
  if (active instanceof HTMLSelectElement) {
    deferredRender = options
    const flush = () => { active.removeEventListener('blur', flush); active.removeEventListener('change', flush); if (deferredRender) { const pending = deferredRender; deferredRender = null; render(pending) } }
    active.addEventListener('blur', flush, { once: true })
    active.addEventListener('change', flush, { once: true })
    return
  }
  render(options)
}
function render({ keepScroll = false } = {}) {
  const scrollY = window.scrollY
  const focus = captureFocus()
  saveDraft()
  renderTabs()
  const banner = document.getElementById('focusBanner')
  if (banner) {
    if (UI.focusCandidate && ROUTE === 'review') {
      banner.hidden = false
      banner.innerHTML = h`포커스된 worktree 는 <b>${UI.focusCandidate.repoDisplayName} · ${UI.focusCandidate.branch}</b> 입니다. <button type="button" class="btn small" id="switchToFocused">그 worktree 로 전환</button>${UI.manualWorktree ? raw(' <button type="button" class="btn ghost small" id="unpinWorktree">고정 해제</button>') : ''}`
      banner.querySelector('#switchToFocused').addEventListener('click', () => { UI.manualWorktree = null; sendPin(null); UI.selection = null; UI.pendingForm = false; UI.draft = ''; ACTIVE_WORKTREE = UI.focusCandidate; UI.focusCandidate = null; UI.file = null; render() })
      banner.querySelector('#unpinWorktree')?.addEventListener('click', () => { UI.manualWorktree = null; sendPin(null); pickWorktree(); render() })
    } else banner.hidden = true
  }
  const session = activeSession()
  const viewState = session ? DATA.viewState?.[session.session.id] : null
  if (!UI.file && viewState?.file) UI.file = viewState.file
  if (ROUTE === 'overview') renderOverview()
  else if (ROUTE === 'history') renderHistory(session)
  else renderReview(session)
  document.getElementById('title').textContent = ACTIVE_WORKTREE ? `${ACTIVE_WORKTREE.repoDisplayName} · ${ACTIVE_WORKTREE.branch}` : 'Self Review'
  restoreDraft()
  if (keepScroll) window.scrollTo(0, scrollY)
  else if (!UI.scrollRestored && viewState && ROUTE === 'review') {
    UI.scrollRestored = true
    // After a regeneration the server tells us where the last comment went; land there instead of at the top.
    setTimeout(() => {
      const anchor = viewState.anchor
      const row = anchor ? document.querySelector(`#${fileDomId(anchor.path)} .gutter[data-side="${anchor.side}"][data-line="${anchor.endLine}"]`) : null
      if (row) row.scrollIntoView({ block: 'center' })
      else window.scrollTo(0, viewState.scroll || 0)
    }, 0)
  }
  restoreFocus(focus)
}
function renderTabs() {
  const current = activeSession()
  const historyCount = current ? (DATA.runHistory?.[current.session.id] || []).length : 0
  document.getElementById('tabs').innerHTML = h`<button type="button" class="tab ${ROUTE === 'review' ? 'active' : ''}" data-route="review">리뷰</button><button type="button" class="tab ${ROUTE === 'history' ? 'active' : ''}" data-route="history">AI 기록${historyCount ? ' (' + historyCount + ')' : ''}</button><button type="button" class="tab ${ROUTE === 'overview' ? 'active' : ''}" data-route="overview">전체 PR·세션</button>`
  for (const tab of document.querySelectorAll('.tab')) tab.addEventListener('pointerdown', (event) => { event.preventDefault(); ROUTE = tab.dataset.route; render({ keepScroll: false }); window.scrollTo(0, 0) })
}

// ------------------------------------------------------------------ AI run history
// Every AI run of this worktree, newest first. One run can be opened to see the threads it received, the diff it
// produced (saved when it finished, so it survives a commit) and the agent output.
function historyRowHtml(row, openRunId) {
  const open = row.id === openRunId
  const when = new Date(row.startedAt)
  const took = row.endedAt ? formatDuration(new Date(row.endedAt) - when) : '진행 중'
  const outcome = row.mode === 'answer' ? '답변 ' + row.answeredCount + '/' + row.threadCount + '개' : '변경 파일 ' + row.changedCount + '개'
  const pushed = row.published ? h` <span class="badge">푸시됨 ${String(row.published.commit).slice(0, 8)}</span>` : ''

// One request = one run. Each question thread is shown together with the answer this run gave it.
function historyThreadsHtml(row) {
  const threads = row.threads
  if (threads === null || threads === undefined) return '<div class="card-body small muted">질문 목록이 커서 목록에 싣지 못했습니다. 아래 "불러오기"를 누르세요.</div>'
  if (!threads.length) return '<div class="card-body small muted">이 실행이 받은 스레드가 남아 있지 않습니다.</div>'
  const blocks = threads.map((thread, index) => {
    const range = thread.startLine === thread.endLine ? thread.startLine : thread.startLine + '–' + thread.endLine
    const question = (thread.comments || []).map((comment) => h`<div class="comment ${comment.author === 'ai' ? 'ai' : ''}"><div class="meta"><span>${comment.author === 'ai' ? 'AI' : '나'}</span></div><div class="body">${comment.body}</div></div>`).join('')
    let reply = ''
    if (thread.answer) reply = h`<div class="comment ai"><div class="meta"><span>AI 답변</span></div><div class="body">${thread.answer}</div></div>`

    return h`<div class="history-thread"><div class="mono small">${index + 1}. ${thread.path}:${range}</div>${raw(question)}${raw(reply)}</div>`
  })
  return '<div class="card-body">' + blocks.join('') + '</div>'
}

  const exit = row.exitCode !== null && row.exitCode !== undefined ? ' · exit ' + row.exitCode : ''
  const branch = row.branch ? ' · ' + row.branch : ''
  const shown = { ...row, threads: row.threads ?? (extra ? extra.threads : null) }

function renderHistory(session) {
  if (!session) {
    app.innerHTML = h`<div class="card" style="margin-top:8px"><div class="card-body muted">리뷰 세션을 먼저 시작하면 AI 실행 기록이 여기에 쌓입니다.</div></div>`
    return
  }
  const s = session.session
  const rows = DATA.runHistory?.[s.id] || []
  if (UI.historyOpen === undefined && rows.length) UI.historyOpen = rows[0].id // the newest request is open from the start
  const openRow = rows.find((row) => row.id === UI.historyOpen) || null
  const loaded = DATA.runDetail?.[s.id]
  const extra = openRow && loaded && loaded.runId === openRow.id ? loaded : null
  if (extra && UI.historyLoading === openRow.id) UI.historyLoading = null
  const loading = Boolean(openRow) && UI.historyLoading === openRow.id
  const empty = '<div class="muted small">아직 AI 실행 기록이 없습니다. 리뷰 화면에서 "리뷰 완료 및 AI 수정"이나 "AI 답변 요청"을 실행하면 여기에 남습니다.</div>'
  const list = rows.map((row) => historyRowHtml(row, UI.historyOpen) + (openRow && row.id === openRow.id ? historyDetailHtml(row, extra, loading) : '')).join('')
  app.innerHTML = h`
    <div class="card" style="margin-top:8px">
      <div class="card-body"><div class="row">${raw(worktreeSwitcherHtml())}<span class="muted small">이 worktree 의 AI 요청 ${rows.length}건 · 최신순 · 눌러서 펼치기</span></div></div>
      <div class="card-body" style="padding:4px">${raw(rows.length ? list : empty)}</div>
    </div>`
  // Opening and closing a request is purely local: no bridge op, so it is instant.
  for (const item of app.querySelectorAll('[data-history-run]')) {
    item.addEventListener('click', () => { UI.historyOpen = UI.historyOpen === item.dataset.historyRun ? null : item.dataset.historyRun; render({ keepScroll: true }) })
  }
  app.querySelector('#closeHistoryRun')?.addEventListener('click', () => { UI.historyOpen = null; render({ keepScroll: true }) })
  // Only the heavy parts of an old run (diff, log) come from the server, and only when asked for.
  app.querySelector('#loadHistoryRun')?.addEventListener('click', () => {
    const runId = openRow.id
    UI.historyLoading = runId
    render({ keepScroll: true })
    setTimeout(() => { if (UI.historyLoading === runId) { UI.historyLoading = null; render({ keepScroll: true }) } }, 15000)
    act(() => send({ op: 'run.view', sessionId: s.id, runId }))
  })
  bindWorktreeSwitcher()
}

  app.querySelector('#cancelRun')?.addEventListener('click', (e) => act(() => send({ op: 'run.cancel', runId: e.currentTarget.dataset.run })))
  app.querySelector('#publishRun')?.addEventListener('click', (e) => { const button = e.currentTarget; if (armConfirm(button, { armedLabel: '정말 push', message: s.branch + ' 브랜치에 이 실행이 바꾼 파일을 커밋하고 push 합니다. 한 번 더 누르면 실행됩니다' }) === 'confirmed') act(() => send({ op: 'run.publish', runId: button.dataset.run })) })
  app.querySelector('#runLog')?.addEventListener('toggle', (e) => { UI.runLogOpen = e.target.open })
  app.querySelector('#dismissRun')?.addEventListener('click', () => { UI.dismissedRun = run.id; render({ keepScroll: true }) })
  for (const b of app.querySelectorAll('[data-jump-file]')) b.addEventListener('click', () => { const path = b.dataset.jumpFile; UI.collapsedFiles.delete(path); refreshFile(path); document.getElementById(fileDomId(path))?.scrollIntoView({ block: 'start' }) })
  startRunTicker(run)
  app.querySelector('#fileListHead').addEventListener('click', () => { UI.filesCollapsed = !UI.filesCollapsed; render({ keepScroll: true }) })
  app.querySelector('#collapseAll').addEventListener('click', () => { for (const f of files) UI.collapsedFiles.add(f.path); renderFile(session) })
  app.querySelector('#expandAll').addEventListener('click', () => { UI.collapsedFiles.clear(); renderFile(session) })
  for (const item of app.querySelectorAll('[data-file]')) item.addEventListener('click', () => {
    UI.file = item.dataset.file
    const picked = files.find((f) => f.path === UI.file)
    UI.collapsedFiles.delete(UI.file)
    refreshFile(UI.file)
    document.getElementById(fileDomId(UI.file))?.scrollIntoView({ block: 'start' })
    if (picked && picked.panelTruncated) act(() => send({ op: 'view', sessionId: s.id, route: ROUTE, file: UI.file, scroll: window.scrollY, loadFile: true }))
  })
  bindWorktreeSwitcher()
  bindBridgePicker()
  renderFile(session)
}

const RUN_LABELS = { queued: '대기 중', running: '실행 중', succeeded: '완료', failed: '실패', cancelled: '취소됨', interrupted: '중단됨 (서버 재시작)' }
function formatDuration(ms) { const sec = Math.max(0, Math.round(ms / 1000)); return sec < 60 ? sec + '초' : Math.floor(sec / 60) + '분 ' + (sec % 60) + '초' }
function runCardHtml(run) {
  const live = run.status === 'running' || run.status === 'queued'
  const started = new Date(run.startedAt)
  const ended = run.endedAt ? new Date(run.endedAt) : null
  const changed = run.changedFiles || []
  return h`<div class="run ${live ? 'live' : ''}">
    <div class="card-head">${live ? raw('<span class="spinner"></span>') : ''}${run.mode === 'answer' ? 'AI 답변' : 'AI 수정'} <span class="badge ${live ? 'warn' : ''}">${RUN_LABELS[run.status] || run.status}</span><span class="muted small">${run.agent} · 스레드 ${run.threadIds.length}개 · <span id="runElapsed" data-started="${run.startedAt}" data-ended="${run.endedAt || ''}">${formatDuration((ended || new Date()) - started)}</span>${run.exitCode !== null && run.exitCode !== undefined ? ' · exit ' + run.exitCode : ''}</span><span style="flex:1"></span>${live ? raw(h`<button type="button" class="btn small danger" id="cancelRun" data-run="${run.id}">취소</button>`) : raw('<button type="button" class="btn ghost small" id="dismissRun">닫기</button>')}</div>
    ${live ? raw(h`<div class="card-body small muted">${run.mode === 'answer' ? run.agent + ' 가 질문을 읽고 답변을 쓰는 중입니다. 끝나면 답변이 스레드에 달립니다 (코드는 수정하지 않습니다).' : run.agent + ' 가 코멘트대로 코드를 고치는 중입니다. 끝나면 이 카드가 "완료"로 바뀌고 diff 가 자동 갱신됩니다.'} 시작 ${started.toLocaleTimeString()}</div>`) : ''}
    ${!live && run.mode === 'answer' ? raw(answerResultHtml(run)) : ''}
    ${!live && run.mode !== 'answer' ? raw(h`<div class="card-body small"><div>${run.status === 'succeeded' ? '에이전트가 작업을 마쳤습니다.' : run.status === 'failed' ? '에이전트가 오류로 끝났습니다 (로그 확인).' : run.status === 'cancelled' ? '취소되었습니다.' : '서버 재시작으로 추적이 끊겼습니다.'} ${started.toLocaleTimeString()} → ${ended ? ended.toLocaleTimeString() : '—'}</div>
      <div style="margin-top:4px"><strong>변경 파일 ${changed.length}개</strong>${changed.length ? '' : ' — 파일 변경이 감지되지 않았습니다. 로그에서 사유를 확인하세요.'}</div>
      ${raw(changed.map((path) => h`<div><button type="button" class="btn ghost small mono" data-jump-file="${path}">${path}</button></div>`).join(''))}
      <div class="muted" style="margin-top:4px">AI 의 수정은 <b>아직 커밋되지 않은 작업 트리 변경</b>이라 PR 기준 diff 에는 나타나지 않습니다. 아래 "AI 가 바꾼 내용"에서 확인하고, 괜찮으면 아래 "커밋 &amp; 푸시"를 누르거나 직접 커밋하세요. 이 실행의 대상 스레드에는 <span class="badge">AI 실행 포함</span> 표시가 붙습니다.</div>${raw(publishHtml(run))}</div>
    ${raw(aiChangesHtml(run))}`) : ''}

// Commit + push of what an AI fix run changed. The server does it (not the AI), only after the button is pressed twice.
function publishHtml(run) {
  const changed = (run.changedFiles || []).length
  if (run.published) return h`<div style="margin-top:6px"><span class="badge">푸시됨</span> <span class="mono">${String(run.published.commit).slice(0, 8)}</span> → <span class="mono">${run.published.branch}</span></div>`
  if (run.status !== 'succeeded' || !changed) return ''
  const error = run.publishError ? h`<div class="notice error" style="margin:6px 0">${run.publishError.message}${run.publishError.commit ? ' — 로컬 커밋 ' + String(run.publishError.commit).slice(0, 8) + ' 은 남아 있습니다. 같은 버튼으로 push 만 다시 시도하거나 직접 push 하세요.' : ''}</div>` : ''
  return error + h`<div style="margin-top:6px"><button type="button" class="btn primary small" id="publishRun" data-run="${run.id}">커밋 &amp; 푸시 (파일 ${changed}개)</button> <span class="muted small">이 실행이 바꾼 파일만 커밋해 현재 브랜치에 push 합니다 (두 번 눌러 확정)</span></div>`
}
function answerResultHtml(run) {
  const total = (run.threadIds || []).length
  const answered = (run.answered || []).length
  const text = run.status === 'succeeded' ? '답변 ' + answered + '/' + total + '개를 스레드에 달았습니다.' + (answered < total ? ' 일부는 답변을 만들지 못했습니다. 로그를 확인하세요.' : '') : run.status === 'failed' ? '에이전트가 오류로 끝났습니다 (로그 확인).' : run.status === 'cancelled' ? '취소되었습니다.' : '서버 재시작으로 추적이 끊겼습니다.'
  return h`<div class="card-body small"><div>${text}</div></div>`
}
function aiChangesHtml(run, { history = false } = {}) {
  const changes = run.aiChanges
  if (!changes) return ''
  if (changes.error) return h`<div class="card-body small muted">AI 변경 내용을 읽지 못했습니다: ${changes.error}</div>`
  if (!changes.length) return history ? '<div class="card-body small muted">저장된 변경 내용이 없습니다 (기록 기능 이전의 실행이거나 변경 파일이 없던 실행).</div>' : '<div class="card-body small muted">변경 파일이 기록됐지만 현재 작업 트리에서는 차이가 없습니다 (이미 커밋했거나 되돌린 경우).</div>'
  const blocks = changes.map((file) => {
    const rows = []
    if (file.binary || file.truncated || !file.hunks.length) rows.push('<div class="empty">' + (file.binary ? '바이너리 파일' : history ? '크기가 커서 기록에 diff 를 싣지 못했습니다.' : '패널에 표시하기엔 큽니다 — "넓게" 로 보세요.') + '</div>')
    else {
      rows.push('<table class="diff"><colgroup><col class="g"><col class="m"><col></colgroup><tbody>')
      for (const hunk of file.hunks) {
        rows.push(h`<tr class="hunk"><td colspan="3">${hunk.header}</td></tr>`)
        for (const line of hunk.lines) {
          const number = line.type === 'del' ? line.oldNo : line.newNo
          rows.push(h`<tr class="${line.type}"><td class="gutter disabled">${number ?? ''}</td><td class="marker">${line.type === 'add' ? '+' : line.type === 'del' ? '−' : ''}</td><td class="code">${line.text}</td></tr>`)
        }
      }
      rows.push('</tbody></table>')

    return h`<div class="file-block" data-ai-file="${file.path}"><div class="file-head" style="position:static"><span class="name mono" title="${file.path}">${file.path}</span><span class="badge">${file.changeType}</span><span class="small"><span class="add-count">+${file.additions}</span> <span class="del-count">−${file.deletions}</span></span></div>${raw(rows.join(''))}</div>`
  })
  return '<div class="card-head" style="border-top:1px solid var(--border)">AI 가 바꾼 내용 <span class="muted small">' + (history ? '실행 직후 기록 · 파일 ' + changes.length + '개' : 'HEAD 대비 작업 트리 · 파일 ' + changes.length + '개 · 커밋 전') + '</span></div><div style="padding:6px 0">' + blocks.join('') + '</div>'
}
let runTicker = null
function startRunTicker(run) {
  clearInterval(runTicker)
  if (!run || !(run.status === 'running' || run.status === 'queued')) return
  runTicker = setInterval(() => {
    const el = document.getElementById('runElapsed')
    if (!el) { clearInterval(runTicker); return }
    el.textContent = formatDuration(Date.now() - new Date(el.dataset.started).getTime())
  }, 1000)
}
function notifyRunTransitions() {
  for (const [sessionId, run] of Object.entries(DATA.runs || {})) {
    const previous = UI.lastRunStatus[sessionId]
    UI.lastRunStatus[sessionId] = run.status

    }
  }
}
function bridgeStatusHtml() {

  return h`<div class="card"><div class="card-body"><div class="small" style="margin-bottom:4px"><strong>브리지 터미널 없음</strong> — 서버가 1분 안에 "Self Review bridge" 터미널을 자동으로 다시 만듭니다. 그 탭은 닫지 마세요. 바로 필요하면 커맨드 팔레트 <code>Self Review: 현재 worktree 리뷰</code> 를 실행하세요.</div><details><summary class="small">수동으로 시작</summary><div class="row"><select id="bridgePicker" ${raw(terminals.length ? '' : 'disabled')}>${raw(terminals.length ? terminals.map((t, i) => h`<option value="${t.id}" ${raw(UI.picker === t.id ? 'selected' : '')}>터미널 ${i + 1} (…${String(t.id).slice(-6)})</option>`).join('') : '<option value="">열린 터미널 없음</option>')}</select><button type="button" class="btn primary small" id="startBridge" ${raw(terminals.length ? '' : 'disabled')}>브리지 시작</button></div><div class="muted small" style="margin-top:4px">에이전트(claude/codex) TUI 가 아닌 <b>셸 터미널</b>을 고르세요. 그 터미널이 브리지로 전환됩니다.</div></details></div></div>`

function fileDomId(path) { return 'file-' + String(path).replace(/[^a-zA-Z0-9_-]/g, (c) => '_' + c.charCodeAt(0).toString(16)) }

// Threads where the reviewer's comment is the latest word: open, up to date, and not already answered by the AI.
function awaitingCount(session) {
  return session.threads.filter((thread) => thread.status === 'open' && thread.applicability === 'current' && thread.comments[thread.comments.length - 1]?.author !== 'ai').length
}

// "전체 보기": the whole file as context instead of a few lines around each change. Only for local sessions and
// files that exist on both sides (added/deleted/untracked files are already shown completely).
function fullToggleHtml(session, file) {
  if (session.kind !== 'local' || file.binary || (file.changeType !== 'modified' && file.changeType !== 'renamed')) return ''
  const failed = file.fullContextError ? h`<span class="badge warn" title="${file.fullContextError}">전체 보기 실패</span>` : ''
  return failed + h`<button type="button" class="btn ghost small" data-full-toggle="${file.path}" data-full="${file.fullContext ? '0' : '1'}" title="${file.fullContext ? '변경된 부분만 보기' : '파일 전체 코드 보기'}">${file.fullContext ? '변경점만' : '전체 보기'}</button>`
}

function fileBlockHtml(session, file) {
  const { session: s } = session
  const canComment = Boolean(PREVIEW || bridgeTerminalId())
  const threads = [...s.threads.filter((t) => t.path === file.path), ...UI.pendingThreads.filter((t) => t.path === file.path)]
  const placement = placeThreads(threads)
  const collapsed = UI.collapsedFiles.has(file.path)
  const out = []
  const add = (x) => { out[out.length] = x }
  add(h`<div class="file-block ${collapsed ? 'collapsed' : ''}" id="${fileDomId(file.path)}" data-file-block="${file.path}">`)
  add(h`<div class="file-head"><button type="button" class="btn ghost small" data-toggle-file="${file.path}" title="${collapsed ? '펼치기' : '접기'}">${collapsed ? '▸' : '▾'}</button><span class="name mono" title="${file.path}">${file.path}${file.oldPath ? raw(h`<span class="muted"> ← ${file.oldPath}</span>`) : ''}</span>${raw(fullToggleHtml(s, file))}<span class="badge">${file.changeType}</span><span class="small"><span class="add-count">+${file.additions}</span> <span class="del-count">−${file.deletions}</span>${threads.length ? ' 💬' + threads.length : ''}</span></div>`)
  if (!collapsed) {
    if (file.binary || file.truncated || !file.hunks.length) {
      add(h`<div class="empty">${file.binary ? '바이너리 파일' : file.panelTruncated ? '이 파일의 diff 는 아직 패널에 실리지 않았습니다.' : file.truncated ? 'diff가 20,000줄을 초과합니다.' : '표시할 hunk 없음'}${file.panelTruncated ? raw(h`<div style="margin-top:6px"><button type="button" class="btn primary small" data-load-file="${file.path}">이 파일 불러오기</button></div>`) : ''}</div>`)
    } else {
      add('<table class="diff"><colgroup><col class="g"><col class="m"><col></colgroup><tbody>')
      for (const hunk of file.hunks) {
        add(h`<tr class="hunk"><td colspan="3">${hunk.header}</td></tr>`)
        for (const line of hunk.lines) {
          const side = line.type === 'del' ? 'old' : 'new'
          const number = side === 'old' ? line.oldNo : line.newNo
          const selected = number !== null && isLineSelected(UI.selection, { path: file.path, side, line: number })
          const enabled = canComment && number !== null
          add(h`<tr class="${line.type}${selected ? ' selected' : ''}"><td class="gutter ${enabled ? '' : 'disabled'}" ${raw(enabled ? `tabindex="0" data-path="${escapeHtml(file.path)}" data-side="${side}" data-line="${number}"` : '')}>${number ?? ''}</td><td class="marker">${line.type === 'add' ? '+' : line.type === 'del' ? '−' : ''}</td><td class="code">${line.text}</td></tr>`)
          if (number !== null) {
            const here = placement[threadKey(file.path, side, number)]
            if (here) add(`<tr class="thread-row"><td colspan="3">${here.map(threadHtml).join('')}</td></tr>`)
            if (UI.pendingForm && UI.selection && UI.selection.path === file.path && UI.selection.side === side && clampRange(UI.selection).endLine === number) add(`<tr class="thread-row"><td colspan="3">${formHtml()}</td></tr>`)
          }
        }
      }
      add('</tbody></table>')
      const orphaned = threads.filter((t) => !file.hunks.some((hk) => hk.lines.some((l) => (t.side === 'old' ? l.oldNo : l.newNo) === t.endLine)))
      if (orphaned.length) add('<div class="card-body"><div class="small muted">현재 diff 에서 위치를 찾지 못한 스레드</div>' + orphaned.map(threadHtml).join('') + '</div>')
    }
  }
  add('</div>')
  return out.join('')
}

function bindFileBlock(host, session) {
  const { session: s } = session
  for (const b of host.querySelectorAll('[data-toggle-file]')) b.addEventListener('click', () => { const path = b.dataset.toggleFile; if (UI.collapsedFiles.has(path)) UI.collapsedFiles.delete(path); else UI.collapsedFiles.add(path); refreshFile(path) })
  for (const b of host.querySelectorAll('[data-full-toggle]')) b.addEventListener('click', () => act(() => send({ op: 'file.full', sessionId: s.id, path: b.dataset.fullToggle, full: b.dataset.full === '1' })))
  for (const b of host.querySelectorAll('[data-load-file]')) b.addEventListener('click', () => act(() => send({ op: 'view', sessionId: s.id, route: ROUTE, file: b.dataset.loadFile, scroll: window.scrollY, loadFile: true })))
  bindThreadHandlers(host, s)
}

/** Renders every changed file in sequence (PR "Files changed" layout). */
function renderFile(session) {
  const host = document.getElementById('filePanel')
  if (!host) return
  const files = session.diff.files || []
  const known = new Set(files.map((file) => file.path))
  const elsewhere = session.session.threads.filter((thread) => !known.has(thread.path))
  const blocks = files.length ? files.map((file) => fileBlockHtml(session, file)).join('') : '<div class="empty">변경 사항이 없습니다.</div>'
  const orphanSection = elsewhere.length
    ? '<div class="card" id="orphan-threads"><div class="card-head">현재 diff 에 없는 파일의 스레드 <span class="muted small">' + elsewhere.length + '</span></div><div class="card-body small muted">base 나 비교 모드를 바꾸면 다시 diff 안에 나타날 수 있습니다. 해결·삭제·답글은 그대로 가능합니다.</div><div class="card-body">' +
      elsewhere.map((thread) => '<div class="muted small mono" style="margin-top:6px">' + escapeHtml(thread.path) + '</div>' + threadHtml(thread)).join('') + '</div></div>'
    : ''
  host.innerHTML = blocks + orphanSection
  bindFileBlock(host, session)
}

/** Re-renders a single file block (used while dragging so the whole page does not repaint). */
function refreshFile(path) {
  const session = activeSession()
  const file = session?.diff.files.find((f) => f.path === path)
  const old = document.getElementById(fileDomId(path))
  if (!session || !file || !old) { if (session) renderFile(session); return }
  const focus = captureFocus()
  saveDraft()
  const wrapper = document.createElement('div')
  wrapper.innerHTML = fileBlockHtml(session, file)
  const fresh = wrapper.firstElementChild
  old.replaceWith(fresh)
  bindFileBlock(fresh, session)
  restoreDraft()
  restoreFocus(focus)
}

function threadHtml(thread) {
  const expanded = UI.expanded.has(thread.id)
  const range = thread.startLine === thread.endLine ? 'L' + thread.startLine : 'L' + thread.startLine + '–L' + thread.endLine
  const pendingReplies = UI.pendingReplies[thread.id] || []
  const busy = UI.sending ? 'disabled' : ''
  const latestRun = activeSession() ? DATA.runs?.[activeSession().session.id] : null
  const handledByAi = latestRun && latestRun.status === 'succeeded' && (latestRun.threadIds || []).includes(thread.id)
  if (thread.pending) {
    return h`<div class="thread pending" data-thread="${thread.id}">
      <div class="thread-head"><span class="badge warn">전송 중…</span><span class="mono">${thread.side} ${range}</span><span class="grow"></span><span class="muted small">브리지 → 서버, 곧 갱신됩니다</span></div>
      <div class="thread-body">${raw(thread.comments.map((c) => h`<div class="comment"><div class="meta"><span>나</span><span>방금</span></div><div class="body">${c.body}</div></div>`).join(''))}</div></div>`
  }
  return h`<div class="thread ${thread.status === 'resolved' ? 'resolved' : ''} ${expanded ? 'expanded' : ''}" data-thread="${thread.id}">
    <div class="thread-head"><span class="badge">${thread.status === 'open' ? '열림' : '해결'}</span>${thread.applicability === 'outdated' ? raw('<span class="badge warn" title="현재 diff에서 원문을 찾지 못함">outdated</span>') : ''}${handledByAi ? raw('<span class="badge" title="마지막 AI 실행의 대상 스레드 — 결과는 실행 카드의 \'AI 가 바꾼 내용\' 참고">AI 실행 포함</span>') : ''}<span class="mono">${thread.side} ${range}</span><span class="grow"></span>${thread.status === 'resolved' ? raw(h`<button type="button" class="btn ghost small" data-toggle="${thread.id}">${expanded ? '접기' : '펼치기'}</button>`) : ''}<button type="button" class="btn small" ${raw(busy)} data-thread-status="${thread.status === 'open' ? 'resolved' : 'open'}" data-thread="${thread.id}">${thread.status === 'open' ? '해결' : '다시 열기'}</button><button type="button" class="btn small danger" ${raw(busy)} data-thread-delete="${thread.id}">삭제</button></div>
    <div class="thread-body">${raw(thread.comments.map((c) => h`<div class="comment${c.author === 'ai' ? ' ai' : ''}" data-comment="${c.id}"><div class="meta"><span>${c.author === 'ai' ? 'AI · ' + (c.agent || '') : '나'}</span><span>${formatTime(c.createdAt)}</span><span class="grow"></span>${c.author === 'ai' ? '' : raw(h`<button type="button" class="btn ghost small" ${raw(busy)} data-comment-edit="${c.id}" data-thread="${thread.id}">수정</button>`)}<button type="button" class="btn ghost small" ${raw(busy)} data-comment-delete="${c.id}" data-thread="${thread.id}">삭제</button></div><div class="body">${c.body}</div></div>`).join(''))}
      ${raw(pendingReplies.map((body) => h`<div class="comment pending"><div class="meta"><span>나</span><span class="badge warn">전송 중…</span></div><div class="body">${body}</div></div>`).join(''))}
      <div class="form"><textarea rows="2" placeholder="답글…" data-reply-text="${thread.id}"></textarea><div class="actions"><button type="button" class="btn primary small" ${raw(busy)} data-reply="${thread.id}">답글</button></div></div></div></div>`
}
function formHtml() {
  const { startLine, endLine } = clampRange(UI.selection)
  const range = startLine === endLine ? 'L' + startLine : 'L' + startLine + '–L' + endLine + ' (' + (endLine - startLine + 1) + '줄)'
  return h`<div class="thread"><div class="thread-head"><span class="mono">${UI.selection.side} ${range}</span><span class="grow"></span><span class="muted small">⌘/Ctrl+Enter 등록</span></div><div class="form"><textarea id="newComment" rows="3" placeholder="코멘트를 입력하세요">${UI.draft}</textarea><div class="actions"><button type="button" class="btn small" id="cancelComment">취소</button><button type="button" class="btn primary small" id="submitComment" ${raw(UI.sending ? 'disabled' : '')}>${UI.sending ? '전송 중…' : '코멘트 등록'}</button></div></div></div>`
}
function selectedText(session, selection) {
  const file = session.diff.files.find((f) => f.path === selection.path)
  const { startLine, endLine } = clampRange(selection)
  const lines = []
  for (const hunk of file?.hunks || []) for (const line of hunk.lines) {
    const number = selection.side === 'old' ? line.oldNo : line.newNo
    if (number !== null && number >= startLine && number <= endLine && (selection.side === 'old' ? line.type === 'del' : line.type !== 'del')) lines.push(line.text)
  }
  return lines.join('\n')
}
function bindThreadHandlers(host, s) {
  const session = activeSession()
  host.querySelector('#submitComment')?.addEventListener('click', submitNewComment)
  host.querySelector('#cancelComment')?.addEventListener('click', () => { UI.selection = null; UI.pendingForm = false; UI.draft = ''; render({ keepScroll: true }) })
  host.querySelector('#newComment')?.addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') submitNewComment(); if (e.key === 'Escape') { UI.selection = null; UI.pendingForm = false; UI.draft = ''; render({ keepScroll: true }) } })
  function submitNewComment() {
    const textarea = host.querySelector('#newComment')
    if (!textarea || !textarea.value.trim() || UI.sending) return
    const { startLine, endLine } = clampRange(UI.selection)
    const selection = UI.selection
    const file = session.diff.files.find((f) => f.path === selection.path)
    const body = textarea.value
    const op = { op: 'thread.add', sessionId: s.id, revision: s.revision, path: selection.path, oldPath: file?.oldPath ?? null, side: selection.side, startLine, endLine, selectedText: selectedText(session, selection), body }
    // Optimistic: show the comment in place right away and close the form; the regenerated panel replaces it.
    const placeholder = { id: 'pending_' + Date.now(), pending: true, path: selection.path, side: selection.side, startLine, endLine, status: 'open', applicability: 'current', comments: [{ id: 'p', body }] }
    UI.pendingThreads.push(placeholder)
    textarea.value = ''                       // must happen before refreshFile(): saveDraft() reads the live textarea
    UI.selection = null; UI.pendingForm = false; UI.draft = ''
    UI.sending = true
    refreshFile(selection.path)
    send(op, { silent: true }).then(() => { UI.sending = false; refreshFile(selection.path) }).catch((error) => {
      UI.sending = false
      UI.pendingThreads = UI.pendingThreads.filter((t) => t !== placeholder)
      UI.selection = selection; UI.pendingForm = true; UI.draft = body
      refreshFile(selection.path)
      notice(error.message, true)
    })
  }
  for (const b of host.querySelectorAll('[data-toggle]')) b.addEventListener('click', () => { const id = b.dataset.toggle; if (UI.expanded.has(id)) UI.expanded.delete(id); else UI.expanded.add(id); render({ keepScroll: true }) })
  for (const b of host.querySelectorAll('[data-thread-status]')) b.addEventListener('click', () => act(() => send({ op: 'thread.patch', sessionId: s.id, revision: s.revision, threadId: b.dataset.thread, status: b.dataset.threadStatus })))
  for (const b of host.querySelectorAll('[data-thread-delete]')) b.addEventListener('click', () => { if (armConfirm(b, { message: '스레드를 삭제할까요? 한 번 더 누르면 삭제됩니다' }) === 'confirmed') act(() => send({ op: 'thread.delete', sessionId: s.id, revision: s.revision, threadId: b.dataset.threadDelete })) })
  for (const b of host.querySelectorAll('[data-reply]')) b.addEventListener('click', () => {
    const threadId = b.dataset.reply
    const ta = host.querySelector(`[data-reply-text="${threadId}"]`)
    if (!ta || !ta.value.trim() || UI.sending) return
    const body = ta.value
    const thread = s.threads.find((t) => t.id === threadId)
    UI.pendingReplies[threadId] = [...(UI.pendingReplies[threadId] || []), body]
    ta.value = ''                             // before refreshFile(): saveDraft() would otherwise re-capture the sent text
    delete UI.drafts[threadId]
    UI.sending = true
    if (thread) refreshFile(thread.path)
    send({ op: 'comment.add', sessionId: s.id, revision: s.revision, threadId, body }, { silent: true }).then(() => { UI.sending = false; if (thread) refreshFile(thread.path) }).catch((error) => {
      UI.sending = false
      UI.pendingReplies[threadId] = (UI.pendingReplies[threadId] || []).filter((x) => x !== body)
      UI.drafts[threadId] = body
      if (thread) refreshFile(thread.path)
      notice(error.message, true)
    })
  })
  for (const b of host.querySelectorAll('[data-comment-delete]')) b.addEventListener('click', () => { if (armConfirm(b, { message: '코멘트를 삭제할까요? 한 번 더 누르면 삭제됩니다' }) === 'confirmed') act(() => send({ op: 'comment.delete', sessionId: s.id, revision: s.revision, threadId: b.dataset.thread, commentId: b.dataset.commentDelete })) })
  for (const b of host.querySelectorAll('[data-comment-edit]')) b.addEventListener('click', () => {
    const commentEl = host.querySelector(`[data-comment="${b.dataset.commentEdit}"] .body`)
    const thread = s.threads.find((t) => t.id === b.dataset.thread)
    const comment = thread.comments.find((c) => c.id === b.dataset.commentEdit)
    commentEl.innerHTML = h`<textarea rows="3">${comment.body}</textarea><div class="actions" style="display:flex;gap:6px;justify-content:flex-end;margin-top:4px"><button type="button" class="btn small" data-cancel-edit>취소</button><button type="button" class="btn primary small" data-save-edit>저장</button></div>`
    commentEl.querySelector('[data-cancel-edit]').addEventListener('click', () => render({ keepScroll: true }))
    commentEl.querySelector('[data-save-edit]').addEventListener('click', () => act(() => send({ op: 'comment.patch', sessionId: s.id, revision: s.revision, threadId: thread.id, commentId: comment.id, body: commentEl.querySelector('textarea').value })))
  })
}

// ------------------------------------------------------------------ gutter selection (drag / shift-click / keyboard)
function cellFromEvent(event) {
  const cell = event.target.closest?.('.gutter[data-line]')
  if (!cell) return null
  return { path: cell.dataset.path, side: cell.dataset.side, line: Number(cell.dataset.line) }
}
app.addEventListener('mousedown', (event) => {
  const cell = cellFromEvent(event)
  if (!cell || event.button !== 0) return
  event.preventDefault()
  UI.pendingForm = false
  const previousPath = UI.selection?.path
  UI.selection = event.shiftKey && UI.selection ? extendSelection(UI.selection, cell) : beginSelection(cell)
  UI.dragging = true
  if (previousPath && previousPath !== UI.selection.path) refreshFile(previousPath)
  refreshFile(UI.selection.path)
})
app.addEventListener('mouseover', (event) => {
  if (!UI.dragging) return
  const cell = cellFromEvent(event)
  if (!cell) return
  const next = extendSelection(UI.selection, cell)
  if (next !== UI.selection) { UI.selection = next; refreshFile(UI.selection.path) }
})
window.addEventListener('mouseup', () => { if (!UI.dragging) return; UI.dragging = false; if (UI.selection) { UI.pendingForm = true; refreshFile(UI.selection.path); setTimeout(() => document.getElementById('newComment')?.focus(), 0) } })
app.addEventListener('keydown', (event) => {
  const cell = cellFromEvent(event)
  if (!cell) return
  if (event.key === 'Enter') { event.preventDefault(); UI.selection = beginSelection(cell); UI.pendingForm = true; refreshFile(UI.selection.path); setTimeout(() => document.getElementById('newComment')?.focus(), 0) }
  if (event.shiftKey && (event.key === 'ArrowDown' || event.key === 'ArrowUp') && UI.selection) {
    event.preventDefault()
    UI.selection = extendSelection(UI.selection, { ...cell, line: UI.selection.head + (event.key === 'ArrowDown' ? 1 : -1) })
    UI.pendingForm = true
    refreshFile(UI.selection.path)
    app.querySelector(`.gutter[data-side="${UI.selection.side}"][data-line="${UI.selection.head}"]`)?.focus()
  }
})

// ------------------------------------------------------------------ actions, drafts, view state
async function act(operation, onSuccess) {
  try { await operation(); if (onSuccess) onSuccess(); if (PREVIEW) render({ keepScroll: true }) }
  catch (error) { notice(error.message, true) }
}
function saveDraft() {
  const ta = document.getElementById('newComment')
  if (ta) UI.draft = ta.value
  for (const el of document.querySelectorAll('[data-reply-text]')) {
    if (el.value) UI.drafts[el.dataset.replyText] = el.value
    else delete UI.drafts[el.dataset.replyText]
  }
}
function restoreDraft() {
  for (const el of document.querySelectorAll('[data-reply-text]')) if (UI.drafts[el.dataset.replyText]) el.value = UI.drafts[el.dataset.replyText]
}
let viewTimer = null
// Remember (or forget) the hand-picked worktree on the server so it survives the iframe being remounted.
// Best effort: without a bridge terminal there is nowhere to send it, and that must not pop the bridge picker.
function sendPin(worktreePath) {
  if (!PREVIEW && !bridgeTerminalId()) return
  send({ op: 'worktree.pin', worktreePath }, { silent: true }).catch(() => {})
}
function sendView(sessionId) {
  if (!sessionId) return
  clearTimeout(viewTimer)
  viewTimer = setTimeout(() => { send({ op: 'view', sessionId, route: ROUTE, file: UI.file, scroll: window.scrollY }, { silent: true }).catch(() => {}) }, 1200)
}
// Scroll position is intentionally NOT synced through the bridge: every terminal.sendText moves focus to the terminal.

document.getElementById('btnRefreshOverview').addEventListener('click', () => act(() => send({ op: 'overview.refresh' })))
document.getElementById('btnWide').addEventListener('click', () => { const s = activeSession(); if (s) act(() => send({ op: 'wide', sessionId: s.session.id })); else notice('세션을 먼저 시작하세요.', true) })

// ------------------------------------------------------------------ boot
loadContext().then(() => {
  for (const [sessionId, run] of Object.entries(DATA.runs || {})) UI.lastRunStatus[sessionId] = run.status
  const s = activeSession()
  const viewState = s ? DATA.viewState?.[s.session.id] : null
  if (viewState?.route) ROUTE = viewState.route
  if (!ACTIVE_WORKTREE && (DATA.worktrees || []).length === 0) ROUTE = 'overview'
  render()
})
// Re-read the host context on focus, but only re-render when the focused worktree really changed:
// a full re-render in the middle of a click swallows that click (the target node is replaced).
window.addEventListener('focus', () => {
  const before = contextKey()
  loadContext({ allowAutoSwitch: false }).then(() => { if (contextKey() !== before) scheduleRender({ keepScroll: true }) })
})
</script>
</body>
