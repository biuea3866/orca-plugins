ewNo":370,"text":""},{"type":"add","oldNo":null,"newNo":371,"text":"| 번호 | 확인 필요 사항 | 기본 가정 |"},{"type":"add","oldNo":null,"newNo":372,"text":"|---|---|---|"},{"type":"add","oldNo":null,"newNo":373,"text":"| OQ-01 | “GitHub 기록 없음”에 조회 요청의 서버 로그까지 포함하는지 | 리소스 생성·변경 금지; 읽기 요청 허용 |"},{"type":"add","oldNo":null,"newNo":374,"text":"| OQ-02 | AI가 수행하는 GitHub 변경도 강제로 차단해야 하는지 | 차단 필요; 실행 격리 검증을 출시 조건으로 설정 |"},{"type":"add","oldNo":null,"newNo":375,"text":"| OQ-03 | “전체 프로젝트”가 Orca 등록 저장소인지, GitHub 계정·조직 전체인지 | Orca 등록 저장소 |"},{"type":"add","oldNo":null,"newNo":376,"text":"| OQ-04 | PR 목록이 모든 작성자 대상인지 본인 PR만인지 | 모든 작성자, 작성자 필터 제공 |"},{"type":"add","oldNo":null,"newNo":377,"text":"| OQ-05 | 리뷰 기본 base 및 비교 방식 | 원격 추적 정보의 기본 브랜치 후보 표시 후 확인; merge-base 비교 |"},{"type":"add","oldNo":null,"newNo":378,"text":"| OQ-06 | 미커밋·untracked 파일 포함 여부 | staged·unstaged·untracked 포함, 제외 선택 가능 |"},{"type":"add","oldNo":null,"newNo":379,"text":"| OQ-07 | 기존 PR에도 로컬 코멘트를 작성해야 하는지 | 로컬 세션으로 생성 가능; AI 수정은 연결 worktree가 있을 때만 가능 |"},{"type":"add","oldNo":null,"newNo":380,"text":"| OQ-08 | 기존 Orca 에이전트 문맥 재사용이 필수인지 | 필수 아님; 추적 가능한 headless 실행 우선 |"},{"type":"add","oldNo":null,"newNo":381,"text":"| OQ-09 | Claude/Codex 코드 외부 전송 허용 여부 | 사용자가 에이전트 선택·실행 시 허용, 최초 실행 고지 필요 |"},{"type":"add","oldNo":null,"newNo":382,"text":"| OQ-10 | 셀프 리뷰 완료가 곧 최종 완료인지 | AI 실행 시작 의미; 수정 후 사람 재검토 별도 |"},{"type":"add","oldNo":null,"newNo":383,"text":"| OQ-11 | GitHub Enterprise 지원 필요 여부 | 1차는 github.com; 다른 remote는 지원 범위 안내 |"},{"type":"add","oldNo":null,"newNo":384,"text":"| OQ-12 | 코멘트 보관 기간 | 자동 삭제 없음; 사용자가 세션 삭제 |"},{"type":"add","oldNo":null,"newNo":385,"text":"| OQ-13 | 원격 조회 규모 | 저장소당 open PR 1,000건까지 수집; 초과 시 부분 조회 표시 |"},{"type":"add","oldNo":null,"newNo":386,"text":"| OQ-14 | 대형 파일·멀티라인 제한 허용 여부 | 파일 5MB·20,000줄 초과 선택 로드, 범위 최대 200줄 |"},{"type":"add","oldNo":null,"newNo":387,"text":"| OQ-15 | 로컬 앱 데이터의 디스크 암호화 요구 | 1차는 파일 권한 제한; 앱 자체 암호화는 별도 요구 시 추가 |"},{"type":"add","oldNo":null,"newNo":388,"text":""},{"type":"add","oldNo":null,"newNo":389,"text":"## 10. MVP 분할 제안"},{"type":"add","oldNo":null,"newNo":390,"text":""},{"type":"add","oldNo":null,"newNo":391,"text":"### 10.1 1차 릴리스"},{"type":"add","oldNo":null,"newNo":392,"text":""},{"type":"add","oldNo":null,"newNo":393,"text":"| 묶음 | FR 목록 | 제공 결과 |"},{"type":"add","oldNo":null,"newNo":394,"text":"|---|---|---|"},{"type":"add","oldNo":null,"newNo":395,"text":"| 실행 기반 | FR-01, FR-02 | 커맨드 → 로컬 서버 → 내장 브라우저, 정확한 worktree 선택 |"},{"type":"add","oldNo":null,"newNo":396,"text":"| 리뷰 입력 | FR-03~FR-09 | 비교 기준·미커밋 변경·diff·멀티라인 코멘트·스레드·outdated 판정 |"},{"type":"add","oldNo":null,"newNo":397,"text":"| AI 수정·재검토 | FR-10~FR-14 | Claude/Codex headless 실행·취소·결과 추적·사람 재검토 |"},{"type":"add","oldNo":null,"newNo":398,"text":"| 프로젝트 개요 | FR-15~FR-18 | 전체 등록 저장소의 draft/open PR 목록·기본 상세·로컬 세션 목록 |"},{"type":"add","oldNo":null,"newNo":399,"text":""},{"type":"add","oldNo":null,"newNo":400,"text":"1차 출시 기준:"},{"type":"add","oldNo":null,"newNo":401,"text":""},{"type":"add","oldNo":null,"newNo":402,"text":"- diff 선택·코멘트 저장·재시작 복원·AI 수정·재검토의 전체 흐름 통과."},{"type":"add","oldNo":null,"newNo":403,"text":"- 워커 idle reap 이후 UI와 실행 중 AI 작업 유지 확인."},{"type":"add","oldNo":null,"newNo":404,"text":"- PR 조회의 GitHub 변이 요청 0건 확인."},{"type":"add","oldNo":null,"newNo":405,"text":"- AI 실행까지 쓰기 금지 보장을 제공할 경우 NFR-17 강제 격리 검증 통과."},{"type":"add","oldNo":null,"newNo":406,"text":"- AI 격리를 확보하지 못하면 자동 수정 부분은 출시 보류. 이 경우 제공 가능한 제품은 “로컬 리뷰·읽기 전용 PR 조회”이며, 원문 전체 요구 충족으로 판정 불가."},{"type":"add","oldNo":null,"newNo":407,"text":"- 라이트·다크, 코멘트 영속성, 대형 diff 제한, 중복 실행 방지 검증 통과."},{"type":"add","oldNo":null,"newNo":408,"text":""},{"type":"add","oldNo":null,"newNo":409,"text":"### 10.2 2차 릴리스"},{"type":"add","oldNo":null,"newNo":410,"text":""},{"type":"add","oldNo":null,"newNo":411,"text":"| FR·확장 항목 | 제공 결과 |"},{"type":"add","oldNo":null,"newNo":412,"text":"|---|---|"},{"type":"add","oldNo":null,"newNo":413,"text":"| FR-19 | 파일별 확인 완료 |"},{"type":"add","oldNo":null,"newNo":414,"text":"| FR-20 | 전체 리뷰 메모·스레드 응답 |"},{"type":"add","oldNo":null,"newNo":415,"text":"| FR-21 | 원격 댓글·리뷰·Checks 읽기 |"},{"type":"add","oldNo":null,"newNo":416,"text":"| FR-22 | 검증 기반 코멘트 위치 재배치 |"},{"type":"add","oldNo":null,"newNo":417,"text":"| FR-23 | 세션 JSON·Markdown 내보내기 |"},{"type":"add","oldNo":null,"newNo":418,"text":"| Orca 에이전트 터미널 전송 | 기존 대화 문맥 활용; headless 방식과 통제 수준 구분 |"},{"type":"add","oldNo":null,"newNo":419,"text":"| GitHub Enterprise | 인증·remote 호스트·조회 경로의 명시적 지원 |"},{"type":"add","oldNo":null,"newNo":420,"text":""},{"type":"add","oldNo":null,"newNo":421,"text":"### 10.3 이후 릴리스"},{"type":"add","oldNo":null,"newNo":422,"text":""},{"type":"add","oldNo":null,"newNo":423,"text":"| FR·확장 항목 | 제공 결과 |"},{"type":"add","oldNo":null,"newNo":424,"text":"|---|---|"},{"type":"add","oldNo":null,"newNo":425,"text":"| FR-24 | split diff·고급 필터 |"},{"type":"add","oldNo":null,"newNo":426,"text":"| PR 전체 계정·조직 탐색 | 등록 저장소 외 프로젝트 탐색 |"},{"type":"add","oldNo":null,"newNo":427,"text":"| 세션 비교·검색 | 여러 리뷰 회차의 변경 추적 |"},{"type":"add","oldNo":null,"newNo":428,"text":"| 대규모 리뷰 분할 실행 | 스레드별 순차 수정·충돌 검증·재검토 지원 |"}]}]},{"path":"docs/02-design.md","oldPath":null,"changeType":"added","binary":false,"additions":279,"deletions":0,"hunks":[{"header":"@@ -0,0 +1,279 @@","oldStart":0,"oldLines":0,"newStart":1,"newLines":279,"lines":[{"type":"add","oldNo":null,"newNo":1,"text":"# Local Self Review — 설계 문서 (TDD, Technical Design Document)"},{"type":"add","oldNo":null,"newNo":2,"text":""},{"type":"add","oldNo":null,"newNo":3,"text":"\u003e 근거: [01-requirements-analysis-codex.md](./01-requirements-analysis-codex.md) (Codex 분석). 이 문서는 그 분석의 \"1차 릴리스(FR-01~FR-18)\" 범위를 Orca 1.4.222 plugin API v0 제약 아래 구현하기 위한 확정 설계다. 구현자(Claude)는 이 문서의 계약을 그대로 따른다."},{"type":"add","oldNo":null,"newNo":4,"text":""},{"type":"add","oldNo":null,"newNo":5,"text":"## v2 변경 (패널 네이티브)"},{"type":"add","oldNo":null,"newNo":6,"text":""},{"type":"add","oldNo":null,"newNo":7,"text":"사용자 요구(\"리뷰 화면이 우측 패널 탭 안에 보여야 한다\")에 따라 v1 의 \"내장 브라우저 탭\" 구조를 **패널 네이티브** 구조로 바꿨다. 근거 사실 2가지를 앱 번들에서 추가 확인했다."},{"type":"add","oldNo":null,"newNo":8,"text":""},{"type":"add","oldNo":null,"newNo":9,"text":"| 사실 | 위치 | 활용 |"},{"type":"add","oldNo":null,"newNo":10,"text":"|---|---|---|"},{"type":"add","oldNo":null,"newNo":11,"text":"| 개발 플러그인 경로는 `DMo` 하우스키핑의 `devWatcher` 가 감시하며, 변경 시 300ms 디바운스 후 `refresh()` → `notifyChanged` → 렌더러가 `readPanelEntry` 로 패널 HTML 을 다시 읽는다 | `main/index.js` `DMo.sync`, `EMo.scheduleRefresh` | 서버가 `panel.html` 을 재생성하면 패널이 갱신된다 (서버 → 패널 채널) |"},{"type":"add","oldNo":null,"newNo":12,"text":"| 매니페스트에 keybindings/vmRecipes/agents 가 있으면(`YI`) 개발 플러그인 폴더의 내용 해시가 승인 지문에 포함된다 | `pgr`/`mgr` | 키바인딩을 제거해 파일 재생성이 승인을 풀지 않게 한다 |"},{"type":"add","oldNo":null,"newNo":13,"text":""},{"type":"add","oldNo":null,"newNo":14,"text":"패널 → 서버 채널은 여전히 `terminal.sendText` 뿐이므로 **브리지 터미널**(`open-review --bridge`, raw 모드로 입력을 받아 `/api/bridge` 로 전달)을 둔다. 데이터 흐름·프로토콜은 아래 \"패널 네이티브 설계\" 절, 코드는 `server/lib/panel-publisher.mjs`·`server/lib/bridge-ops.mjs`·`panel/template.html`·`worker/launcher-cli.mjs`."},{"type":"add","oldNo":null,"newNo":15,"text":""},{"type":"add","oldNo":null,"newNo":16,"text":"## Overview"},{"type":"add","oldNo":null,"newNo":17,"text":""},{"type":"add","oldNo":null,"newNo":18,"text":"- 목표 = PR 생성 전 로컬 셀프 리뷰. GitHub PR 화면과 같은 diff 리뷰·드래그 멀티라인 코멘트·스레드 → \"리뷰 완료 및 AI 수정\" 버튼으로 Claude/Codex 헤드리스 실행 → 재검토."},{"type":"add","oldNo":null,"newNo":19,"text":"- GitHub 쓰기 = 0건. GitHub 접근은 `gh` 읽기 전용 조회(PR 목록·상세·diff)뿐."},{"type":"add","oldNo":null,"newNo":20,"text":"- 구성 = Orca 플러그인 1개 = **우측 패널(컴패니언)** + **워커(커맨드)** + **로컬 서버(UI·API)**. 리뷰 본체는 같은 워크스페이스의 **Orca 내장 브라우저 탭**에 열린다."},{"type":"add","oldNo":null,"newNo":21,"text":""},{"type":"add","oldNo":null,"newNo":22,"text":"## 플랫폼 제약 → 구조 결정 (사실 근거: Orca 앱 번들 `out/shared/plugins/*.js`)"},{"type":"add","oldNo":null,"newNo":23,"text":""},{"type":"add","oldNo":null,"newNo":24,"text":"| 제약 (사실) | 결정 |"},{"type":"add","oldNo":null,"newNo":25,"text":"|---|---|"},{"type":"add","oldNo":null,"newNo":26,"text":"| 패널 iframe CSP `connect-src 'none'`, `sandbox=\"allow-scripts\"` — fetch·WS·링크·iframe 전부 불가, 호스트 액션 3개(`workspace.readContext`·`terminal.sendText`·`notifications.show`)뿐, 패널↔워커 채널 없음 | 패널 = 컴패니언(현재 worktree 표시, 리뷰 열기 버튼, 안내). diff·코멘트 UI는 패널에 두지 않음 |"},{"type":"add","oldNo":null,"newNo":27,"text":"| 워커는 in-flight 작업 없이 5분이면 idle reap | 서버는 워커가 `spawn(detached)` 한 **별도 프로세스**. 워커가 죽어도 UI·AI 실행 유지 |"},{"type":"add","oldNo":null,"newNo":28,"text":"| 커맨드 `invokeCommand` 인자 없음, 30초 타임아웃 | 커맨드는 \"서버 보장 + 탭 열기\"만. 대상 worktree는 `orca worktree current --json` → 실패 시 `workspace.readContext`(branch·displayName) + `orca worktree list` 매칭 |"},{"type":"add","oldNo":null,"newNo":29,"text":"| 워커 env = PATH·HOME·LANG·TZ·TMPDIR만 (GUI PATH일 수 있음) | 서버 기동 시 `$SHELL -lc 'echo $PATH'`로 로그인 PATH 확보 후 `git`·`gh`·`claude`·`codex`·`orca` 해석. 실패 시 고정 후보 경로(`/opt/homebrew/bin`, `/usr/local/bin`, `~/.nvm/versions/node/*/bin`, `/Applications/Orca.app/Contents/Resources/bin`) |"},{"type":"add","oldNo":null,"newNo":30,"text":"| `orca tab create --url` 은 현재 포커스 worktree 스코프 | 커맨드 실행 시점의 현재 worktree 탭에 연다. UI 상단에 대상 worktree 경로를 항상 표시 |"},{"type":"add","oldNo":null,"newNo":31,"text":"| 패널은 정적 HTML (plugin 상태 변경 때만 재로드) | 패널 버튼은 `terminal.sendText`로 **런처 스크립트** 1줄을 사용자가 고른 터미널에 입력. 런처 경로는 고정(`~/Library/Application Support/OrcaLocalSelfReview/bin/open-review`) — 워커가 첫 활성화 때 생성 |"},{"type":"add","oldNo":null,"newNo":32,"text":""},{"type":"add","oldNo":null,"newNo":33,"text":"## 시스템 역할 경계"},{"type":"add","oldNo":null,"newNo":34,"text":""},{"type":"add","oldNo":null,"newNo":35,"text":"| 단위 | 경로 | 역할 | 소유 데이터 | 의존 |"},{"type":"add","oldNo":null,"newNo":36,"text":"|---|---|---|---|---|"},{"type":"add","oldNo":null,"newNo":37,"text":"| 매니페스트 | `orca-plugin.json` | 패널·커맨드·키바인딩·capability 선언 | — | — |"},{"type":"add","oldNo":null,"newNo":38,"text":"| 워커 | `worker/main.mjs` | 커맨드 핸들러 3개(`open-review`·`open-overview`·`stop-server`). 서버 보장(`ensureServer`), 런처 설치, `orca tab create` | Orca storage(마지막 에이전트 선택 등 소형 KV) | `worker/launcher-lib.mjs` |"},{"type":"add","oldNo":null,"newNo":39,"text":"| 서버 | `server/main.mjs` + `server/lib/*.mjs` | 127.0.0.1 HTTP. UI 정적 제공, REST API, git diff, 세션/코멘트 저장, AI 실행 관리, gh 읽기 | `~/Library/Application Support/OrcaLocalSelfReview/` 전체 | `git`·`gh`·`claude`·`codex`·`orca` CLI |"},{"type":"add","oldNo":null,"newNo":40,"text":"| UI | `ui/index.html`·`ui/app.js`·`ui/styles.css` | SPA(프레임워크 없음, 빌드 없음). 오버뷰·세션·PR 상세 화면 | 브라우저 메모리(상태) | 서버 API |"},{"type":"add","oldNo":null,"newNo":41,"text":"| 패널 | `panel.html` | 단일 HTML. 현재 worktree 표시, 터미널 선택 + 리뷰 열기, 안내 | — | 호스트 액션 3개 |"},{"type":"add","oldNo":null,"newNo":42,"text":"| 런처 | 데이터 디렉토리 `bin/open-review` (워커가 생성) | 서버 보장 + `orca tab create` 1회 | — | node, orca |"},{"type":"add","oldNo":null,"newNo":43,"text":""},{"type":"add","oldNo":null,"newNo":44,"text":"의존 방향: 패널 → (터미널) → 런처 → 서버. 워커 → 서버. UI → 서버. 서버 → 외부 CLI. 역방향 없음."},{"type":"add","oldNo":null,"newNo":45,"text":""},{"type":"add","oldNo":null,"newNo":46,"text":"## 데이터 디렉토리 (NFR-19: 레포 내부에 파일 생성 0건)"},{"type":"add","oldNo":null,"newNo":47,"text":""},{"type":"add","oldNo":null,"newNo":48,"text":"```"},{"type":"add","oldNo":null,"newNo":49,"text":"~/Library/Application Support/OrcaLocalSelfReview/   (0700)"},{"type":"add","oldNo":null,"newNo":50,"text":"  runtime/server.json        { port, pid, token, startedAt, protocolVersion:1, serverEntry }  (0600)"},{"type":"add","oldNo":null,"newNo":51,"text":"  bin/open-review            런처 (0700)"},{"type":"add","oldNo":null,"newNo":52,"text":"  sessions/\u003csessionId\u003e.json  ReviewSession (threads·comments 포함, 원자적 교체 .tmp→rename)"},{"type":"add","oldNo":null,"newNo":53,"text":"  runs/\u003crunId\u003e/meta.json     AIRun"},{"type":"add","oldNo":null,"newNo":54,"text":"  runs/\u003crunId\u003e/prompt.md     생성한 프롬프트"},{"type":"add","oldNo":null,"newNo":55,"text":"  runs/\u003crunId\u003e/output.log    stdout+stderr (10MB 상한, 초과분 절단)"},{"type":"add","oldNo":null,"newNo":56,"text":"  cache/github/\u003cowner\u003e__\u003crepo\u003e.json   PR 목록 캐시 (fetchedAt 포함, TTL 5분)"},{"type":"add","oldNo":null,"newNo":57,"text":"```"},{"type":"add","oldNo":null,"newNo":58,"text":""},{"type":"add","oldNo":null,"newNo":59,"text":"데이터 루트는 env `ORCA_SELF_REVIEW_HOME` 으로 오버라이드 가능(테스트용)."},{"type":"add","oldNo":null,"newNo":60,"text":""},{"type":"add","oldNo":null,"newNo":61,"text":"## 데이터 모델 (JSON, `schemaVersion: 1`)"},{"type":"add","oldNo":null,"newNo":62,"text":""},{"type":"add","oldNo":null,"newNo":63,"text":"```ts"},{"type":"add","oldNo":null,"newNo":64,"text":"type Side = 'old' | 'new'"},{"type":"add","oldNo":null,"newNo":65,"text":"type SessionKind = 'local' | 'pr'"},{"type":"add","oldNo":null,"newNo":66,"text":""},{"type":"add","oldNo":null,"newNo":67,"text":"interface ReviewSession {"},{"type":"add","oldNo":null,"newNo":68,"text":"  schemaVersion: 1"},{"type":"add","oldNo":null,"newNo":69,"text":"  id: string                      // 'ses_' + 12 hex"},{"type":"add","oldNo":null,"newNo":70,"text":"  kind: SessionKind"},{"type":"add","oldNo":null,"newNo":71,"text":"  revision: number                // 저장마다 +1, 쓰기 요청은 revision 일치 필요 (409 충돌)"},{"type":"add","oldNo":null,"newNo":72,"text":"  repoPath: string                // git 루트 (local) / 로컬 worktree 경로 (pr, 있을 때만) "},{"type":"add","oldNo":null,"newNo":73,"text":"  worktreeId: string | null       // Orca worktree id"},{"type":"add","oldNo":null,"newNo":74,"text":"  repoDisplayName: string"},{"type":"add","oldNo":null,"newNo":75,"text":"  branch: string"},{"type":"add","oldNo":null,"newNo":76,"text":"  baseRef: string                 // local: 'origin/main' 등 / pr: baseRefName"},{"type":"add","oldNo":null,"newNo":77,"text":"  includeUntracked: boolean"},{"type":"add","oldNo":null,"newNo":78,"text":"  pr: null | { owner: string, repo: string, number: number, headSha: string, url: string }"},{"type":"add","oldNo":null,"newNo":79,"text":"  agent: 'claude' | 'codex'"},{"type":"add","oldNo":null,"newNo":80,"text":"  status: 'reviewing' | 'fixing' | 'rechecking' | 'completed'"},{"type":"add","oldNo":null,"newNo":81,"text":"  threads: Thread[]"},{"type":"add","oldNo":null,"newNo":82,"text":"  createdAt: string               // ISO UTC"},{"type":"add","oldNo":null,"newNo":83,"text":"  updatedAt: string"},{"type":"add","oldNo":null,"newNo":84,"text":"}"},{"type":"add","oldNo":null,"newNo":85,"text":""},{"type":"add","oldNo":null,"newNo":86,"text":"interface Thread {"},{"type":"add","oldNo":null,"newNo":87,"text":"  id: string                      // 'thr_' + 12 hex"},{"type":"add","oldNo":null,"newNo":88,"text":"  path: string                    // 현재 경로"},{"type":"add","oldNo":null,"newNo":89,"text":"  oldPath: string | null"},{"type":"add","oldNo":null,"newNo":90,"text":"  side: Side"},{"type":"add","oldNo":null,"newNo":91,"text":"  startLine: number               // 양 끝 포함, startLine \u003c= endLine, 범위 1~200줄"},{"type":"add","oldNo":null,"newNo":92,"text":"  endLine: number"},{"type":"add","oldNo":null,"newNo":93,"text":"  selectedText: string            // 선택 라인 원문 (앵커 검증·프롬프트 문맥)"},{"type":"add","oldNo":null,"newNo":94,"text":"  status: 'open' | 'resolved'"},{"type":"add","oldNo":null,"newNo":95,"text":"  applicability: 'current' | 'outdated'   // 서버가 현재 diff와 대조해 매 조회마다 계산"},{"type":"add","oldNo":null,"newNo":96,"text":"  comments: Comment[]             // 첫 코멘트가 스레드 생성"},{"type":"add","oldNo":null,"newNo":97,"text":"  createdAt: string"},{"type":"add","oldNo":null,"newNo":98,"text":"  resolvedAt: string | null"},{"type":"add","oldNo":null,"newNo":99,"text":"}"},{"type":"add","oldNo":null,"newNo":100,"text":""},{"type":"add","oldNo":null,"newNo":101,"text":"interface Comment { id: string, body: string /* \u003c=10000자 */, createdAt: string, updatedAt: string }"},{"type":"add","oldNo":null,"newNo":102,"text":""},{"type":"add","oldNo":null,"newNo":103,"text":"interface AIRun {"},{"type":"add","oldNo":null,"newNo":104,"text":"  schemaVersion: 1"},{"type":"add","oldNo":null,"newNo":105,"text":"  id: string                      // 'run_' + 12 hex"},{"type":"add","oldNo":null,"newNo":106,"text":"  sessionId: string"},{"type":"add","oldNo":null,"newNo":107,"text":"  agent: 'claude' | 'codex'"},{"type":"add","oldNo":null,"newNo":108,"text":"  threadIds: string[]"},{"type":"add","oldNo":null,"newNo":109,"text":"  cwd: string"},{"type":"add","oldNo":null,"newNo":110,"text":"  pid: number | null"},{"type":"add","oldNo":null,"newNo":111,"text":"  status: 'queued' | 'running' | 'succeeded' | 'failed' | 'cancelled' | 'interrupted'"},{"type":"add","oldNo":null,"newNo":112,"text":"  exitCode: number | null"},{"type":"add","oldNo":null,"newNo":113,"text":"  startedAt: string"},{"type":"add","oldNo":null,"newNo":114,"text":"  endedAt: string | null"},{"type":"add","oldNo":null,"newNo":115,"text":"  changedFiles: string[]          // 실행 전후 `git status --porcelain` 차집합 + 변경 파일"},{"type":"add","oldNo":null,"newNo":116,"text":"}"},{"type":"add","oldNo":null,"newNo":117,"text":"```"},{"type":"add","oldNo":null,"newNo":118,"text":""},{"type":"add","oldNo":null,"newNo":119,"text":"## Diff 모델 (서버 → UI)"},{"type":"add","oldNo":null,"newNo":120,"text":""},{"type":"add","oldNo":null,"newNo":121,"text":"```ts"},{"type":"add","oldNo":null,"newNo":122,"text":"interface DiffFile {"},{"type":"add","oldNo":null,"newNo":123,"text":"  path: string, oldPath: string | null,"},{"type":"add","oldNo":null,"newNo":124,"text":"  changeType: 'added' | 'modified' | 'deleted' | 'renamed' | 'untracked',"},{"type":"add","oldNo":null,"newNo":125,"text":"  binary: boolean, additions: number, deletions: number,"},{"type":"add","oldNo":null,"newNo":126,"text":"  hunks: Hunk[]                   // binary 또는 20,000줄 초과 파일은 hunks=[] + truncated:true"},{"type":"add","oldNo":null,"newNo":127,"text":"  truncated?: boolean"},{"type":"add","oldNo":null,"newNo":128,"text":"}"},{"type":"add","oldNo":null,"newNo":129,"text":"interface Hunk { header: string, oldStart: number, oldLines: number, newStart: number, newLines: number, lines: DiffLine[] }"},{"type":"add","oldNo":null,"newNo":130,"text":"interface DiffLine { type: 'context' | 'add' | 'del', oldNo: number | null, newNo: number | null, text: string }"},{"type":"add","oldNo":null,"newNo":131,"text":"```"},{"type":"add","oldNo":null,"newNo":132,"text":""},{"type":"add","oldNo":null,"newNo":133,"text":"로컬 diff 산출: `git merge-base \u003cbaseRef\u003e HEAD` → `git diff \u003cmergeBase\u003e` (작업 트리 기준 → staged+unstaged 포함) + untracked(`git ls-files --others --exclude-standard` 각 파일을 `git diff --no-index /dev/null \u003cfile\u003e`). PR diff 산출: `gh pr diff \u003cn\u003e --repo owner/repo` 결과 파싱(동일 파서)."},{"type":"add","oldNo":null,"newNo":134,"text":""},{"type":"add","oldNo":null,"newNo":135,"text":"## 서버 API 계약 (모든 응답 JSON, 오류 `{ error: { code, message } }`)"},{"type":"add","oldNo":null,"newNo":136,"text":""},{"type":"add","oldNo":null,"newNo":137,"text":"인증: UI는 `GET /` 로 HTML을 받는다. HTML에 `\u003cmeta name=\"sr-token\" content=\"...\"\u003e` 로 토큰이 주입된다. 모든 `/api/*` 요청은 헤더 `X-SR-Token: \u003ctoken\u003e` 필수(없으면 401). 추가로 `Host` 가 `127.0.0.1:\u003cport\u003e` 또는 `localhost:\u003cport\u003e` 가 아니면 400, `Origin` 헤더가 있고 `http://127.0.0.1:\u003cport\u003e`/`http://localhost:\u003cport\u003e` 가 아니면 403. 다른 오리진의 CSRF는 커스텀 헤더 preflight 로 차단된다."},{"type":"add","oldNo":null,"newNo":138,"text":""},{"type":"add","oldNo":null,"newNo":139,"text":"| 메서드·경로 | 요청 | 응답 | 비고 |"},{"type":"add","oldNo":null,"newNo":140,"text":"|---|---|---|---|"},{"type":"add","oldNo":null,"newNo":141,"text":"| `GET /health` | — | `{ ok:true, protocolVersion:1, pid, startedAt }` | 토큰 불필요 |"},{"type":"add","oldNo":null,"newNo":142,"text":"| `POST /api/shutdown` | — | `{ ok:true }` | 실행 중 AIRun 있으면 409 |"},{"type":"add","oldNo":null,"newNo":143,"text":"| `GET /api/overview` | — | `{ repos: RepoOverview[], sessions: SessionSummary[], github: { enabled, lastFetchedAt, errors: {repo:string, message:string}[] } }` | repos = `orca repo list` 기반, 각 repo에 `worktrees[]`(path, branch, displayName, worktreeId) + `prs[]`(number, title, isDraft, headRefName, baseRefName, author, updatedAt, url, additions, deletions, changedFiles) |"},{"type":"add","oldNo":null,"newNo":144,"text":"| `POST /api/overview/refresh` | — | overview | 캐시 무시 재조회 |"},{"type":"add","oldNo":null,"newNo":145,"text":"| `GET /api/context` | `?path=\u003cworktreePath\u003e` | `{ repoPath, branch, baseCandidates: string[], defaultBase: string, worktreeId, repoDisplayName }` | baseCandidates = `origin/HEAD` 해석값, `origin/main`, `origin/dev`, `origin/master`, `main`, `dev`, `master` 중 존재하는 것 |"},{"type":"add","oldNo":null,"newNo":146,"text":"| `POST /api/sessions` | `{ kind:'local', repoPath, baseRef, includeUntracked?, agent? }` 또는 `{ kind:'pr', owner, repo, number }` | `ReviewSession` | local: 같은 repoPath+baseRef 의 `completed` 아닌 세션이 있으면 그것을 반환(멱등). pr: 같은 owner/repo/number 재사용 |"},{"type":"add","oldNo":null,"newNo":147,"text":"| `GET /api/sessions` | — | `SessionSummary[]` | |"},{"type":"add","oldNo":null,"newNo":148,"text":"| `GET /api/sessions/:id` | — | `{ session, diff: { files: DiffFile[], baseSha, headSha, mergeBaseSha, computedAt } }` | 매 조회마다 diff 재계산 + 스레드 applicability 갱신 |"},{"type":"add","oldNo":null,"newNo":149,"text":"| `PATCH /api/sessions/:id` | `{ revision, baseRef?, includeUntracked?, agent?, status? }` | `ReviewSession` | revision 불일치 409 |"},{"type":"add","oldNo":null,"newNo":150,"text":"| `DELETE /api/sessions/:id` | — | `{ ok:true }` | |"},{"type":"add","oldNo":null,"newNo":151,"text":"| `POST /api/sessions/:id/threads` | `{ revision, path, oldPath?, side, startLine, endLine, selectedText, body }` | `ReviewSession` | 범위 검증(1~200줄, start\u003c=end), body 1~10000자 |"},{"type":"add","oldNo":null,"newNo":152,"text":"| `PATCH /api/sessions/:id/threads/:tid` | `{ revision, status?: 'open'|'resolved' }` | `ReviewSession` | |"},{"type":"add","oldNo":null,"newNo":153,"text":"| `DELETE /api/sessions/:id/threads/:tid` | `{ revision }` (body) | `ReviewSession` | |"},{"type":"add","oldNo":null,"newNo":154,"text":"| `POST /api/sessions/:id/threads/:tid/comments` | `{ revision, body }` | `ReviewSession` | |"},{"type":"add","oldNo":null,"newNo":155,"text":"| `PATCH /api/sessions/:id/threads/:tid/comments/:cid` | `{ revision, body }` | `ReviewSession` | |"},{"type":"add","oldNo":null,"newNo":156,"text":"| `DELETE /api/sessions/:id/threads/:tid/comments/:cid` | `{ revision }` | `ReviewSession` | 마지막 코멘트 삭제 = 스레드 삭제 |"},{"type":"add","oldNo":null,"newNo":157,"text":"| `POST /api/sessions/:id/runs` | `{ revision, agent }` | `AIRun` (202) | 대상 = open & current 스레드. 0개면 400. 같은 cwd에 running 있으면 409 + 기존 runId. 세션 status→`fixing` |"},{"type":"add","oldNo":null,"newNo":158,"text":"| `GET /api/runs/:rid` | `?logFrom=\u003cbyteOffset\u003e` | `{ run: AIRun, log: string, logNext: number }` | 2초 폴링용 |"},{"type":"add","oldNo":null,"newNo":159,"text":"| `POST /api/runs/:rid/cancel` | — | `AIRun` | 프로세스 그룹 SIGTERM → 5초 후 SIGKILL |"},{"type":"add","oldNo":null,"newNo":160,"text":"| `GET /api/prs/:owner/:repo/:number` | — | `{ pr: PRDetail, diff: { files: DiffFile[] }, localWorktree: { path, branch } | null, session: SessionSummary | null }` | `gh pr view --json ...` + `gh pr diff`. 읽기 전용 |"},{"type":"add","oldNo":null,"newNo":161,"text":"| `GET /api/agents` | — | `{ claude: { available, path, version }, codex: {...} }` | |"},{"type":"add","oldNo":null,"newNo":162,"text":""},{"type":"add","oldNo":null,"newNo":163,"text":"`SessionSummary` = ReviewSession 에서 threads 를 `{ open:number, resolved:number }` 카운트로 치환한 것."},{"type":"add","oldNo":null,"newNo":164,"text":""},{"type":"add","oldNo":null,"newNo":165,"text":"## AI 실행 (FR-10~FR-14)"},{"type":"add","oldNo":null,"newNo":166,"text":""},{"type":"add","oldNo":null,"newNo":167,"text":"- 프롬프트(`runs/\u003cid\u003e/prompt.md`): 헤더(세션·대상 경로·브랜치·금지 사항) + 스레드별 블록(파일, side, 라인 범위, 선택 원문, 앞뒤 20줄 문맥(현재 파일 기준, side=new 일 때), 코멘트 원문 전부) + 결과 형식 요구(스레드별 수행/미수행 사유·변경 파일 목록). 금지 사항 = `git commit`·`git push`·`gh` 호출·레포 밖 파일 수정 금지."},{"type":"add","oldNo":null,"newNo":168,"text":"- 실행 (stdin 으로 프롬프트, `detached: true` 로 프로세스 그룹 분리, cwd = session.repoPath):"},{"type":"add","oldNo":null,"newNo":169,"text":"  - claude: `claude -p --output-format text --permission-mode acceptEdits --allowedTools Read Edit Write MultiEdit Grep Glob LS` (\"Bash\" 미허용 → commit/push 불가)"},{"type":"add","oldNo":null,"newNo":170,"text":"  - codex: `codex exec --full-auto --skip-git-repo-check -C \u003ccwd\u003e -` (workspace-write 샌드박스, 네트워크 차단 기본 → push 불가)"},{"type":"add","oldNo":null,"newNo":171,"text":"- 상태: queued → running → succeeded(exit 0)/failed/cancelled. 서버 재시작 시 `meta.json` 의 pid 생존 확인 실패 → interrupted."},{"type":"add","oldNo":null,"newNo":172,"text":"- 완료 후 세션 status → `rechecking`. 스레드 자동 resolved 없음(FR-08)."},{"type":"add","oldNo":null,"newNo":173,"text":"- 총 프롬프트 100KB 초과 시 400 + 분할 안내."},{"type":"add","oldNo":null,"newNo":174,"text":""},{"type":"add","oldNo":null,"newNo":175,"text":"## UI 화면 (ui/)"},{"type":"add","oldNo":null,"newNo":176,"text":""},{"type":"add","oldNo":null,"newNo":177,"text":"| 화면 | 라우트(hash) | 내용 |"},{"type":"add","oldNo":null,"newNo":178,"text":"|---|---|---|"},{"type":"add","oldNo":null,"newNo":179,"text":"| 오버뷰 | `#/` | 좌: 레포 카드(worktree 목록 → \"리뷰 시작\"), 우: 전체 레포 open PR 테이블(Draft 배지, 레포·작성자·Draft 필터, 새로고침, 마지막 조회 시각, 오류 표시), 하단: 로컬 세션 목록(상태·open 스레드 수·재열기·삭제) |"},{"type":"add","oldNo":null,"newNo":180,"text":"| 세션 리뷰 | `#/sessions/:id` | 헤더(레포·브랜치·base 선택·untracked 토글·에이전트 선택·\"리뷰 완료 및 AI 수정\"(open·current 스레드 수 표시, 실행 중이면 비활성)), 좌: 파일 목록(+/- 통계, 스레드 수), 우: 파일별 unified diff. 라인 번호 거터를 드래그(또는 Shift+클릭)하면 같은 side·같은 파일의 연속 범위 선택 → 코멘트 폼. 스레드는 endLine 아래 인라인 렌더(수정·삭제·resolve·답글). outdated 스레드 회색 배지. 실행 패널: 상태·로그 tail(2초 폴링)·취소 |"},{"type":"add","oldNo":null,"newNo":181,"text":"| PR 상세 | `#/prs/:owner/:repo/:number` | 제목·번호·Draft·작성자·base←head·통계·본문(텍스트 렌더, raw HTML 금지), diff 뷰어(동일 컴포넌트). \"로컬 리뷰 세션 열기\" → kind:'pr' 세션 생성. 로컬 worktree 가 없으면 AI 수정 버튼 비활성 + 사유 |"},{"type":"add","oldNo":null,"newNo":182,"text":""},{"type":"add","oldNo":null,"newNo":183,"text":"- 테마: `prefers-color-scheme` 기본 + 수동 토글(localStorage). CSS 변수 토큰만 사용, 색 하드코딩 금지. 본문 대비 4.5:1 이상."},{"type":"add","oldNo":null,"newNo":184,"text":"- 대형 diff: 파일은 클릭 시 렌더(지연), 20,000줄 초과 파일은 서버가 truncated → \"크기 초과\" 안내."},{"type":"add","oldNo":null,"newNo":185,"text":"- 선택 제약: 파일·side 경계 넘는 드래그는 경계에서 멈춤. 최대 200줄."},{"type":"add","oldNo":null,"newNo":186,"text":""},{"type":"add","oldNo":null,"newNo":187,"text":"## 패널 (panel.html)"},{"type":"add","oldNo":null,"newNo":188,"text":""},{"type":"add","oldNo":null,"newNo":189,"text":"- 로드 시 `workspace.readContext` → displayName·branch 표시, terminals[] 로 `\u003cselect\u003e` 채움(id 끝 8자)."},{"type":"add","oldNo":null,"newNo":190,"text":"- \"리뷰 열기\" → 선택 터미널에 `\"$HOME/Library/Application Support/OrcaLocalSelfReview/bin/open-review\"` + Enter 전송 → `notifications.show`."},{"type":"add","oldNo":null,"newNo":191,"text":"- \"전체 PR·세션\" → 같은 런처에 ` --overview` 인자."},{"type":"add","oldNo":null,"newNo":192,"text":"- 런처가 없으면(첫 사용) 안내: 커맨드 팔레트 \"Self Review: 현재 worktree 리뷰 열기\" 1회 실행."},{"type":"add","oldNo":null,"newNo":193,"text":"- 호스트 토큰(`--background`·`--foreground`·`--primary`·`--border` 등)만 사용."},{"type":"add","oldNo":null,"newNo":194,"text":""},{"type":"add","oldNo":null,"newNo":195,"text":"## 워커 (worker/main.mjs)"},{"type":"add","oldNo":null,"newNo":196,"text":""},{"type":"add","oldNo":null,"newNo":197,"text":"```"},{"type":"add","oldNo":null,"newNo":198,"text":"activate(ctx):"},{"type":"add","oldNo":null,"newNo":199,"text":"  installLauncher()                       // bin/open-review 생성/갱신 (idempotent)"},{"type":"add","oldNo":null,"newNo":200,"text":"  commands.register('open-review', async () =\u003e {"},{"type":"add","oldNo":null,"newNo":201,"text":"     const { port, token } = await ensureServer()        // health → 없으면 spawn detached, 5초 내 health 대기"},{"type":"add","oldNo":null,"newNo":202,"text":"     const target = await currentWorktreePath()           // orca worktree current --json"},{"type":"add","oldNo":null,"newNo":203,"text":"     await orca('tab', 'create', '--url', `http://127.0.0.1:${port}/?target=${enc(target)}`)"},{"type":"add","oldNo":null,"newNo":204,"text":"     notifications.show(...)"},{"type":"add","oldNo":null,"newNo":205,"text":"  })"},{"type":"add","oldNo":null,"newNo":206,"text":"  commands.register('open-overview', ...)  // url = /#/"},{"type":"add","oldNo":null,"newNo":207,"text":"  commands.register('stop-server', ...)    // POST /api/shutdown"},{"type":"add","oldNo":null,"newNo":208,"text":"```"},{"type":"add","oldNo":null,"newNo":209,"text":""},{"type":"add","oldNo":null,"newNo":210,"text":"`ensureServer()`·`currentWorktreePath()`·`resolveBin()` 는 `worker/launcher-lib.mjs` 에 두고 워커와 런처가 공유한다 (워커는 `import.meta.url` 로 플러그인 루트를 구한다). 서버 spawn = `spawn(process.execPath, [serverEntry], { detached:true, stdio:'ignore', env: { ...env, ELECTRON_RUN_AS_NODE:'1', ORCA_SELF_REVIEW_HOME } }).unref()`. 서버는 기동 시 `runtime/server.json` 을 원자적으로 쓴다. 포트 = 우선 47811, 사용 중이면 OS 할당."},{"type":"add","oldNo":null,"newNo":211,"text":""},{"type":"add","oldNo":null,"newNo":212,"text":"## 실패 경로"},{"type":"add","oldNo":null,"newNo":213,"text":""},{"type":"add","oldNo":null,"newNo":214,"text":"| 상황 | 처리 |"},{"type":"add","oldNo":null,"newNo":215,"text":"|---|---|"},{"type":"add","oldNo":null,"newNo":216,"text":"| `gh` 미설치·미인증 | overview.github.enabled=false + errors. PR 기능만 비활성, 로컬 리뷰는 동작 |"},{"type":"add","oldNo":null,"newNo":217,"text":"| `git` 명령 실패(merge-base 없음 등) | 400 `{code:'git_failed', message: stderr}` UI 가 base 변경 유도 |"},{"type":"add","oldNo":null,"newNo":218,"text":"| 세션 revision 충돌 | 409 → UI 가 최신 세션 재조회 후 안내 |"},{"type":"add","oldNo":null,"newNo":219,"text":"| 에이전트 CLI 없음 | `/api/agents` available=false → 버튼 비활성 + 사유 |"},{"type":"add","oldNo":null,"newNo":220,"text":"| 동일 cwd 중복 실행 | 409 + 기존 runId 반환 → UI 가 그 run 표시 |"},{"type":"add","oldNo":null,"newNo":221,"text":"| 서버 비정상 종료 | 다음 커맨드에서 health 실패 → 재기동, running run 은 interrupted |"},{"type":"add","oldNo":null,"newNo":222,"text":"| 서버 15분 유휴(UI 요청 0·run 0) | 자동 종료, runtime/server.json 삭제 |"},{"type":"add","oldNo":null,"newNo":223,"text":""},{"type":"add","oldNo":null,"newNo":224,"text":"## 테스트 계획 (node:test, `test/*.test.mjs`, git 외 외부 CLI(gh·claude·codex·orca) 없이 실행 가능해야 함 — runner 주입으로 모킹)"},{"type":"add","oldNo":null,"newNo":225,"text":""},{"type":"add","oldNo":null,"newNo":226,"text":"| 레벨 | 대상 | 케이스 |"},{"type":"add","oldNo":null,"newNo":227,"text":"|---|---|---|"},{"type":"add","oldNo":null,"newNo":228,"text":"| 단위 | `server/lib/diff-parser.mjs` | unified diff → DiffFile(추가·삭제·수정·rename·binary·멀티 hunk·`\\ No newline`), 라인 번호 old/new 정확성, 20,000줄 초과 truncated |"},{"type":"add","oldNo":null,"newNo":229,"text":"| 단위 | `server/lib/store.mjs` | 세션 CRUD 원자 저장·revision 증가·충돌 409·스레드 범위 검증·마지막 코멘트 삭제 시 스레드 삭제·멱등 생성 |"},{"type":"add","oldNo":null,"newNo":230,"text":"| 단위 | `server/lib/anchor.mjs` | 스레드 applicability: 동일 라인 텍스트 일치 → current, 불일치 → outdated |"},{"type":"add","oldNo":null,"newNo":231,"text":"| 단위 | `server/lib/prompt.mjs` | 프롬프트에 파일·side·범위·원문·코멘트 전부 포함, 금지 문구 포함, 100KB 초과 오류 |"},{"type":"add","oldNo":null,"newNo":232,"text":"| 단위 | `server/lib/auth.mjs` | 토큰 없음 401, Host 불일치 400, Origin 불일치 403, 정상 통과 |"},{"type":"add","oldNo":null,"newNo":233,"text":"| 단위 | `server/lib/github.mjs` | gh JSON → PR 요약 매핑, 캐시 TTL, gh 실패 시 errors 수집 (gh 는 주입 가능한 runner 로 모킹) |"},{"type":"add","oldNo":null,"newNo":234,"text":"| 통합 | `server/main.mjs` (실제 임시 git 레포 생성) | 세션 생성 → diff 조회 → 스레드 추가 → run 생성(에이전트 runner 를 가짜 스크립트로 주입) → 상태 전이·로그 조회·취소 |"},{"type":"add","oldNo":null,"newNo":235,"text":"| 단위 | `ui/lib/selection.mjs` | 드래그 범위 정규화(역방향·side 경계·200줄 상한), 스레드 인라인 배치 계산 |"},{"type":"add","oldNo":null,"newNo":236,"text":"| 단위 | `worker/launcher-lib.mjs` | health 실패 시 spawn 호출, 성공 시 재사용, 포트 폴백 (spawn·fetch 주입) |"},{"type":"add","oldNo":null,"newNo":237,"text":""},{"type":"add","oldNo":null,"newNo":238,"text":"## 파일 소유 (Single Writer per File)"},{"type":"add","oldNo":null,"newNo":239,"text":""},{"type":"add","oldNo":null,"newNo":240,"text":"| 구현자 | 소유 경로 |"},{"type":"add","oldNo":null,"newNo":241,"text":"|---|---|"},{"type":"add","oldNo":null,"newNo":242,"text":"| A (server) | `server/**`, `test/server-*.test.mjs`, `test/helpers/**` |"},{"type":"add","oldNo":null,"newNo":243,"text":"| B (ui) | `ui/**`, `test/ui-*.test.mjs` |"},{"type":"add","oldNo":null,"newNo":244,"text":"| 메인 | `orca-plugin.json`, `package.json`, `worker/**`, `panel/**`, `docs/**`, `README.md`, `test/worker-*.test.mjs` |"},{"type":"add","oldNo":null,"newNo":245,"text":""},{"type":"add","oldNo":null,"newNo":246,"text":"## Out of Scope (1차)"},{"type":"add","oldNo":null,"newNo":247,"text":""},{"type":"add","oldNo":null,"newNo":248,"text":"split diff, 파일별 확인 완료, 세션 내보내기, Orca 에이전트 터미널로 프롬프트 전송(헤드리스 실행이 기본), GitHub Enterprise, 자동 commit/push, PR 생성."},{"type":"add","oldNo":null,"newNo":249,"text":""},{"type":"add","oldNo":null,"newNo":250,"text":""},{"type":"add","oldNo":null,"newNo":251,"text":"## 패널 네이티브 설계 (v2)"},{"type":"add","oldNo":null,"newNo":252,"text":""},{"type":"add","oldNo":null,"newNo":253,"text":"### 데이터 흐름"},{"type":"add","oldNo":null,"newNo":254,"text":""},{"type":"add","oldNo":null,"newNo":255,"text":"```"},{"type":"add","oldNo":null,"newNo":256,"text":"[서버] 변경 발생(세션·스레드·실행 상태) → PanelPublisher.schedule() (150ms 디바운스)"},{"type":"add","oldNo":null,"newNo":257,"text":"     → panel/template.html + \u003cscript id=\"orca-panel-data\"\u003e JSON → panel.html (tmp+rename)"},{"type":"add","oldNo":null,"newNo":258,"text":"     → Orca devWatcher(300ms) → plugins refresh → 패널 iframe 재로드 (패치 호스트: orca-panel-data 메시지로 데이터만 교체)"},{"type":"add","oldNo":null,"newNo":259,"text":"[패널] 조작 → op JSON → `SR \u003cbase64url\u003e` 1줄 (3,800자 초과 시 `SRC \u003cid\u003e \u003ci\u003e \u003cn\u003e \u003cdata\u003e` 청크)"},{"type":"add","oldNo":null,"newNo":260,"text":"     → terminal.sendText(브리지 터미널) → bridge CLI (raw 모드, 에코 없음) → POST /api/bridge → 서버 처리 → 재생성"},{"type":"add","oldNo":null,"newNo":261,"text":"```"},{"type":"add","oldNo":null,"newNo":262,"text":""},{"type":"add","oldNo":null,"newNo":263,"text":"### 패널 데이터 (`orca-panel-data`)"},{"type":"add","oldNo":null,"newNo":264,"text":"`{ schemaVersion:1, generatedAt, reason, server:{port,pid}, launcher, agents, worktrees:[{worktreeId,path,branch,displayName,repoDisplayName,sessionId,bridgeTerminalIds}], sessions:{[id]:{session,diff}}, sessionList, runs:{[sessionId]: AIRun+logTail}, overview:{repos,github}, viewState:{[sessionId]:{route,file,scroll}} }`"},{"type":"add","oldNo":null,"newNo":265,"text":"- 완료되지 않은 세션만 포함. 파일당 diff 3,000줄 초과는 `panelTruncated` (넓게 보기 안내). 전체 6MB 초과 시 sessions 제거 + `oversized`."},{"type":"add","oldNo":null,"newNo":266,"text":"- 패널은 `workspace.readContext` 의 displayName·branch 로 `worktrees` 에서 현재 worktree 를 고른다. 오버뷰에서 수동으로 고른 worktree 는 컨텍스트가 바뀌기 전까지 유지."},{"type":"add","oldNo":null,"newNo":267,"text":"- 브리지 터미널 id 매칭: `bridgeTerminalIds ∩ readContext.terminals[].id`. 브리지는 `ORCA_TERMINAL_HANDLE`·ptyId·(패널이 고른 id) 를 모두 등록한다."},{"type":"add","oldNo":null,"newNo":268,"text":""},{"type":"add","oldNo":null,"newNo":269,"text":"### 브리지 op (`server/lib/bridge-ops.mjs`)"},{"type":"add","oldNo":null,"newNo":270,"text":"`session.open|patch|delete|complete`, `thread.add|patch|delete`, `comment.add|patch|delete`, `run.start|cancel`, `overview.refresh`, `view`, `wide`, `ping`. `view` 는 재생성을 일으키지 않고 viewState 만 저장한다(스크롤·파일 복원용). 실행 중에는 2초마다 상태 변화가 있을 때만 재생성한다(로그 증가만으로는 재로드하지 않음)."},{"type":"add","oldNo":null,"newNo":271,"text":""},{"type":"add","oldNo":null,"newNo":272,"text":"### 재로드와 입력 보존"},{"type":"add","oldNo":null,"newNo":273,"text":"스톡 호스트는 재생성 때 iframe 을 통째로 다시 로드한다. 패널은 작성 중인 코멘트 초안을 메모리(UI.draft)에 두고 재렌더 시 복원하지만, 재로드 자체는 초안을 잃는다. 그래서 재생성은 사용자의 조작 결과(코멘트 등록 등)와 실행 상태 전이에서만 일어난다."},{"type":"add","oldNo":null,"newNo":274,"text":""},{"type":"add","oldNo":null,"newNo":275,"text":"### 검증 (2026-10-08)"},{"type":"add","oldNo":null,"newNo":276,"text":"- `node --test test/*.test.mjs` 69건 통과 (패널 문서·브리지 op·브리지 통합 포함)."},{"type":"add","oldNo":null,"newNo":277,"text":"- 실측: 브리지 터미널 생성 → `orca terminal send` 로 `SR …` 1줄 입력 → 서버 스레드 추가 → `panel.html` 재생성(reason=thread) 확인."},{"type":"add","oldNo":null,"newNo":278,"text":"- 실측: `/panel-preview` 를 내장 브라우저에서 열어 오버뷰 → 세션 열기 → 거터 선택 → 코멘트 등록 → 스레드 렌더 확인."},{"type":"add","oldNo":null,"newNo":279,"text":"- 미검증: 실제 Orca 사이드바 패널에서의 표시(스크린샷 권한 없음) — 사용자 확인 필요."}]}]},{"path":"orca-plugin.json","oldPath":null,"changeType":"added","binary":false,"additions":65,"deletions":0,"hunks":[{"header":"@@ -0,0 +1,65 @@","oldStart":0,"oldLines":0,"newStart":1,"newLines":65,"lines":[{"type":"add","oldNo":null,"newNo":1,"text":"{"},{"type":"add","oldNo":null,"newNo":2,"text":"  \"manifestVersion\": 1,"},{"type":"add","oldNo":null,"newNo":3,"text":"  \"id\": \"local-self-review\","},{"type":"add","oldNo":null,"newNo":4,"text":"  \"publisher\": \"biuea\","},{"type":"add","oldNo":null,"newNo":5,"text":"  \"name\": \"Local Self Review\","},{"type":"add","oldNo":null,"newNo":6,"text":"  \"version\": \"0.1.0\","},{"type":"add","oldNo":null,"newNo":7,"text":"  \"description\": \"PR 생성 전 로컬 셀프 리뷰. GitHub 스타일 diff 리뷰·멀티라인 코멘트·Claude/Codex 자동 수정. GitHub에는 어떤 기록도 남기지 않습니다.\","},{"type":"add","oldNo":null,"newNo":8,"text":"  \"author\": {"},{"type":"add","oldNo":null,"newNo":9,"text":"    \"name\": \"biuea\""},{"type":"add","oldNo":null,"newNo":10,"text":"  },"},{"type":"add","oldNo":null,"newNo":11,"text":"  \"engines\": {"},{"type":"add","oldNo":null,"newNo":12,"text":"    \"orca\": \"\u003e=1.4.200\""},{"type":"add","oldNo":null,"newNo":13,"text":"  },"},{"type":"add","oldNo":null,"newNo":14,"text":"  \"pluginApi\": 1,"},{"type":"add","oldNo":null,"newNo":15,"text":"  \"main\": \"worker/main.mjs\","},{"type":"add","oldNo":null,"newNo":16,"text":"  \"contributes\": {"},{"type":"add","oldNo":null space; font-size: 10px; border: 1px solid var(--border); border-radius: 3px; padding: 0 3px; }"},{"type":"add","oldNo":null,"newNo":78,"text":"\u003c/style\u003e"},{"type":"add","oldNo":null,"newNo":79,"text":"\u003c/head\u003e"},{"type":"add","oldNo":null,"newNo":80,"text":"\u003cbody\u003e"},{"type":"add","oldNo":null,"newNo":81,"text":"\u003cdiv class=\"topbar\"\u003e"},{"type":"add","oldNo":null,"newNo":82,"text":"  \u003cspan class=\"title\" id=\"title\"\u003eSelf Review\u003c/span\u003e"},{"type":"add","oldNo":null,"newNo":83,"text":"  \u003cbutton type=\"button\" class=\"btn ghost small\" id=\"btnRefreshOverview\" title=\"PR 목록·세션 새로고침\"\u003e↻\u003c/button\u003e"},{"type":"add","oldNo":null,"newNo":84,"text":"  \u003cbutton type=\"button\" class=\"btn ghost small\" id=\"btnWide\" title=\"내장 브라우저에서 넓게 보기\"\u003e넓게\u003c/button\u003e"},{"type":"add","oldNo":null,"newNo":85,"text":"\u003c/div\u003e"},{"type":"add","oldNo":null,"newNo":86,"text":"\u003cdiv class=\"tabs\" id=\"tabs\"\u003e\u003c/div\u003e"},{"type":"add","oldNo":null,"newNo":87,"text":"\u003cdiv id=\"notice\" class=\"notice\" hidden\u003e\u003c/div\u003e"},{"type":"add","oldNo":null,"newNo":88,"text":"\u003cdiv id=\"app\"\u003e\u003cdiv class=\"empty\"\u003e로딩 중…\u003c/div\u003e\u003c/div\u003e"},{"type":"add","oldNo":null,"newNo":89,"text":""},{"type":"add","oldNo":null,"newNo":90,"text":"\u003cscript type=\"application/json\" id=\"orca-panel-data\"\u003e{\"schemaVersion\":1,\"generatedAt\":null,\"reason\":\"baseline\",\"server\":null,\"launcher\":null,\"agents\":{},\"worktrees\":[],\"sessions\":{},\"sessionList\":[],\"runs\":{},\"overview\":{\"repos\":[],\"github\":{\"enabled\":false,\"lastFetchedAt\":null,\"errors\":[]}},\"viewState\":{}}\u003c/script\u003e"},{"type":"add","oldNo":null,"newNo":91,"text":"\u003cscript\u003e"},{"type":"add","oldNo":null,"newNo":92,"text":"'use strict'"},{"type":"add","oldNo":null,"newNo":93,"text":"// Pure multi-line selection logic for the diff gutter (no DOM)."},{"type":"add","oldNo":null,"newNo":94,"text":""},{"type":"add","oldNo":null,"newNo":95,"text":"const MAX_SELECTION_LINES = 200"},{"type":"add","oldNo":null,"newNo":96,"text":""},{"type":"add","oldNo":null,"newNo":97,"text":"function beginSelection(cell) {"},{"type":"add","oldNo":null,"newNo":98,"text":"  return { path: cell.path, side: cell.side, anchor: cell.line, head: cell.line }"},{"type":"add","oldNo":null,"newNo":99,"text":"}"},{"type":"add","oldNo":null,"newNo":100,"text":""},{"type":"add","oldNo":null,"newNo":101,"text":"function extendSelection(selection, cell) {"},{"type":"add","oldNo":null,"newNo":102,"text":"  if (!selection) return beginSelection(cell)"},{"type":"add","oldNo":null,"newNo":103,"text":"  if (cell.path !== selection.path || cell.side !== selection.side) return selection"},{"type":"add","oldNo":null,"newNo":104,"text":"  return { ...selection, head: cell.line }"},{"type":"add","oldNo":null,"newNo":105,"text":"}"},{"type":"add","oldNo":null,"newNo":106,"text":""},{"type":"add","oldNo":null,"newNo":107,"text":"function normalizeRange({ anchor, head }) {"},{"type":"add","oldNo":null,"newNo":108,"text":"  return { startLine: Math.min(anchor, head), endLine: Math.max(anchor, head) }"},{"type":"add","oldNo":null,"newNo":109,"text":"}"},{"type":"add","oldNo":null,"newNo":110,"text":""},{"type":"add","oldNo":null,"newNo":111,"text":"function clampRange({ anchor, head }) {"},{"type":"add","oldNo":null,"newNo":112,"text":"  const { startLine, endLine } = normalizeRange({ anchor, head })"},{"type":"add","oldNo":null,"newNo":113,"text":"  if (endLine - startLine + 1 \u003c= MAX_SELECTION_LINES) return { startLine, endLine }"},{"type":"add","oldNo":null,"newNo":114,"text":"  if (head \u003e= anchor) return { startLine: anchor, endLine: anchor + MAX_SELECTION_LINES - 1 }"},{"type":"add","oldNo":null,"newNo":115,"text":"  return { startLine: anchor - MAX_SELECTION_LINES + 1, endLine: anchor }"},{"type":"add","oldNo":null,"newNo":116,"text":"}"},{"type":"add","oldNo":null,"newNo":117,"text":""},{"type":"add","oldNo":null,"newNo":118,"text":"function isLineSelected(selection, cell) {"},{"type":"add","oldNo":null,"newNo":119,"text":"  if (!selection || cell.path !== selection.path || cell.side !== selection.side) return false"},{"type":"add","oldNo":null,"newNo":120,"text":"  const { startLine, endLine } = clampRange(selection)"},{"type":"add","oldNo":null,"newNo":121,"text":"  return cell.line \u003e= startLine && cell.line \u003c= endLine"},{"type":"add","oldNo":null,"newNo":122,"text":"}"},{"type":"add","oldNo":null,"newNo":123,"text":""},{"type":"add","oldNo":null,"newNo":124,"text":"// Pure helpers for placing threads inline in the diff."},{"type":"add","oldNo":null,"newNo":125,"text":""},{"type":"add","oldNo":null,"newNo":126,"text":"function threadKey(path, side, line) {"},{"type":"add","oldNo":null,"newNo":127,"text":"  return `${path}|${side}|${line}`"},{"type":"add","oldNo":null,"newNo":128,"text":"}"},{"type":"add","oldNo":null,"newNo":129,"text":""},{"type":"add","oldNo":null,"newNo":130,"text":"function placeThreads(threads) {"},{"type":"add","oldNo":null,"newNo":131,"text":"  const placement = {}"},{"type":"add","oldNo":null,"newNo":132,"text":"  for (const thread of threads) {"},{"type":"add","oldNo":null,"newNo":133,"text":"    const key = threadKey(thread.path, thread.side, thread.endLine)"},{"type":"add","oldNo":null,"newNo":134,"text":"    if (!placement[key]) placement[key] = []"},{"type":"add","oldNo":null,"newNo":135,"text":"    placement[key].push(thread)"},{"type":"add","oldNo":null,"newNo":136,"text":"  }"},{"type":"add","oldNo":null,"newNo":137,"text":"  return placement"},{"type":"add","oldNo":null,"newNo":138,"text":"}"},{"type":"add","oldNo":null,"newNo":139,"text":""},{"type":"add","oldNo":null,"newNo":140,"text":"function countRunnable(threads) {"},{"type":"add","oldNo":null,"newNo":141,"text":"  return threads.filter((thread) =\u003e thread.status === 'open' && thread.applicability === 'current').length"},{"type":"add","oldNo":null,"newNo":142,"text":"}"},{"type":"add","oldNo":null,"newNo":143,"text":""},{"type":"add","oldNo":null,"newNo":144,"text":"function countByFile(threads) {"},{"type":"add","oldNo":null,"newNo":145,"text":"  const counts = {}"},{"type":"add","oldNo":null,"newNo":146,"text":"  for (const thread of threads) counts[thread.path] = (counts[thread.path] ?? 0) + 1"},{"type":"add","oldNo":null,"newNo":147,"text":"  return counts"},{"type":"add","oldNo":null,"newNo":148,"text":"}"},{"type":"add","oldNo":null,"newNo":149,"text":""},{"type":"add","oldNo":null,"newNo":150,"text":""},{"type":"add","oldNo":null,"newNo":151,"text":"// ------------------------------------------------------------------ data"},{"type":"add","oldNo":null,"newNo":152,"text":"let DATA = JSON.parse(document.getElementById('orca-panel-data').textContent || '{}')"},{"type":"add","oldNo":null,"newNo":153,"text":"const PREVIEW = window.parent === window                       // opened in a normal browser (server /panel-preview)"},{"type":"add","oldNo":null,"newNo":154,"text":"const PREVIEW_TOKEN = document.querySelector('meta[name=\"sr-token\"]')?.content ?? null"},{"type":"add","oldNo":null,"newNo":155,"text":"let CONTEXT = null                                             // { displayName, branch, terminals: [{id}] }"},{"type":"add","oldNo":null,"newNo":156,"text":"let ROUTE = 'review'                                            // 'review' | 'overview'"},{"type":"add","oldNo":null,"newNo":157,"text":"let ACTIVE_WORKTREE = null                                      // worktree entry from DATA.worktrees"},{"type":"add","oldNo":null,"newNo":158,"text":"const UI = { file: null, selection: null, dragging: false, pendingForm: false, expanded: new Set(), draft: '', drafts: {}, scrollRestored: false, picker: null, lastMessage: '' }"},{"type":"add","oldNo":null,"newNo":159,"text":""},{"type":"add","oldNo":null,"newNo":160,"text":"function escapeHtml(value) { return String(value ?? '').replace(/[&\u003c\u003e\"']/g, (char) =\u003e ({ '&': '&amp;', '\u003c': '&lt;', '\u003e': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[char])) }"},{"type":"add","oldNo":null,"newNo":161,"text":"class Raw { constructor(html) { this.html = html } }"},{"type":"add","oldNo":null,"newNo":162,"text":"const raw = (html) =\u003e new Raw(html)"},{"type":"add","oldNo":null,"newNo":163,"text":"function h(strings, ...values) { return strings.reduce((out, part, index) =\u003e out + part + (index \u003c values.length ? (values[index] instanceof Raw ? values[index].html : escapeHtml(values[index])) : ''), '') }"},{"type":"add","oldNo":null,"newNo":164,"text":"function formatTime(iso) { if (!iso) return '—'; const d = new Date(iso); return Number.isNaN(d.getTime()) ? String(iso) : d.toLocaleTimeString() }"},{"type":"add","oldNo":null,"newNo":165,"text":"function notice(message, isError) { const el = document.getElementById('notice'); el.textContent = message; el.className = 'notice' + (isError ? ' error' : ''); el.hidden = !message; UI.lastMessage = message }"},{"type":"add","oldNo":null,"newNo":166,"text":""},{"type":"add","oldNo":null,"newNo":167,"text":"// ------------------------------------------------------------------ host bridge (panel actions)"},{"type":"add","oldNo":null,"newNo":168,"text":"const pending = {}"},{"type":"add","oldNo":null,"newNo":169,"text":"let counter = 0"},{"type":"add","oldNo":null,"newNo":170,"text":"function hostCall(action, params) {"},{"type":"add","oldNo":null,"newNo":171,"text":"  if (PREVIEW) {"},{"type":"add","oldNo":null,"newNo":172,"text":"    if (action === 'workspace.readContext') { const w = DATA.worktrees[0]; return Promise.resolve(w ? { displayName: w.displayName, branch: w.branch, terminals: (w.bridgeTerminalIds || []).map((id) =\u003e ({ id })) } : null) }"},{"type":"add","oldNo":null,"newNo":173,"text":"    if (action === 'notifications.show') { console.log('notify', params); return Promise.resolve({ delivered: true }) }"},{"type":"add","oldNo":null,"newNo":174,"text":"    return Promise.reject(new Error('preview: ' + action + ' unavailable'))"},{"type":"add","oldNo":null,"newNo":175,"text":"  }"},{"type":"add","oldNo":null,"newNo":176,"text":"  return new Promise((resolve, reject) =\u003e {"},{"type":"add","oldNo":null,"newNo":177,"text":"    const requestId = 'p' + (++counter)"},{"type":"add","oldNo":null,"newNo":178,"text":"    pending[requestId] = { resolve, reject }"},{"type":"add","oldNo":null,"newNo":179,"text":"    window.parent.postMessage({ type: 'orca-panel-action', requestId, action, params }, '*')"},{"type":"add","oldNo":null,"newNo":180,"text":"    setTimeout(() =\u003e { if (pending[requestId]) { delete pending[requestId]; reject(new Error('호스트 응답 없음 (' + action + ')')) } }, 8000)"},{"type":"add","oldNo":null,"newNo":181,"text":"  })"},{"type":"add","oldNo":null,"newNo":182,"text":"}"},{"type":"add","oldNo":null,"newNo":183,"text":"window.addEventListener('message', (event) =\u003e {"},{"type":"add","oldNo":null,"newNo":184,"text":"  const data = event.data"},{"type":"add","oldNo":null,"newNo":185,"text":"  if (!data || event.source !== window.parent) return"},{"type":"add","oldNo":null,"newNo":186,"text":"  if (data.type === 'orca-panel-action-result') {"},{"type":"add","oldNo":null,"newNo":187,"text":"    const entry = pending[data.requestId]"},{"type":"add","oldNo":null,"newNo":188,"text":"    if (!entry) return"},{"type":"add","oldNo":null,"newNo":189,"text":"    delete pending[data.requestId]"},{"type":"add","oldNo":null,"newNo":190,"text":"    if (data.ok) entry.resolve(data.value); else entry.reject(new Error(data.error || data.errorCode || 'action failed'))"},{"type":"add","oldNo":null,"newNo":191,"text":"    return"},{"type":"add","oldNo":null,"newNo":192,"text":"  }"},{"type":"add","oldNo":null,"newNo":193,"text":"  if (data.type === 'orca-panel-data' && data.data && data.data.schemaVersion === 1) {   // patched host: data without reload"},{"type":"add","oldNo":null,"newNo":194,"text":"    DATA = data.data"},{"type":"add","oldNo":null,"newNo":195,"text":"    pickWorktree()"},{"type":"add","oldNo":null,"newNo":196,"text":"    render({ keepScroll: true })"},{"type":"add","oldNo":null,"newNo":197,"text":"  }"},{"type":"add","oldNo":null,"newNo":198,"text":"})"},{"type":"add","oldNo":null,"newNo":199,"text":""},{"type":"add","oldNo":null,"newNo":200,"text":"// ------------------------------------------------------------------ sending ops to the server through the bridge terminal"},{"type":"add","oldNo":null,"newNo":201,"text":"function encodeOp(op) {"},{"type":"add","oldNo":null,"newNo":202,"text":"  const bytes = new TextEncoder().encode(JSON.stringify(op))"},{"type":"add","oldNo":null,"newNo":203,"text":"  let binary = ''"},{"type":"add","oldNo":null,"newNo":204,"text":"  for (const byte of bytes) binary += String.fromCharCode(byte)"},{"type":"add","oldNo":null,"newNo":205,"text":"  return 'SR ' + btoa(binary).replace(/\\+/g, '-').replace(/\\//g, '_').replace(/=+$/, '')"},{"type":"add","oldNo":null,"newNo":206,"text":"}"},{"type":"add","oldNo":null,"newNo":207,"text":"function bridgeTerminalId() {"},{"type":"add","oldNo":null,"newNo":208,"text":"  if (!ACTIVE_WORKTREE || !CONTEXT) return null"},{"type":"add","oldNo":null,"newNo":209,"text":"  const ids = new Set(ACTIVE_WORKTREE.bridgeTerminalIds || [])"},{"type":"add","oldNo":null,"newNo":210,"text":"  const match = (CONTEXT.terminals || []).find((terminal) =\u003e ids.has(terminal.id))"},{"type":"add","oldNo":null,"newNo":211,"text":"  return match ? match.id : null"},{"type":"add","oldNo":null,"newNo":212,"text":"}"},{"type":"add","oldNo":null,"newNo":213,"text":"async function send(op, { silent = false } = {}) {"},{"type":"add","oldNo":null,"newNo":214,"text":"  if (PREVIEW && PREVIEW_TOKEN) {"},{"type":"add","oldNo":null,"newNo":215,"text":"    const response = await fetch('/api/bridge', { method: 'POST', headers: { 'X-SR-Token': PREVIEW_TOKEN, 'Content-Type': 'application/json' }, body: JSON.stringify(op) })"},{"type":"add","oldNo":null,"newNo":216,"text":"    const payload = await response.json().catch(() =\u003e null)"},{"type":"add","oldNo":null,"newNo":217,"text":"    if (!response.ok) throw new Error(payload?.error?.message || ('HTTP ' + response.status))"},{"type":"add","oldNo":null,"newNo":218,"text":"    if (op.op !== 'view' || op.loadFile) await previewReload()"},{"type":"add","oldNo":null,"newNo":219,"text":"    return payload?.result"},{"type":"add","oldNo":null,"newNo":220,"text":"  }"},{"type":"add","oldNo":null,"newNo":221,"text":"  const terminalId = bridgeTerminalId()"},{"type":"add","oldNo":null,"newNo":222,"text":"  if (!terminalId) { showBridgePicker(); throw new Error('브리지 터미널이 없습니다. 먼저 \"브리지 시작\"을 누르세요.') }"},{"type":"add","oldNo":null,"newNo":223,"text":"  const line = encodeOp(op)"},{"type":"add","oldNo":null,"newNo":224,"text":"  const MAX = 3800"},{"type":"add","oldNo":null,"newNo":225,"text":"  if (line.length \u003c= MAX) {"},{"type":"add","oldNo":null,"newNo":226,"text":"    const result = await hostCall('terminal.sendText', { terminalId, text: line, enter: true })"},{"type":"add","oldNo":null,"newNo":227,"text":"    if (!result || !result.accepted) throw new Error('터미널이 입력을 받지 않았습니다')"},{"type":"add","oldNo":null,"newNo":228,"text":"  } else {"},{"type":"add","oldNo":null,"newNo":229,"text":"    const chunkId = 'c' + Date.now().toString(36)"},{"type":"add","oldNo":null,"newNo":230,"text":"    const total = Math.ceil(line.length / MAX)"},{"type":"add","oldNo":null,"newNo":231,"text":"    for (let index = 0; index \u003c total; index += 1) {"},{"type":"add","oldNo":null,"newNo":232,"text":"      const result = await hostCall('terminal.sendText', { terminalId, text: 'SRC ' + chunkId + ' ' + index + ' ' + total + ' ' + line.slice(index * MAX, (index + 1) * MAX), enter: true })"},{"type":"add","oldNo":null,"newNo":233,"text":"      if (!result || !result.accepted) throw new Error('터미널이 입력을 받지 않았습니다 (chunk ' + index + ')')"},{"type":"add","oldNo":null,"newNo":234,"text":"    }"},{"type":"add","oldNo":null,"newNo":235,"text":"  }"},{"type":"add","oldNo":null,"newNo":236,"text":"  if (!silent) notice('전송됨 — 패널이 곧 갱신됩니다.')"},{"type":"add","oldNo":null,"newNo":237,"text":"  return null"},{"type":"add","oldNo":null,"newNo":238,"text":"}"},{"type":"add","oldNo":null,"newNo":239,"text":"async function previewReload() {"},{"type":"add","oldNo":null,"newNo":240,"text":"  const response = await fetch('/panel-preview', { headers: { 'X-SR-Token': PREVIEW_TOKEN } })"},{"type":"add","oldNo":null,"newNo":241,"text":"  const html = await response.text()"},{"type":"add","oldNo":null,"newNo":242,"text":"  const payload = /\u003cscript type=\"application\\/json\" id=\"orca-panel-data\"\u003e([\\s\\S]*?)\u003c\\/script\u003e/.exec(html)"},{"type":"add","oldNo":null,"newNo":243,"text":"  if (payload) { DATA = JSON.parse(payload[1]); pickWorktree(); render({ keepScroll: true }) }"},{"type":"add","oldNo":null,"newNo":244,"text":"}"},{"type":"add","oldNo":null,"newNo":245,"text":""},{"type":"add","oldNo":null,"newNo":246,"text":"// ------------------------------------------------------------------ context + worktree selection"},{"type":"add","oldNo":null,"newNo":247,"text":"async function loadContext() {"},{"type":"add","oldNo":null,"newNo":248,"text":"  try { CONTEXT = await hostCall('workspace.readContext', {}) } catch (error) { CONTEXT = null; notice(error.message, true) }"},{"type":"add","oldNo":null,"newNo":249,"text":"  pickWorktree()"},{"type":"add","oldNo":null,"newNo":250,"text":"}"},{"type":"add","oldNo":null,"newNo":251,"text":"function contextKey() { return CONTEXT ? CONTEXT.displayName + '|' + CONTEXT.branch : 'none' }"},{"type":"add","oldNo":null,"newNo":252,"text":"function pickWorktree() {"},{"type":"add","oldNo":null,"newNo":253,"text":"  const worktrees = DATA.worktrees || []"},{"type":"add","oldNo":null,"newNo":254,"text":"  let match = null"},{"type":"add","oldNo":null,"n "type":"add","oldNo":null,"newNo":145,"text":"// ------------------------------------------------------------------ sending ops to the server through the bridge terminal"},{"type":"add","oldNo":null,"newNo":146,"text":"function encodeOp(op) {"},{"type":"add","oldNo":null,"newNo":147,"text":"  const bytes = new TextEncoder().encode(JSON.stringify(op))"},{"type":"add","oldNo":null,"newNo":148,"text":"  let binary = ''"},{"type":"add","oldNo":null,"newNo":149,"text":"  for (const byte of bytes) binary += String.fromCharCode(byte)"},{"type":"add","oldNo":null,"newNo":150,"text":"  return 'SR ' + btoa(binary).replace(/\\+/g, '-').replace(/\\//g, '_').replace(/=+$/, '')"},{"type":"add","oldNo":null,"newNo":151,"text":"}"},{"type":"add","oldNo":null,"newNo":152,"text":"function bridgeTerminalId() {"},{"type":"add","oldNo":null,"newNo":153,"text":"  if (!ACTIVE_WORKTREE || !CONTEXT) return null"},{"type":"add","oldNo":null,"newNo":154,"text":"  const ids = new Set(ACTIVE_WORKTREE.bridgeTerminalIds || [])"},{"type":"add","oldNo":null,"newNo":155,"text":"  const match = (CONTEXT.terminals || []).find((terminal) =\u003e ids.has(terminal.id))"},{"type":"add","oldNo":null,"newNo":156,"text":"  return match ? match.id : null"},{"type":"add","oldNo":null,"newNo":157,"text":"}"},{"type":"add","oldNo":null,"newNo":158,"text":"async function send(op, { silent = false } = {}) {"},{"type":"add","oldNo":null,"newNo":159,"text":"  if (PREVIEW && PREVIEW_TOKEN) {"},{"type":"add","oldNo":null,"newNo":160,"text":"    const response = await fetch('/api/bridge', { method: 'POST', headers: { 'X-SR-Token': PREVIEW_TOKEN, 'Content-Type': 'application/json' }, body: JSON.stringify(op) })"},{"type":"add","oldNo":null,"newNo":161,"text":"    const payload = await response.json().catch(() =\u003e null)"},{"type":"add","oldNo":null,"newNo":162,"text":"    if (!response.ok) throw new Error(payload?.error?.message || ('HTTP ' + response.status))"},{"type":"add","oldNo":null,"newNo":163,"text":"    if (op.op !== 'view' || op.loadFile) await previewReload()"},{"type":"add","oldNo":null,"newNo":164,"text":"    return payload?.result"},{"type":"add","oldNo":null,"newNo":165,"text":"  }"},{"type":"add","oldNo":null,"newNo":166,"text":"  const terminalId = bridgeTerminalId()"},{"type":"add","oldNo":null,"newNo":167,"text":"  if (!terminalId) { showBridgePicker(); throw new Error('브리지 터미널이 없습니다. 먼저 \"브리지 시작\"을 누르세요.') }"},{"type":"add","oldNo":null,"newNo":168,"text":"  const line = encodeOp(op)"},{"type":"add","oldNo":null,"newNo":169,"text":"  const MAX = 3800"},{"type":"add","oldNo":null,"newNo":170,"text":"  if (line.length \u003c= MAX) {"},{"type":"add","oldNo":null,"newNo":171,"text":"    const result = await hostCall('terminal.sendText', { terminalId, text: line, enter: true })"},{"type":"add","oldNo":null,"newNo":172,"text":"    if (!result || !result.accepted) throw new Error('터미널이 입력을 받지 않았습니다')"},{"type":"add","oldNo":null,"newNo":173,"text":"  } else {"},{"type":"add","oldNo":null,"newNo":174,"text":"    const chunkId = 'c' + Date.now().toString(36)"},{"type":"add","oldNo":null,"newNo":175,"text":"    const total = Math.ceil(line.length / MAX)"},{"type":"add","oldNo":null,"newNo":176,"text":"    for (let index = 0; index \u003c total; index += 1) {"},{"type":"add","oldNo":null,"newNo":177,"text":"      const result = await hostCall('terminal.sendText', { terminalId, text: 'SRC ' + chunkId + ' ' + index + ' ' + total + ' ' + line.slice(index * MAX, (index + 1) * MAX), enter: true })"},{"type":"add","oldNo":null,"newNo":178,"text":"      if (!result || !result.accepted) throw new Error('터미널이 입력을 받지 않았습니다 (chunk ' + index + ')')"},{"type":"add","oldNo":null,"newNo":179,"text":"    }"},{"type":"add","oldNo":null,"newNo":180,"text":"  }"},{"type":"add","oldNo":null,"newNo":181,"text":"  if (!silent) notice('전송됨 — 패널이 곧 갱신됩니다.')"},{"type":"add","oldNo":null,"newNo":182,"text":"  return null"},{"type":"add","oldNo":null,"newNo":183,"text":"}"},{"type":"add","oldNo":null,"newNo":184,"text":"async function previewReload() {"},{"type":"add","oldNo":null,"newNo":185,"text":"  const response = await fetch('/panel-preview', { headers: { 'X-SR-Token': PREVIEW_TOKEN } })"},{"type":"add","oldNo":null,"newNo":186,"text":"  const html = await response.text()"},{"type":"add","oldNo":null,"newNo":187,"text":"  const payload = /\u003cscript type=\"application\\/json\" id=\"orca-panel-data\"\u003e([\\s\\S]*?)\u003c\\/script\u003e/.exec(html)"},{"type":"add","oldNo":null,"newNo":188,"text":"  if (payload) { DATA = JSON.parse(payload[1]); pickWorktree(); render({ keepScroll: true }) }"},{"type":"add","oldNo":null,"newNo":189,"text":"}"},{"type":"add","oldNo":null,"newNo":190,"text":""},{"type":"add","oldNo":null,"newNo":191,"text":"// ------------------------------------------------------------------ context + worktree selection"},{"type":"add","oldNo":null,"newNo":192,"text":"async function loadContext() {"},{"type":"add","oldNo":null,"newNo":193,"text":"  try { CONTEXT = await hostCall('workspace.readContext', {}) } catch (error) { CONTEXT = null; notice(error.message, true) }"},{"type":"add","oldNo":null,"newNo":194,"text":"  pickWorktree()"},{"type":"add","oldNo":null,"newNo":195,"text":"}"},{"type":"add","oldNo":null,"newNo":196,"text":"function contextKey() { return CONTEXT ? CONTEXT.displayName + '|' + CONTEXT.branch : 'none' }"},{"type":"add","oldNo":null,"newNo":197,"text":"function pickWorktree() {"},{"type":"add","oldNo":null,"newNo":198,"text":"  const worktrees = DATA.worktrees || []"},{"type":"add","oldNo":null,"newNo":199,"text":"  let match = null"},{"type":"add","oldNo":null,"newNo":200,"text":"  // a worktree picked by hand in the overview sticks until the focused worktree actually changes"},{"type":"add","oldNo":null,"newNo":201,"text":"  if (UI.manualWorktree && UI.manualContextKey === contextKey()) {"},{"type":"add","oldNo":null,"newNo":202,"text":"    ACTIVE_WORKTREE = worktrees.find((w) =\u003e w.path === UI.manualWorktree) || ACTIVE_WORKTREE"},{"type":"add","oldNo":null,"newNo":203,"text":"    if (ACTIVE_WORKTREE) return"},{"type":"add","oldNo":null,"newNo":204,"text":"  }"},{"type":"add","oldNo":null,"newNo":205,"text":"  if (CONTEXT) {"},{"type":"add","oldNo":null,"newNo":206,"text":"    const contextTerminals = new Set((CONTEXT.terminals || []).map((t) =\u003e t.id))"},{"type":"add","oldNo":null,"newNo":207,"text":"    const shortBranch = String(CONTEXT.branch || '').replace(/^refs\\/heads\\//, '')"},{"type":"add","oldNo":null,"newNo":208,"text":"    // Score every worktree: shared live terminals count most; branch/displayName break ties."},{"type":"add","oldNo":null,"newNo":209,"text":"    const scored = worktrees.map((w) =\u003e {"},{"type":"add","oldNo":null,"newNo":210,"text":"      const shared = (w.terminalIds || []).filter((id) =\u003e contextTerminals.has(id)).length"},{"type":"add","oldNo":null,"newNo":211,"text":"      const score = shared * 100 + (w.branch === shortBranch ? 10 : 0) + (w.displayName === CONTEXT.displayName ? 1 : 0)"},{"type":"add","oldNo":null,"newNo":212,"text":"      return { w, score }"},{"type":"add","oldNo":null,"newNo":213,"text":"    }).filter((entry) =\u003e entry.score \u003e 0).sort((a, b) =\u003e b.score - a.score)"},{"type":"add","oldNo":null,"newNo":214,"text":"    match = scored.length ? scored[0].w : null"},{"type":"add","oldNo":null,"newNo":215,"text":"  }"},{"type":"add","oldNo":null,"newNo":216,"text":"  if (!match && UI.manualWorktree) match = worktrees.find((w) =\u003e w.path === UI.manualWorktree) || null"},{"type":"add","oldNo":null,"newNo":217,"text":"  ACTIVE_WORKTREE = match"},{"type":"add","oldNo":null,"newNo":218,"text":"}"},{"type":"add","oldNo":null,"newNo":219,"text":"function activeSession() {"},{"type":"add","oldNo":null,"newNo":220,"text":"  if (!ACTIVE_WORKTREE || !ACTIVE_WORKTREE.sessionId) return null"},{"type":"add","oldNo":null,"newNo":221,"text":"  return DATA.sessions?.[ACTIVE_WORKTREE.sessionId] || null"},{"ty
