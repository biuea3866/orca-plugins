<!doctype html>

<head>

<title>Self Review</title>
<style>
  :root { color-scheme: light dark; --sr-add: rgba(46, 160, 67, .18); --sr-del: rgba(248, 81, 73, .18); --sr-sel: rgba(255, 204, 0, .28); --sr-hunk: rgba(56, 139, 253, .12); }
  html, body { margin: 0; padding: 0; background: var(--background); color: var(--foreground); }
  body { font: 12.5px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  button, select, textarea, input { font: inherit; color: inherit; }
  .btn { border: 1px solid var(--border); background: var(--secondary); color: var(--secondary-foreground); border-radius: var(--radius, 6px); padding: 3px 8px; cursor: pointer; font-size: 12px; }
  .btn.primary { background: var(--primary); color: var(--primary-foreground); border-color: transparent; font-weight: 600; }
  .btn.danger { background: var(--destructive); color: var(--destructive-foreground); border-color: transparent; }
  .btn.ghost { background: transparent; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:focus-visible, select:focus-visible, textarea:focus-visible, .gutter:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
  select { background: var(--background); border: 1px solid var(--input); border-radius: var(--radius, 6px); padding: 2px 6px; max-width: 100%; }
  textarea { width: 100%; min-height: 64px; background: var(--background); border: 1px solid var(--input); border-radius: var(--radius, 6px); padding: 6px; resize: vertical; }
  .muted { color: var(--muted-foreground); }
  .small { font-size: 11px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .badge { display: inline-block; font-size: 10.5px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--border); background: var(--accent); color: var(--accent-foreground); white-space: nowrap; }
  .badge.warn { background: var(--sr-sel); border-color: transparent; }
  .card { background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); border-radius: var(--radius, 6px); margin: 8px; }
  .card-head { padding: 6px 10px; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .card-body { padding: 6px 10px; }
  .notice { margin: 8px; padding: 6px 10px; border-radius: var(--radius, 6px); background: var(--sr-sel); color: var(--foreground); font-size: 12px; }
  .notice.error { background: var(--sr-del); }
  .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--card); border-bottom: 1px solid var(--border); }
  .topbar .title { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--border); }
  .tab { padding: 4px 10px; border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0; cursor: pointer; background: transparent; color: var(--muted-foreground); }
  .tab.active { background: var(--card); border-color: var(--border); color: var(--foreground); font-weight: 600; }
  .list-item { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-top: 1px solid var(--border); }
  .list-item:first-child { border-top: 0; }
  .list-item .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pr-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-item { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 4px; cursor: pointer; }
  .file-item:hover { background: var(--accent); }
  .file-item.active { background: var(--accent); font-weight: 600; }
  .file-item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .diff { width: 100%; border-collapse: collapse; table-layout: fixed; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; line-height: 18px; }
  .diff col.g { width: 44px; } .diff col.m { width: 12px; }
  .diff td { padding: 0; vertical-align: top; }
  .diff .gutter { text-align: right; padding-right: 5px; color: var(--muted-foreground); user-select: none; cursor: pointer; background: var(--card); white-space: nowrap; }
  .diff .gutter.disabled { cursor: default; opacity: .4; }
  .diff .gutter:hover:not(.disabled) { color: var(--primary); font-weight: 700; }
  .diff .marker { text-align: center; color: var(--muted-foreground); user-select: none; }
  .diff .code { white-space: pre-wrap; word-break: break-all; padding: 0 6px; }
  .diff tr.add .code, .diff tr.add .marker { background: var(--sr-add); }
  .diff tr.del .code, .diff tr.del .marker { background: var(--sr-del); }
  .diff tr.hunk td { background: var(--sr-hunk); color: var(--muted-foreground); padding: 1px 6px; font-size: 10.5px; }
  .diff tr.selected .code, .diff tr.selected .marker, .diff tr.selected .gutter { background: var(--sr-sel) !important; }
  .diff tr.thread-row td { padding: 6px 6px 6px 10px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; }
  .thread { border: 1px solid var(--border); border-radius: var(--radius, 6px); background: var(--popover); color: var(--popover-foreground); margin: 4px 0; }
  .thread-head { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--muted-foreground); flex-wrap: wrap; }
  .thread-head .grow { flex: 1; }
  .thread.resolved .thread-body { display: none; }
  .thread.resolved.expanded .thread-body { display: block; }
  .comment { padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .comment:last-of-type { border-bottom: 0; }
  .comment .meta { font-size: 10.5px; color: var(--muted-foreground); display: flex; gap: 6px; align-items: center; }
  .comment .meta .grow { flex: 1; }
  .comment .body { white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  .form { padding: 6px 8px; }
  .form .actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 4px; }
  .file-head { position: sticky; top: 34px; z-index: 5; padding: 4px 8px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; gap: 6px; align-items: center; }
  .file-head .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .run { margin: 8px; border: 1px solid var(--border); border-radius: var(--radius, 6px); background: var(--card); }
  .run pre { margin: 0; max-height: 160px; overflow: auto; padding: 6px 8px; font-size: 11px; white-space: pre-wrap; word-break: break-word; background: var(--background); }
  details summary { cursor: pointer; color: var(--muted-foreground); }
  .add-count { color: #2ea043; } .del-count { color: #f85149; }
  .files-collapsed .file-list-body { display: none; }
  .empty { padding: 14px 10px; color: var(--muted-foreground); text-align: center; }
  .kbd { font-family: ui-monospace, monospace; font-size: 10px; border: 1px solid var(--border); border-radius: 3px; padding: 0 3px; }
</style>

type":"add","oldNo":null,"newNo":3,"text":"PR을 올리기 **전에** 사람이 직접 하는 셀프 리뷰 도구. GitHub PR 화면처럼 diff를 읽고, 라인 번호를 **드래그해 멀티라인 코멘트**를 남기고, \"리뷰 완료 및 AI 수정\" 버튼으로 **Claude 또는 Codex** 가 코멘트대로 코드를 고치게 한 뒤 다시 검토한다. 등록된 모든 레포의 **draft/open PR 목록과 상세**도 한 화면에서 본다."},{"type":"add","oldNo":null,"newNo":4,"text":""},{"type":"add","oldNo":null,"newNo":5,"text":"- GitHub 쓰기 = **0건**. 코멘트·세션·AI 실행 기록은 전부 로컬(`~/Library/Application Support/OrcaLocalSelfReview/`)에만 저장. GitHub 접근은 `gh` 읽기 전용 조회(PR 목록·상세·diff)뿐."},{"type":"add","oldNo":null,"newNo":6,"text":"- 런타임 의존성 = 0 (Node 내장 모듈만). 빌드 단계 없음."},{"type":"add","oldNo":null,"newNo":7,"text":""},{"type":"add","oldNo":null,"newNo":8,"text":"## 구성"},{"type":"add","oldNo":null,"newNo":9,"text":""},{"type":"add","oldNo":null,"newNo":10,"text":"| 구성 요소 | 위치 | 역할 |"},{"type":"add","oldNo":null,"newNo":11,"text":"|---|---|---|"},{"type":"add","oldNo":null,"newNo":12,"text":"| **우측 사이드바 패널** | `panel/template.html` → 생성물 `panel.html` | 리뷰 화면 본체. 오버뷰(worktree·세션·PR)와 세션 리뷰(diff·드래그 멀티라인 코멘트·스레드·AI 실행)를 **패널 탭 안에서** 표시 |"},{"type":"add","oldNo":null,"newNo":13,"text":"| 로컬 서버 | `server/main.mjs` | `127.0.0.1` 전용. git diff, 세션/코멘트 저장, AI 실행, `gh` 읽기. **데이터가 바뀔 때마다 `panel.html` 을 다시 생성** → Orca 개발 플러그인 파일 감시기가 패널을 다시 읽음 |"},{"type":"add","oldNo":null,"newNo":14,"text":"| 브리지 터미널 | `worker/launcher-cli.mjs --bridge` | 패널 → 서버 입력 통로. 패널은 `terminal.sendText` 로 이 터미널에 명령 1줄(`SR \u003cbase64url JSON\u003e`)을 입력하고, 브리지가 서버 API 로 전달 |"},{"type":"add","oldNo":null,"newNo":15,"text":"| 워커 (커맨드) | `worker/main.mjs` | 커맨드 팔레트 `Self Review: …`. 서버 보장, 세션 준비, 브리지 터미널 자동 생성, 런처 설치 |"},{"type":"add","oldNo":null,"newNo":16,"text":"| 넓은 화면 | `ui/` | 같은 데이터를 내장 브라우저 탭에서 넓게 보는 보조 화면 (PR 상세·큰 diff·실행 로그) |"},{"type":"add","oldNo":null,"newNo":17,"text":""},{"type":"add","oldNo":null,"newNo":18,"text":"패널이 데이터를 받고 보내는 방식 (Orca plugin API v0 제약 — 패널은 `sandbox=\"allow-scripts\"` iframe + CSP `connect-src 'none'`, 호스트 액션은 `workspace.readContext`·`terminal.sendText`·`notifications.show` 3개뿐):"},{"type":"add","oldNo":null,"newNo":19,"text":""},{"type":"add","oldNo":null,"newNo":20,"text":"- **서버 → 패널**: 서버가 `panel.html` 에 `\u003cscript type=\"application/json\" id=\"orca-panel-data\"\u003e` 로 데이터를 넣어 재생성. Orca 는 개발 플러그인 폴더를 감시해(300ms 디바운스) 플러그인을 새로고침하고 패널을 다시 읽는다. 패치된 호스트(`orca-panel-data` 메시지 지원)에서는 iframe 을 유지한 채 데이터만 갱신된다."},{"type":"add","oldNo":null,"newNo":21,"text":"- **패널 → 서버**: `terminal.sendText` 로 브리지 터미널에 한 줄 입력. 4,096자 초과는 `SRC` 청크로 분할. 브리지는 입력 에코 없이(raw 모드) 서버에 전달하고 처리 상태만 표시한다."},{"type":"add","oldNo":null,"newNo":22,"text":"- 키바인딩은 선언하지 않는다. 키바인딩이 있으면 Orca 가 플러그인 폴더 내용 해시를 승인 지문에 포함해, 패널 재생성 때마다 승인이 풀린다."},{"type":"add","oldNo":null,"newNo":23,"text":""},{"type":"add","oldNo":null,"newNo":24,"text":"상세는 [docs/02-design.md](./docs/02-design.md)."},{"type":"add","oldNo":null,"newNo":25,"text":""},{"type":"add","oldNo":null,"newNo":26,"text":"## 설치 (개발 모드)"},{"type":"add","oldNo":null,"newNo":27,"text":""},{"type":"add","oldNo":null,"newNo":28,"text":"1. Orca → Settings → Plugins → 플러그인 시스템 ON."},{"type":"add","oldNo":null,"newNo":29,"text":"2. **Development** 섹션 → \"Development plugin folder path\" 에 이 레포 경로(`orca-plugin.json` 이 있는 폴더) 추가."},{"type":"add","oldNo":null,"newNo":30,"text":"3. 권한(워크스페이스 읽기·터미널 입력·알림·스토리지·설정) 검토 후 활성화."},{"type":"add","oldNo":null,"newNo":31,"text":"4. 커맨드 팔레트에서 `Self Review: 현재 worktree 리뷰 (우측 패널)` 1회 실행 → 로컬 서버가 뜨고, 현재 worktree 세션과 **브리지 터미널**(\"Self Review bridge\")이 만들어지며, 런처가 `~/Library/Application Support/OrcaLocalSelfReview/bin/open-review` 에 설치된다."},{"type":"add","oldNo":null,"newNo":32,"text":"5. 우측 사이드바에서 **Self Review** 탭을 연다. 브리지가 없으면 패널의 \"브리지 시작\"에서 셸 터미널을 골라 만들 수 있다."},{"type":"add","oldNo":null,"newNo":33,"text":""},{"type":"add","oldNo":null,"newNo":34,"text":"요구 사항: macOS, `git`. PR 목록은 `gh`(로그인 상태), AI 수정은 `claude` 또는 `codex` CLI."},{"type":"add","oldNo":null,"newNo":35,"text":""},{"type":"add","oldNo":null,"newNo":36,"text":"## 사용 흐름"},{"type":"add","oldNo":null,"newNo":37,"text":""},{"type":"add","oldNo":null,"newNo":38,"text":"1. 패널 \"리뷰\" 탭: 현재 worktree 세션(기본 base = `origin/HEAD`, 미커밋·untracked 포함). 없으면 \"리뷰 세션 시작\"."},{"type":"add","oldNo":null,"newNo":39,"text":"2. 파일을 고르고, 라인 번호 거터를 드래그(또는 Shift+클릭, 키보드 Enter/Shift+↑↓) → 코멘트 작성. 같은 파일·같은 side 안에서 최대 200줄. 코멘트는 브리지 터미널을 거쳐 저장되고 패널이 곧 갱신된다."},{"type":"add","oldNo":null,"newNo":40,"text":"3. 에이전트(claude/codex) 선택 → **리뷰 완료 및 AI 수정** → 열린 코멘트가 프롬프트로 변환돼 헤드리스 실행. 상태·변경 파일·로그는 패널의 \"AI 수정\" 카드에, 전체 로그는 \"넓게\"에서."},{"type":"add","oldNo":null,"newNo":41,"text":"4. 완료 후 스레드별로 직접 resolve. (AI 성공만으로 자동 resolve 되지 않는다.)"},{"type":"add","oldNo":null,"newNo":42,"text":"5. 만족하면 평소대로 PR 생성. 플러그인은 commit/push/PR 을 하지 않는다."},{"type":"add","oldNo":null,"newNo":43,"text":""},{"type":"add","oldNo":null,"newNo":44,"text":"패널 \"전체 PR·세션\" 탭에서는 Orca 에 등록된 모든 레포의 open PR(Draft 배지·레포 필터)과 로컬 세션을 본다. PR 상세·diff 와 PR 에 대한 로컬 코멘트는 \"넓게\"(내장 브라우저)에서 본다."},{"type":"add","oldNo":null,"newNo":45,"text":""},{"type":"add","oldNo":null,"newNo":46,"text":"## AI 실행의 쓰기 금지 경계"},{"type":"add","oldNo":null,"newNo":47,"text":""},{"type":"add","oldNo":null,"newNo":48,"text":"| 에이전트 | 실행 명령 | 차단 수단 |"},{"type":"add","oldNo":null,"newNo":49,"text":"|---|---|---|"},{"type":"add","oldNo":null,"newNo":50,"text":"| claude | `claude -p --permission-mode acceptEdits --allowedTools Read Edit Write MultiEdit Grep Glob LS` | 플러그인은 Bash 를 허용하지 않음. 단 사용자 전역 `~/.claude/settings.json` 의 permissions allow 규칙에 해당하는 Bash 는 실행될 수 있음(실측: `npm test` 가 실행됨) — `git push`·`gh` 를 allow 에 넣지 않을 것 |"},{"type":"add","oldNo":null,"newNo":51,"text":"| codex | `codex exec --full-auto --skip-git-repo-check -C \u003cworktree\u003e -` | workspace-write 샌드박스, 네트워크 차단 기본값 |"},{"type":"add","oldNo":null,"newNo":52,"text":""},{"type":"add","oldNo":null,"newNo":53,"text":"프롬프트에도 commit/push/gh 금지를 명시한다. 이 경계는 CLI 의 권한 정책에 의존하므로(OS 수준 격리 아님) CLI 업데이트·전역 permissions 변경 시 재검증이 필요하다. 플러그인 자체의 GitHub 접근은 `server/lib/github.mjs` 한 곳에서 `gh pr list/view/diff` 만 호출한다."},{"type":"add","oldNo":null,"newNo":54,"text":""},{"type":"add","oldNo":null,"newNo":55,"text":"## 개발"},{"type":"add","oldNo":null,"newNo":56,"text":""},{"type":"add","oldNo":null,"newNo":57,"text":"```sh"},{"type":"add","oldNo":null,"newNo":58,"text":"node --test test/*.test.mjs   # 전 테스트 (git 외 외부 CLI 불필요 — gh/claude/codex/orca 는 모킹)"},{"type":"add","oldNo":null,"newNo":59,"text":"node server/main.mjs --foreground   # 서버 단독 실행 (ORCA_SELF_REVIEW_HOME 으로 데이터 경로 변경 가능)"},{"type":"add","oldNo":null,"newNo":60,"text":"node scripts/build-panel.mjs        # 데이터 없는 기준 panel.html 재생성 (서버가 런타임에 덮어씀)"},{"type":"add","oldNo":null,"newNo":61,"text":"# 패널 UI 를 브라우저에서 직접 보려면: http://127.0.0.1:47811/panel-preview (프리뷰 모드 — 브리지 대신 HTTP 로 동작)"},{"type":"add","oldNo":null,"newNo":62,"text":"```"},{"type":"add","oldNo":null,"newNo":63,"text":""},{"type":"add","oldNo":null,"newNo":64,"text":"문서: [docs/01-requirements-analysis-codex.md](./docs/01-requirements-analysis-codex.md) (Codex 요구사항 분석) · [docs/02-design.md](./docs/02-design.md) (설계·API 계약)."}]}]},{"path":"docs/01-requirements-analysis-codex.md","oldPath":null,"changeType":"added","binary":false,"additions":428,"deletions":0,"hunks":[{"header":"@@ -0,0 +1,428 @@","oldStart":0,"oldLines":0,"newStart":1,"newLines":428,"lines":[{"type":"add","oldNo":null,"newNo":1,"text":"# Orca 플러그인 “Local Self Review” 요구사항 분석"},{"type":"add","oldNo":null,"newNo":2,"text":""},{"type":"add","oldNo":null,"newNo":3,"text":"\u003e 작성: Codex (codex-cli 0.154.0, `codex exec`, 2026-10-08). 입력 브리프: Orca 1.4.222 plugin API v0 제약 조사 결과 + 사용자 원문 요구사항. 구현 결정은 [02-design.md](./02-design.md) 참조."},{"type":"add","oldNo":null,"newNo":4,"text":""},{"type":"add","oldNo":null,"newNo":5,"text":"본 문서는 제공된 Orca 1.4.222·plugin API v0 조사 결과를 플랫폼 사실로 사용함. 아래 성능 수치·저장 정책·기능 우선순위는 제품 설계 제안값이며, 플랫폼이 보장하는 값과 구분 필요."},{"type":"add","oldNo":null,"newNo":6,"text":""},{"type":"add","oldNo":null,"newNo":7,"text":"## 1. 요구사항 해석"},{"type":"add","oldNo":null,"newNo":8,"text":""},{"type":"add","oldNo":null,"newNo":9,"text":"### 1.1 원문별 구체화"},{"type":"add","oldNo":null,"newNo":10,"text":""},{"type":"add","oldNo":null,"newNo":11,"text":"| 원문 | 구체 기능 해석 | 권고 |"},{"type":"add","oldNo":null,"newNo":12,"text":"|---|---|---|"},{"type":"add","oldNo":null,"newNo":13,"text":"| Git PR 생성 전 사람 셀프 리뷰 | 로컬 브랜치·작업 디렉터리 변경을 diff로 확인하고, 수정 지시를 코멘트로 기록하는 리뷰 세션 | GitHub PR 생성 없이 시작 가능한 독립 세션 |"},{"type":"add","oldNo":null,"newNo":14,"text":"| GitHub Pull Request와 동일한 기능 | 파일별 diff, old/new 라인, 멀티라인 코멘트, 스레드, 해결 상태, 변경 요약 | 전체 GitHub 제품 복제가 아닌 아래 포함 범위로 한정 |"},{"type":"add","oldNo":null,"newNo":15,"text":"| 드래그로 멀티라인 지정·코멘트 작성 | 같은 파일·같은 diff side의 연속 라인 선택 및 스레드 생성 | 마우스 드래그와 키보드 범위 선택 모두 지원 |"},{"type":"add","oldNo":null,"newNo":16,"text":"| 셀프 리뷰 완료 버튼으로 Claude 또는 Codex 수정 | 저장된 미해결 코멘트를 수정 지시로 변환하고 선택한 에이전트 실행 | 버튼 명칭은 “리뷰 완료 및 AI 수정”; 실행 후 재검토 필수 |"},{"type":"add","oldNo":null,"newNo":17,"text":"| GitHub에 어떤 기록도 남지 않음 | 리뷰 세션·코멘트·AI 결과를 로컬에 저장하며 GitHub 리소스 변경 금지 | GitHub 댓글·리뷰·PR·브랜치·커밋 업로드 모두 금지 |"},{"type":"add","oldNo":null,"newNo":18,"text":"| 전체 프로젝트 draft/open PR 목록·상세 | Orca에 등록된 저장소별 GitHub open PR 조회 및 draft 구분 | 읽기 전용 GitHub 조회를 별도 기능으로 제공 |"},{"type":"add","oldNo":null,"newNo":19,"text":""},{"type":"add","oldNo":null,"newNo":20,"text":"### 1.2 GitHub PR 기능의 포함·제외"},{"type":"add","oldNo":null,"newNo":21,"text":""},{"type":"add","oldNo":null,"newNo":22,"text":"| 기능 | 포함 여부 | 로컬 셀프 리뷰에서의 동작 |"},{"type":"add","oldNo":null,"newNo":23,"text":"|---|---|---|"},{"type":"add","oldNo":null,"newNo":24,"text":"| 변경 파일 목록·추가/삭제 통계 | 포함, P0 | 세션의 로컬 diff 기준 |"},{"type":"add","oldNo":null,"newNo":25,"text":"| 파일별 unified diff·old/new 라인 번호 | 포함, P0 | 고정된 리뷰 스냅샷 기준 |"},{"type":"add","oldNo":null,"newNo":26,"text":"| split diff | 포함, P1 | 화면 폭에 따른 선택 |"},{"type":"add","oldNo":null,"newNo":27,"text":"| 단일·멀티라인 코멘트 | 포함, P0 | 로컬 스레드 저장 |"},{"type":"add","oldNo":null,"newNo":28,"text":"| 코멘트 수정·삭제·스레드 해결 | 포함, P0 | GitHub 전송 없음 |"},{"type":"add","oldNo":null,"newNo":29,"text":"| 파일별 “확인 완료” 표시 | 포함, P1 | 스냅샷 변경 시 해당 파일 표시 초기화 |"},{"type":"add","oldNo":null,"newNo":30,"text":"| 전체 리뷰 메모 | 포함, P1 | 특정 라인 없는 세션 메모 |"},{"type":"add","oldNo":null,"newNo":31,"text":"| 변경 후 코멘트 위치 추적 | 포함, P0 | 일치 확인 실패 시 outdated 표시 |"},{"type":"add","oldNo":null,"newNo":32,"text":"| PR 제목·작성자·브랜치·상태 조회 | 포함, P0 | 기존 GitHub PR의 읽기 전용 상세 |"},{"type":"add","oldNo":null,"newNo":33,"text":"| 기존 PR 댓글·리뷰·체크 조회 | 포함, P1 | 원격 데이터 조회 전용, 로컬 코멘트와 구분 |"},{"type":"add","oldNo":null,"newNo":34,"text":"| GitHub PR 생성·수정 | 제외 | PR 생성 전 로컬 리뷰라는 목적 밖 |"},{"type":"add","oldNo":null,"newNo":35,"text":"| GitHub 댓글·리뷰 제출 | 제외 | 원격 기록 금지와 충돌 |"},{"type":"add","oldNo":null,"newNo":36,"text":"| Approve·Request changes | 제외 | GitHub 승인 상태 변경 금지 |"},{"type":"add","oldNo":null,"newNo":37,"text":"| Merge·Close·Reopen·Ready for review | 제외 | 원격 PR 상태 변경 금지 |"},{"type":"add","oldNo":null,"newNo":38,"text":"| Reviewer·Assignee·Label 변경 | 제외 | 원격 리소스 변경 금지 |"},{"type":"add","oldNo":null,"newNo":39,"text":"| CI 실행·재실행·Checks 작성 | 제외 | GitHub 쓰기 및 실행 부작용 발생 |"},{"type":"add","oldNo":null,"newNo":40,"text":"| Push·Force push | 제외 | 원격 브랜치 변경 금지 |"},{"type":"add","oldNo":null,"newNo":41,"text":""},{"type":"add","oldNo":null,"newNo":42,"text":"### 1.3 “GitHub 기록 없음”과 PR 조회의 관계"},{"type":"add","oldNo":null,"newNo":43,"text":""},{"type":"add","oldNo":null,"newNo":44,"text":"| 해석 | PR 목록 제공 가능 여부 | 제한 |"},{"type":"add","oldNo":null,"newNo":45,"text":"|---|---|---|"},{"type":"add","oldNo":null,"newNo":46,"text":"| GitHub 리소스 생성·변경 0건 | 가능 | 읽기 전용 API 조회 허용 |"},{"type":"add","oldNo":null,"newNo":47,"text":"| GitHub 요청·서버 접근 기록까지 0건 | 실시간 조회 불가 | 인증된 조회도 서버 접근 흔적 발생 가능 |"},{"type":"add","oldNo":null,"newNo":48,"text":"| 리뷰 데이터만 GitHub에 저장 금지 | 가능 | 원격 쓰기 금지 범위를 별도 확정 필요 |"},{"type":"add","oldNo":null,"newNo":49,"text":""},{"type":"add","oldNo":null,"newNo":50,"text":"**권고 기본값:** “플러그인과 플러그인이 실행한 AI 작업에 의한 GitHub 리소스 변경 0건”으로 정의. PR 조회 과정의 요청·접근 로그는 이 보장에 포함하지 않는 것으로 명시."},{"type":"add","oldNo":null,"newNo":51,"text":""},{"type":"add","oldNo":null,"newNo":52,"text":"- GitHub 조회 기능 비활성화 시 GitHub 요청 0건 필요."},{"type":"add","oldNo":null,"newNo":53,"text":"- GitHub 조회 활성화 시 인증된 읽기 전용 요청만 허용."},{"type":"add","oldNo":null,"newNo":54,"text":"- 기존 GitHub PR 상세에서도 새 코멘트는 로컬 세션에만 저장."},{"type":"add","oldNo":null,"newNo":55,"text":"- 원격 PR 본문·댓글과 로컬 리뷰 코멘트에 서로 다른 출처 표시 필요."},{"type":"add","oldNo":null,"newNo":56,"text":""},{"type":"add","oldNo":null,"newNo":57,"text":"“전체 프로젝트”는 기본적으로 **Orca에 등록된 모든 저장소**로 해석. GitHub 계정·조직의 전체 저장소 탐색은 후속 범위."},{"type":"add","oldNo":null,"newNo":58,"text":""},{"type":"add","oldNo":null,"newNo":59,"text":"## 2. 페르소나·사용 시나리오"},{"type":"add","oldNo":null,"newNo":60,"text":""},{"type":"add","oldNo":null,"newNo":61,"text":"### 2.1 페르소나"},{"type":"add","oldNo":null,"newNo":62,"text":""},{"type":"add","oldNo":null,"newNo":63,"text":"| 항목 | 정의 |"},{"type":"add","oldNo":null,"newNo":64,"text":"|---|---|"},{"type":"add","oldNo":null,"newNo":65,"text":"| 사용자 | Orca에서 Claude 또는 Codex로 개발하는 1인 개발자 |"},{"type":"add","oldNo":null,"newNo":66,"text":"| 작업 환경 | 여러 저장소·worktree·브랜치를 동시에 관리 |"},{"type":"add","oldNo":null,"newNo":67,"text":"| 주요 목적 | PR 생성 전 변경 내용을 직접 읽고 수정 지시를 남기는 작업 |"},{"type":"add","oldNo":null,"newNo":68,"text":"| 주요 불편 | diff 확인과 에이전트 수정 지시 간 파일·라인 정보 재작성 |"},{"type":"add","oldNo":null,"newNo":69,"text":"| 성공 기준 | 로컬 코멘트 작성 → AI 수정 → 재검토 완료, GitHub 리소스 변경 0건 |"},{"type":"add","oldNo":null,"newNo":70,"text":""},{"type":"add","oldNo":null,"newNo":71,"text":"### 2.2 PR 생성 전 기본 흐름"},{"type":"add","oldNo":null,"newNo":72,"text":""},{"type":"add","oldNo":null,"newNo":73,"text":"| 단계 | 사용자 동작 | 시스템 동작 |"},{"type":"add","oldNo":null,"newNo":74,"text":"|---|---|---|"},{"type":"add","oldNo":null,"newNo":75,"text":"| 1 | Orca에서 대상 worktree 선택 | 선택 worktree의 ID·경로·저장소 확인 |"},{"type":"add","oldNo":null,"newNo":76,"text":"| 2 | 커맨드 팔레트에서 Local Self Review 열기 | 로컬 서버 시작 또는 재사용, 내장 브라우저 탭 열기 |"},{"type":"add","oldNo":null,"newNo":77,"text":"| 3 | 비교 기준 선택 | 기본 base 후보 표시, 브랜치·작업 디렉터리 상태 수집 |"},{"type":"add","oldNo":null,"newNo":78,"text":"| 4 | 리뷰 세션 생성 | 커밋 SHA·파일 상태·diff 스냅샷 저장 |"},{"type":"add","oldNo":null,"newNo":79,"text":"| 5 | 파일별 변경 확인 | 파일 목록·diff·추가/삭제 통계 표시 |"},{"type":"add","oldNo":null,"newNo":80,"text":"| 6 | 라인을 드래그하고 코멘트 작성 | 파일·side·시작/끝 라인·문맥을 함께 저장 |"},{"type":"add","oldNo":null,"newNo":81,"text":"| 7 | Claude 또는 Codex 선택 후 리뷰 완료 | 실행 대상 코멘트 수·경로·제외 항목 표시 |"},{"type":"add","oldNo":null,"newNo":82,"text":"| 8 | AI 수정 실행 | 저장된 코멘트로 프롬프트 생성, 실행 ID 발급 |"},{"type":"add","oldNo":null,"newNo":83,"text":"| 9 | 결과 확인 | 종료 상태·변경 파일·실행 로그·새 diff 표시 |"},{"type":"add","oldNo":null,"newNo":84,"text":"| 10 | 코멘트별 수정 여부 재검토 | 사용자 확인으로 스레드 resolved 처리 |"},{"type":"add","oldNo":null,"newNo":85,"text":"| 11 | 세션 완료 | 로컬 완료 상태 저장; PR 생성은 별도 작업 |"},{"type":"add","oldNo":null,"newNo":86,"text":""},{"type":"add","oldNo":null,"newNo":87,"text":"### 2.3 기존 PR 조회 흐름"},{"type":"add","oldNo":null,"newNo":88,"text":""},{"type":"add","oldNo":null,"newNo":89,"text":"- 등록 저장소 전체의 open PR 목록 조회, draft 여부 배지 표시."},{"type":"add","oldNo":null,"newNo":90,"text":"- 저장소·작성자·draft 여부 필터 제공."},{"type":"add","oldNo":null,"newNo":91,"text":"- PR 선택 시 제목·본문·base/head·파일 변경 상세 조회."},{"type":"add","oldNo":null,"newNo":92,"text":"- 대응하는 로컬 worktree가 있을 때 로컬 리뷰 세션 연결 가능."},{"type":"add","oldNo":null,"newNo":93,"text":"- 로컬 worktree가 없으면 원격 읽기 전용 상세 제공; 자동 checkout·clone 없음."},{"type":"add","oldNo":null,"newNo":94,"text":""},{"type":"add","oldNo":null,"newNo":95,"text":"## 3. 기능 요구사항"},{"type":"add","oldNo":null,"newNo":96,"text":""},{"type":"add","oldNo":null,"newNo":97,"text":"P0: 1차 릴리스 필수. P1: 2차 릴리스. P2: 이후 확장."},{"type":"add","oldNo":null,"newNo":98,"text":""},{"type":"add","oldNo":null,"newNo":99,"text":"| ID | 기능 | 우선순위 | Acceptance Criteria |"},{"type":"add","oldNo":null,"newNo":100,"text":"|---|---|---|---|"},{"type":"add","oldNo":null,"newNo":101,"text":"| FR-01 | 리뷰 UI 열기 | P0 | 인자 없는 Orca 커맨드 실행으로 내장 브라우저에 리뷰 UI 표시; 워커 커맨드 10초 이내 반환 |"},{"type":"add","oldNo":null,"newNo":102,"text":"| FR-02 | 저장소·worktree 식별 | P0 | CLI 결과의 worktree ID·repo ID·경로 표시; 대상 변경 시 기존 세션 경로 자동 변경 없음 |"},{"type":"add","oldNo":null,"newNo":103,"text":"| FR-03 | 비교 기준 선택 | P0 | `base...HEAD`의 merge-base 기반 변경 확인 가능; base 후보를 확인·변경 가능; 후보 없는 경우 명시 선택 전 시작 차단 |"},{"type":"add","oldNo":null,"newNo":104,"text":"| FR-04 | 미커밋 변경 포함 | P0 | 기본값으로 staged·unstaged·untracked 포함; 같은 파일의 staged·unstaged 변경은 현재 작업 파일 결과 기준으로 통합; untracked 제외 선택 가능 |"},{"type":"add","oldNo":null,"newNo":105,"text":"| FR-05 | 변경 파일 목록·diff | P0 | 추가·수정·삭제·이름 변경 파일 표시; 텍스트 diff의 old/new 라인 번호 표시; 바이너리에는 텍스트 라인 코멘트 비활성화 |"},{"type":"add","oldNo":null,"newNo":106,"text":"| FR-06 | 멀티라인 선택 | P0 | 같은 파일·같은 side의 연속 1~200줄 선택 가능; 파일 또는 side를 넘는 범위 생성 차단 |"},{"type":"add","oldNo":null,"newNo":107,"text":"| FR-07 | 코멘트 CRUD | P0 | 생성·수정·삭제 후 재시작 시 결과 복원; 코멘트 최대 10,000자; 저장 실패 시 저장 완료 표시 금지 |"},{"type":"add","oldNo":null,"newNo":108,"text":"| FR-08 | 스레드 상태 | P0 | open/resolved 전환 및 재열기 가능; AI 실행 성공만으로 자동 resolved 처리 없음 |"},{"type":"add","oldNo":null,"newNo":109,"text":"| FR-09 | 스냅샷·위치 검증 | P0 | 외부 변경 감지 시 새 스냅샷 생성 안내; 위치 확인 실패 코멘트 outdated 표시; 검토 없이 AI 지시에 포함 금지 |"},{"type":"add","oldNo":null,"newNo":110,"text":"| FR-10 | 리뷰 완료 및 AI 수정 | P0 | 미해결·유효 코멘트 수와 실행 worktree 표시; 중복 클릭으로 AI 작업 2건 생성되지 않음 |"},{"type":"add","oldNo":null,"newNo":111,"text":"| FR-11 | 에이전트 선택 | P0 | Claude/Codex 선택값 세션별 저장; 미설치·실행 불가 에이전트 선택 시 실행 차단 및 원인 표시 |"},{"type":"add","oldNo":null,"newNo":112,"text":"| FR-12 | 실행 상태·결과 | P0 | queued/running/succeeded/failed/cancelled/interrupted 표시; 종료 코드·변경 파일·로그 확인 가능 |"},{"type":"add","oldNo":null,"newNo":113,"text":"| FR-13 | 실행 취소·복구 | P0 | 취소 시 해당 실행의 자식 프로세스 종료 요청; 남은 파일 변경 표시; 재시작 시 실행 중 작업의 생존 여부 확인 |"},{"type":"add","oldNo":null,"newNo":114,"text":"| FR-14 | 재검토·세션 완료 | P0 | AI 실행 후 이전/현재 diff 비교 가능; open 스레드가 남으면 완료 전 확인 필요; 완료 세션 재열기 가능 |"},{"type":"add","oldNo":null,"newNo":115,"text":"| FR-15 | 등록 저장소 PR 통합 목록 | P0 | 설정된 조회 한도 내 모든 페이지 수집; open 상태 PR의 draft 여부 구분; 한도 초과 시 부분 조회 표시 |"},{"type":"add","oldNo":null,"newNo":116,"text":"| FR-16 | PR 기본 상세 | P0 | 제목·본문·작성자·base/head·draft 여부·변경 파일·diff 표시; 변경 동작 버튼 없음 |"},{"type":"add","oldNo":null,"newNo":117,"text":"| FR-17 | 로컬 세션 목록 | P0 | 저장소·worktree·세션 상태별 목록과 재열기 제공; worktree 삭제 후에도 저장된 세션 조회 가능 |"},{"type":"add","oldNo":null,"newNo":118,"text":"| FR-18 | GitHub 조회 상태 | P0 | 조회 비활성화·인증 오류·rate limit·네트워크 오류 표시; 실패 시 기존 캐시 유지 및 마지막 조회 시간 표시 |"},{"type":"add","oldNo":null,"newNo":119,"text":"| FR-19 | 파일별 확인 완료 | P1 | 파일별 확인 상태 저장; 파일 내용 변경 시 해당 상태 초기화 |"},{"type":"add","oldNo":null,"newNo":120,"text":"| FR-20 | 전체 리뷰 메모·응답 | P1 | 세션 메모와 스레드 응답 저장; 프롬프트 포함 여부 선택 가능 |"},{"type":"add","oldNo":null,"newNo":121,"text":"| FR-21 | PR 댓글·리뷰·Checks 조회 | P1 | 기존 원격 데이터 조회 가능; 로컬 코멘트와 출처 구분; 제출·재실행 기능 없음 |"},{"type":"add","oldNo":null,"newNo":122,"text":"| FR-22 | 자동 앵커 재배치 | P1 | 문맥·내용 일치 검증 후 후보 위치 제시; 모호한 후보 2개 이상이면 자동 확정 금지 |"},{"type":"add","oldNo":null,"newNo":123,"text":"| FR-23 | 세션 내보내기 | P1 | JSON·Markdown으로 로컬 내보내기; 인증 정보 포함 0건 |"},{"type":"add","oldNo":null,"newNo":124,"text":"| FR-24 | split diff·고급 필터 | P2 | unified/split 전환, 파일 경로·확장자·PR 작성자 필터 제공 |"},{"type":"add","oldNo":null,"newNo":125,"text":""},{"type":"add","oldNo":null,"newNo":126,"text":"## 4. 비기능 요구사항"},{"type":"add","oldNo":null,"newNo":127,"text":""},{"type":"add","oldNo":null,"newNo":128,"text":"### 4.1 성능·안정성"},{"type":"add","oldNo":null,"newNo":129,"text":""},{"type":"add","oldNo":null,"newNo":130,"text":"시험 기준: Apple Silicon, RAM 16GB, 로컬 SSD, 서버 준비 완료 상태. GitHub 응답 시간은 로컬 UI 성능 측정에서 제외."},{"type":"add","oldNo":null,"newNo":131,"text":""},{"type":"add","oldNo":null,"newNo":132,"text":"| ID | 요구사항 | 검증 기준 |"},{"type":"add","oldNo":null,"newNo":133,"text":"|---|---|---|"},{"type":"add","oldNo":null,"newNo":134,"text":"| NFR-01 | 일반 diff 응답 | 100파일·변경 10,000줄에서 파일 목록 2초 이내, 첫 파일 diff 3초 이내 표시 |"},{"type":"add","oldNo":null,"newNo":135,"text":"| NFR-02 | 대형 diff 처리 | 2,000파일·변경 100,000줄에서 목록 5초 이내; 선택 파일만 지연 로드; 전체 diff DOM 동시 생성 금지 |"},{"type":"add","oldNo":null,"newNo":136,"text":"| NFR-03 | 렌더링 제한 | 화면 주변 포함 최대 500줄 단위 렌더; 단일 파일 5MB 또는 20,000줄 초과 시 제한 안내 및 선택 로드 |"},{"type":"add","oldNo":null,"newNo":137,"text":"| NFR-04 | 입력·저장 | 코멘트 입력 중 UI 응답 100ms 이내; 저장 500ms 이내 목표; 저장 중·완료·실패 구분 |"},{"type":"add","oldNo":null,"newNo":138,"text":"| NFR-05 | 비정상 종료 복구 | 저장 완료 코멘트 손실 0건; 원자적 파일 교체와 최근 3개 백업 유지 |"},{"type":"add","oldNo":null,"newNo":139,"text":"| NFR-06 | 중복 실행 방지 | 동일 worktree에 플러그인 AI 실행 최대 1개; 중복 요청은 기존 실행 ID 반환 |"},{"type":"add","oldNo":null,"newNo":140,"text":"| NFR-07 | PR 조회 부하 | 사용자 새로고침 또는 활성 목록 화면의 5분 주기 조회; GitHub 동시 요청 최대 4개 |"},{"type":"add","oldNo":null,"newNo":141,"text":""},{"type":"add","oldNo":null,"newNo":142,"text":"### 4.2 보안·GitHub 쓰기 방지"},{"type":"add","oldNo":null,"newNo":143,"text":""},{"type":"add","oldNo":null,"newNo":144,"text":"| ID | 요구사항 | 구현·검증 방법 |"},{"type":"add","oldNo":null,"newNo":145,"text":"|---|---|---|"},{"type":"add","oldNo":null,"newNo":146,"text":"| NFR-08 | 로컬 서버 접근 | `127.0.0.1`에만 bind; LAN·공인 인터페이스 listen 금지 |"},{"type":"add","oldNo":null,"newNo":147,"text":"| NFR-09 | UI 인증 | 256비트 난수 토큰으로 최초 인증; 이후 HttpOnly·SameSite=Strict 쿠키 사용; URL 토큰을 방문 기록에서 제거 |"},{"type":"add","oldNo":null,"newNo":148,"text":"| NFR-10 | 요청 검증 | 인증·Origin·Host 검증; CSRF 보호; 인증 없는 데이터 조회·수정 요청 거부 |"},{"type":"add","oldNo":null,"newNo":149,"text":"| NFR-11 | 경로 제한 | 파일 읽기·수정 범위를 선택 worktree로 제한; 정규화 및 symlink 해석 후 경계 밖 경로 거부 |"},{"type":"add","oldNo":null,"newNo":150,"text":"| NFR-12 | 명령 주입 방지 | CLI 호출은 실행 파일과 인자 배열 사용; 파일명·코멘트의 셸 문자열 삽입 금지 |"},{"type":"add","oldNo":null,"newNo":151,"text":"| NFR-13 | 콘텐츠 렌더링 | diff·코멘트는 텍스트 렌더; PR Markdown의 raw HTML·스크립트·외부 이미지 자동 로드 금지 |"},{"type":"add","oldNo":null,"newNo":152,"text":"| NFR-14 | 인증 정보 | 기존 `gh` 인증 재사용 우선; 추가 토큰은 Orca secrets에만 저장; 세션·로그·브라우저 응답에 토큰 포함 0건 |"},{"type":"add","oldNo":null,"newNo":153,"text":"| NFR-15 | GitHub 조회 제한 | 전용 조회 모듈에서 승인된 REST GET 경로만 허용; 임의 URL·임의 `gh` 명령·GraphQL 호출 금지 |"},{"type":"add","oldNo":null,"newNo":154,"text":"| NFR-16 | GitHub 쓰기 0건 검증 | 앱의 GitHub 통신을 단일 모듈로 집중; POST/PATCH/PUT/DELETE 및 push 호출 차단; 정상·오류·재시도 시험에서 변이 요청 0건 확인 |"},{"type":"add","oldNo":null,"newNo":155,"text":"| NFR-17 | AI의 원격 변경 차단 | 플러그인이 실행한 AI에도 별도 강제 실행 정책 적용; 프롬프트의 “push 금지” 문장만으로 보장 선언 금지 |"},{"type":"add","oldNo":null,"newNo":156,"text":"| NFR-18 | 코드 외부 전송 고지 | 로컬 저장과 AI 서비스 전송 구분; 최초 실행 전 코드 문맥이 선택한 AI 서비스에 전달될 수 있음을 표시 |"},{"type":"add","oldNo":null,"newNo":157,"text":""},{"type":"add","oldNo":null,"newNo":158,"text":"**보장 범위 구분 필요:**"},{"type":"add","oldNo":null,"newNo":159,"text":""},{"type":"add","oldNo":null,"newNo":160,"text":"- NFR-15·16으로 플러그인의 PR 조회 경로에 대한 쓰기 금지 구현 가능."},{"type":"add","oldNo":null,"newNo":161,"text":"- 일반 Node 프로세스와 일반 AI CLI는 임의 프로세스·네트워크 실행 가능하므로, 현재 플랫폼 capability만으로 AI의 GitHub 쓰기까지 차단 불가."},{"type":"add","oldNo":null,"newNo":162,"text":"- AI 실행까지 포함한 강한 보장을 위해 OS 격리 또는 이에 준하는 강제 실행 환경 필요. AI 서비스 통신만 허용하고 GitHub·Git 원격 통신 및 외부 에이전트 접근 차단 필요."},{"type":"add","oldNo":null,"newNo":163,"text":"- CLI의 승인 설정·도구 제한은 추가 방어 수단으로 사용하되, 실제 차단 범위 검증 필요."},{"type":"add","oldNo":null,"newNo":164,"text":"- 강제 격리 확보 전에는 “AI 포함 GitHub 쓰기 0건 보장” 표시 금지. 해당 보장이 필수이면 AI 자동 수정 출시 차단 조건."},{"type":"add","oldNo":null,"newNo":165,"text":""},{"type":"add","oldNo":null,"newNo":166,"text":"“로컬 only”는 **리뷰 데이터의 저장 위치와 리뷰 UI 서비스 위치**에 적용. Claude/Codex 사용 시 코드의 외부 전송이 발생할 수 있으므로 완전한 오프라인 실행으로 표현 불가."},{"type":"add","oldNo":null,"newNo":167,"text":""},{"type":"add","oldNo":null,"newNo":168,"text":"### 4.3 데이터·표시"},{"type":"add","oldNo":null,"newNo":169,"text":""},{"type":"add","oldNo":null,"newNo":170,"text":"| ID | 요구사항 | 검증 기준 |"},{"type":"add","oldNo":null,"newNo":171,"text":"|---|---|---|"},{"type":"add","oldNo":null,"newNo":172,"text":"| NFR-19 | 저장 위치 | macOS 사용자 Application Support 하위 전용 디렉터리 사용; 저장소 내부 파일 생성 0건 |"},{"type":"add","oldNo":null,"newNo":173,"text":"| NFR-20 | 저장 형식 | UTF-8 JSON, `schemaVersion` 필수; 버전 변경 시 백업 후 마이그레이션 |"},{"type":"add","oldNo":null,"newNo":174,"text":"| NFR-21 | 보관 정책 | 완료·진행 세션 자동 삭제 없음; 캐시 7일 보관; 저장량 1GB 초과 시 정리 안내 |"},{"type":"add","oldNo":null,"newNo":175,"text":"| NFR-22 | 파일 권한 | 전용 디렉터리 0700, 데이터·디스커버리 파일 0600 |"},{"type":"add","oldNo":null,"newNo":176,"text":"| NFR-23 | 라이트·다크 | 패널은 호스트 토큰 사용; 브라우저는 시스템 테마 기본값과 수동 선택 제공; 두 테마에서 본문 대비 4.5:1 이상 |"},{"type":"add","oldNo":null,"newNo":177,"text":"| NFR-24 | 접근성 | 키보드 라인 범위 선택·코멘트 작성 가능; 상태 구분에 색상 외 텍스트 사용 |"},{"type":"add","oldNo":null,"newNo":178,"text":"| NFR-25 | 로그 제한 | 실행별 로그 최대 10MB, 초과 시 순환 저장; 토큰·인증 헤더 마스킹 |"},{"type":"add","oldNo":null,"newNo":179,"text":""},{"type":"add","oldNo":null,"newNo":180,"text":"내장 브라우저 페이지에는 패널용 호스트 CSS 변수의 자동 주입을 가정하지 않음."},{"type":"add","oldNo":null,"newNo":181,"text":""},{"type":"add","oldNo":null,"newNo":182,"text":"## 5. 플랫폼 제약 대응 아키텍처 옵션"},{"type":"add","oldNo":null,"newNo":183,"text":""},{"type":"add","oldNo":null,"newNo":184,"text":"### 5.1 옵션 비교"},{"type":"add","oldNo":null,"newNo":185,"text":""},{"type":"add","oldNo":null,"newNo":186,"text":"| 항목 | A. 오른쪽 패널 중심 | B. 내장 브라우저 + 로컬 서버 | C. 외부 브라우저 + 로컬 서버 |"},{"type":"add","oldNo":null,"newNo":187,"text":"|---|---|---|---|"},{"type":"add","oldNo":null,"newNo":188,"text":"| UI 위치 | 샌드박스 HTML 패널 | Orca 내장 브라우저 탭 | 시스템 브라우저 |"},{"type":"add","oldNo":null,"newNo":189,"text":"| 파일·diff 조회 | 패널에서 직접 불가 | 서버가 Git·파일 시스템 조회 | 서버가 Git·파일 시스템 조회 |"},{"type":"add","oldNo":null,"newNo":190,"text":"| GitHub 조회 | 패널에서 직접 불가 | 서버의 전용 조회 모듈 | 서버의 전용 조회 모듈 |"},{"type":"add","oldNo":null,"newNo":191,"text":"| UI와 백엔드 통신 | 직접 채널 없음 | loopback HTTP | loopback HTTP |"},{"type":"add","oldNo":null,"newNo":192,"text":"| 워커 종료 대응 | 동적 데이터 공급 경로 부재 | 별도 서버 수명 관리 | 별도 서버 수명 관리 |"},{"type":"add","oldNo":null,"newNo":193,"text":"| 화면 공간 | 사이드바 폭 제약 | diff 리뷰에 적합 | diff 리뷰에 적합 |"},{"type":"add","oldNo":null,"newNo":194,"text":"| Orca 연결 | 제한된 3개 호스트 액션 | 서버가 Orca CLI 사용 | 서버가 Orca CLI 사용 |"},{"type":"add","oldNo":null,"newNo":195,"text":"| 판정 | 전체 요구사항 구현 부적합 | **권고** | 내장 브라우저 호환 문제 시 대안 |"},{"type":"add","oldNo":null,"newNo":196,"text":""},{"type":"add","oldNo":null,"newNo":197,"text":"A는 도움말·현재 branch·터미널 안내 정도의 보조 패널로 사용 가능. 코멘트 저장·diff 공급·PR 조회를 위해 터미널을 데이터 통신 통로로 사용하는 구조는 보안·오류 복구·사용성 기준상 제외."},{"type":"add","oldNo":null,"newNo":198,"text":""},{"type":"add","oldNo":null,"newNo":199,"text":"### 5.2 권고 구조"},{"type":"add","oldNo":null,"newNo":200,"text":""},{"type":"add","oldNo":null,"newNo":201,"text":"| 구성 요소 | 책임 |"},{"type":"add","oldNo":null,"newNo":202,"text":"|---|---|"},{"type":"add","oldNo":null,"newNo":203,"text":"| 플러그인 워커 | 인자 없는 커맨드 등록, 서버 시작·재사용 확인, CLI 기반 브라우저 탭 열기 |"},{"type":"add","oldNo":null,"newNo":204,"text":"| detached 로컬 서버 | HTTP API·UI 제공, 세션 저장, Git diff 계산, GitHub 읽기, AI 실행 관리 |"},{"type":"add","oldNo":null,"newNo":205,"text":"| 내장 브라우저 | 저장소·worktree 선택, diff·코멘트·PR 목록, 실행 상태 표시 |"},{"type":"add","oldNo":null,"newNo":206,"text":"| 파일 저장소 | 세션·스냅샷·실행 메타데이터·캐시·서버 디스커버리 |"},{"type":"add","oldNo":null,"newNo":207,"text":"| Orca CLI 어댑터 | 등록 저장소·worktree 조회, 탭 생성, 선택적 터미널 연동 |"},{"type":"add","oldNo":null,"newNo":208,"text":"| GitHub 조회 어댑터 | 허용된 REST GET 조회만 수행 |"},{"type":"add","oldNo":null,"newNo":209,"text":"| AI 실행 어댑터 | Claude/Codex 실행, 강제 정책 적용, 종료·취소·결과 수집 |"},{"type":"add","oldNo":null,"newNo":210,"text":""},{"type":"add","oldNo":null,"newNo":211,"text":"패널 메시지의 64KB·30건/10초 제한에 diff나 실행 로그를 싣지 않는 구조."},{"type":"add","oldNo":null,"newNo":212,"text":""},{"type":"add","oldNo":null,"newNo":213,"text":"### 5.3 커맨드 인자 없음 대응"},{"type":"add","oldNo":null,"newNo":214,"text":""},{"type":"add","oldNo":null,"newNo":215,"text":"- 커맨드 역할을 “리뷰 애플리케이션 열기”로 한정."},{"type":"add","oldNo":null,"newNo":216,"text":"- 커맨드 실행 시 `orca worktree current --json`으로 초기 대상 확보."},{"type":"add","oldNo":null,"newNo":217,"text":"- 세션·base·에이전트 선택은 브라우저 UI에서 수행."},{"type":"add","oldNo":null,"newNo":218,"text":"- 브라우저 탭을 연 뒤 서버 API로 작업 요청 전달."},{"type":"add","oldNo":null,"newNo":219,"text":"- AI 수정과 PR 조회 완료를 워커 커맨드 반환 조건으로 사용하지 않음."},{"type":"add","oldNo":null,"newNo":220,"text":"- 서버 초기화 목표 5초, 탭 열기 포함 커맨드 반환 목표 10초; 30초 타임아웃 전에 실패 반환 필요."},{"type":"add","oldNo":null,"newNo":221,"text":""},{"type":"add","oldNo":null,"newNo":222,"text":"### 5.4 서버 수명 관리"},{"type":"add","oldNo":null,"newNo":223,"text":""},{"type":"add","oldNo":null,"newNo":224,"text":"| 항목 | 요구사항 |"},{"type":"add","oldNo":null,"newNo":225,"text":"|---|---|"},{"type":"add","oldNo":null,"newNo":226,"text":"| 프로세스 분리 | 워커의 in-flight 상태에 의존하지 않는 detached 자식 프로세스 |"},{"type":"add","oldNo":null,"newNo":227,"text":"| 시작 중복 방지 | 플러그인 설치 인스턴스별 시작 잠금; 동시 커맨드에서도 서버 1개 |"},{"type":"add","oldNo":null,"newNo":228,"text":"| 워커 idle reap | 워커 종료 후 열린 UI·실행 중 AI 작업 유지 |"},{"type":"add","oldNo":null,"newNo":229,"text":"| 자동 종료 | 브라우저 연결 0개·AI 작업 0개·진행 요청 0개가 15분 지속되면 종료 |"},{"type":"add","oldNo":null,"newNo":230,"text":"| UI 연결 판단 | 30초 heartbeat, 90초 미수신 시 연결 해제 |"},{"type":"add","oldNo":null,"newNo":231,"text":"| 비정상 종료 | 다음 커맨드에서 재시작; 기존 AI 작업 상태와 데이터 재검증 |"},{"type":"add","oldNo":null,"newNo":232,"text":"| 업데이트·제거 | 버전 불일치 시 안전한 교체; 실행 중 작업이 있으면 교체 보류; 제거 훅 존재를 가정하지 않고 유휴 종료로 잔존 프로세스 정리 |"},{"type":"add","oldNo":null,"newNo":233,"text":"| 중복 탭 | 동일 세션 다중 조회 허용; 저장 충돌은 revision으로 거부 |"},{"type":"add","oldNo":null,"newNo":234,"text":""},{"type":"add","oldNo":null,"newNo":235,"text":"### 5.5 포트·디스커버리"},{"type":"add","oldNo":null,"newNo":236,"text":""},{"type":"add","oldNo":null,"newNo":237,"text":"- OS가 할당한 임시 포트 사용; 고정 포트 충돌 회피."},{"type":"add","oldNo":null,"newNo":238,"text":"- 디스커버리 파일에 포트·PID·시작 시각·인스턴스 ID·프로토콜 버전 저장."},{"type":"add","oldNo":null,"newNo":239,"text":"- 실행 상태와 인증 자료는 권한 0600의 파일로 관리."},{"type":"add","oldNo":null,"newNo":240,"text":"- 서버 재사용 전 인증된 health handshake 수행."},{"type":"add","oldNo":null,"newNo":241,"text":"- PID 존재만으로 서버 재사용 또는 강제 종료 금지."},{"type":"add","oldNo":null,"newNo":242,"text":"- 오래된 디스커버리 파일은 handshake 실패 후 정리."},{"type":"add","oldNo":null,"newNo":243,"text":"- 포트 변경 시 열린 UI에 재연결 실패와 커맨드를 통한 재열기 안내."},{"type":"add","oldNo":null,"newNo":244,"text":""},{"type":"add","oldNo":null,"newNo":245,"text":"### 5.6 Worktree 경로 식별"},{"type":"add","oldNo":null,"newNo":246,"text":""},{"type":"add","oldNo":null,"newNo":247,"text":"| 상황 | 경로 확보 방법 |"},{"type":"add","oldNo":null,"newNo":248,"text":"|---|---|"},{"type":"add","oldNo":null,"newNo":249,"text":"| 현재 worktree | `orca worktree current --json` |"},{"type":"add","oldNo":null,"newNo":250,"text":"| 전체 대상 목록 | `orca repo list --json` + `orca worktree list --json` |"},{"type":"add","oldNo":null,"newNo":251,"text":"| 새 worktree 이벤트 | 이벤트의 path 사용 후 CLI 결과와 확인 |"},{"type":"add","oldNo":null,"newNo":252,"text":"| 패널 context | branch·displayName만으로 경로 추론 금지 |"},{"type":"add","oldNo":null,"newNo":253,"text":"| 이름 중복 | worktree ID·repo ID·정규화 경로로 식별 |"},{"type":"add","oldNo":null,"newNo":254,"text":"| worktree 삭제 | 저장 세션은 유지, AI 실행 차단 |"},{"type":"add","oldNo":null,"newNo":255,"text":"| UI 열린 뒤 포커스 변경 | 세션 대상 고정; 현재 포커스가 바뀌어도 실행 대상 변경 없음 |"},{"type":"add","oldNo":null,"newNo":256,"text":""},{"type":"add","oldNo":null,"newNo":257,"text":"`orca tab create`는 현재 worktree 스코프이므로 조회와 탭 생성 사이 포커스 변경 가능성 존재. 지원되지 않은 스코프 인자를 가정하지 않고, UI 상단의 대상 경로와 선택 기능으로 데이터·실행 대상의 정확성 확보 필요."},{"type":"add","oldNo":null,"newNo":258,"text":""},{"type":"add","oldNo":null,"newNo":259,"text":"## 6. AI 수정 연동 설계 요구"},{"type":"add","oldNo":null,"newNo":260,"text":""},{"type":"add","oldNo":null,"newNo":261,"text":"### 6.1 코멘트 → 프롬프트 규격"},{"type":"add","oldNo":null,"newNo":262,"text":""},{"type":"add","oldNo":null,"newNo":263,"text":"| 영역 | 필수 정보 | 규칙 |"},{"type":"add","oldNo":null,"newNo":264,"text":"|---|---|---|"},{"type":"add","oldNo":null,"newNo":265,"text":"| 실행 식별 | session ID·run ID·snapshot ID | 재시도와 결과 추적 기준 |"},{"type":"add","oldNo":null,"newNo":266,"text":"| 작업 대상 | repo ID·worktree ID·절대 경로 | 실행 cwd와 일치 검증 |"},{"type":"add","oldNo":null,"newNo":267,"text":"| 비교 기준 | base ref·base SHA·head SHA·merge-base SHA | 실행 전 스냅샷 검증 |"},{"type":"add","oldNo":null,"newNo":268,"text":"| 파일 | 현재 상대 경로·이전 경로·변경 유형 | 이름 변경·삭제 파일 구분 |"},{"type":"add","oldNo":null,"newNo":269,"text":"| 라인 앵커 | old/new side·시작/끝 라인 | 범위는 양 끝 포함 |"},{"type":"add","oldNo":null,"newNo":270,"text":"| 코드 문맥 | 선택 라인 전체·앞뒤 20줄·해당 diff hunk | old 라인은 현재 파일 위치로 오인 금지 |"},{"type":"add","oldNo":null,"newNo":271,"text":"| 코멘트 | thread ID·원문·대상 범위 | 작성 내용을 임의 요약·삭제하지 않는 구조 |"},{"type":"add","oldNo":null,"newNo":272,"text":"| 실행 정책 | 허용 경로·GitHub 변경 금지·commit/push 금지 | 프롬프트 외 강제 정책 별도 적용 |"},{"type":"add","oldNo":null,"newNo":273,"text":"| 결과 요구 | 스레드별 수행 내용·미수행 이유·변경 파일·검증 결과 | 파싱 실패 시 원문 결과 보존 |"},{"type":"add","oldNo":null,"newNo":274,"text":""},{"type":"add","oldNo":null,"newNo":275,"text":"- 실행 대상: open 상태이면서 현재 스냅샷에서 유효한 스레드."},{"type":"add","oldNo":null,"newNo":276,"text":"- outdated·resolved 스레드는 기본 제외."},{"type":"add","oldNo":null,"newNo":277,"text":"- 삭제된 old 라인 코멘트도 삭제 판단 수정 등 유효한 지시로 사용 가능."},{"type":"add","oldNo":null,"newNo":278,"text":"- 코멘트 없는 실행 차단."},{"type":"add","oldNo":null,"newNo":279,"text":"- 총 프롬프트 100KB 초과 시 파일·스레드 단위 분할 안내; 조용한 잘림 금지."},{"type":"add","oldNo":null,"newNo":280,"text":"- 같은 worktree의 분할 작업은 순차 실행 및 매 실행 전 스냅샷 확인."},{"type":"add","oldNo":null,"newNo":281,"text":"- 코멘트의 파일 경로·셸 명령 문자열을 직접 실행 명령으로 변환 금지."},{"type":"add","oldNo":null,"newNo":282,"text":""},{"type":"add","oldNo":null,"newNo":283,"text":"### 6.2 실행 방식 비교"},{"type":"add","oldNo":null,"newNo":284,"text":""},{"type":"add","oldNo":null,"newNo":285,"text":"| 항목 | Orca 에이전트 터미널 전송 | Headless CLI 실행 |"},{"type":"add","oldNo":null,"newNo":286,"text":"|---|---|---|"},{"type":"add","oldNo":null,"newNo":287,"text":"| 방식 | `orca terminal send`로 기존 Claude/Codex에 프롬프트 입력 | `claude -p` 또는 `codex exec`를 서버에서 실행 |"},{"type":"add","oldNo":null,"newNo":288,"text":"| 장점 | 기존 대화 문맥 활용, 사용자가 과정 관찰 가능 | 실행 ID·종료 코드·로그·취소 관리 용이 |"},{"type":"add","oldNo":null,"newNo":289,"text":"| 대상 확인 | 터미널 소유 worktree·에이전트 상태 확인 필요 | cwd·실행 파일·인자 고정 가능 |"},{"type":"add","oldNo":null,"newNo":290,"text":"| 완료 판정 | 전송 성공만으로 완료 판정 불가 | 프로세스 종료와 결과 수집 가능 |"},{"type":"add","oldNo":null,"newNo":291,"text":"| 기존 작업 충돌 | TUI가 다른 작업 중일 가능성 | 새 프로세스로 분리 가능하나 파일 충돌은 별도 관리 |"},{"type":"add","oldNo":null,"newNo":292,"text":"| 원격 쓰기 통제 | 기존 터미널의 권한·인증을 상속하므로 강제 보장 어려움 | 별도 격리 환경 적용에 적합 |"},{"type":"add","oldNo":null,"newNo":293,"text":"| 권고 | P1 선택 기능 | **P0 기본 방식** |"},{"type":"add","oldNo":null,"newNo":294,"text":""},{"type":"add","oldNo":null,"newNo":295,"text":"Headless CLI 사용 자체가 격리를 제공하는 것은 아님. NFR-17 검증을 통과한 실행 환경에서만 강한 GitHub 쓰기 금지 보장 가능."},{"type":"add","oldNo":null,"newNo":296,"text":""},{"type":"add","oldNo":null,"newNo":297,"text":"### 6.3 실행·결과 추적"},{"type":"add","oldNo":null,"newNo":298,"text":""},{"type":"add","oldNo":null,"newNo":299,"text":"| 단계 | 요구사항 |"},{"type":"add","oldNo":null,"newNo":300,"text":"|---|---|"},{"type":"add","oldNo":null,"newNo":301,"text":"| 사전 검증 | CLI 실행 가능 여부·worktree 존재·스냅샷 일치·동일 worktree 실행 중복 확인 |"},{"type":"add","oldNo":null,"newNo":302,"text":"| 충돌 방지 | 시작 시 Git 상태와 대상 파일 hash 기록; 기존 dirty 변경을 기준 상태로 보존 |"},{"type":"add","oldNo":null,"newNo":303,"text":"| 실행 | stdin으로 프롬프트 전달 우선; 명령행 인자·프로세스 목록에 리뷰 원문 노출 최소화 |"},{"type":"add","oldNo":null,"newNo":304,"text":"| 상태 갱신 | running 및 최근 로그를 UI에 2초 이내 반영 |"},{"type":"add","oldNo":null,"newNo":305,"text":"| 완료 판단 | 종료 코드와 결과 수집; 성공 종료를 수정 내용의 정확성으로 해석 금지 |"},{"type":"add","oldNo":null,"newNo":306,"text":"| 변경 수집 | 실행 직전/직후 diff로 변경 파일 표시; 외부 동시 수정 가능성을 함께 확인 |"},{"type":"add","oldNo":null,"newNo":307,"text":"| 취소 | 해당 실행 프로세스 그룹 종료; 변경 파일 자동 삭제·reset 금지 |"},{"type":"add","oldNo":null,"newNo":308,"text":"| 재시도 | 새 run ID 발급; 이전 실행 파일 변경을 확인한 뒤 새 스냅샷 기준 사용 |"},{"type":"add","oldNo":null,"newNo":309,"text":"| 재검토 | 스레드별 결과 표시 후 사용자가 resolved 결정 |"},{"type":"add","oldNo":null,"newNo":310,"text":"| 장애 복구 | 서버 재시작 후 프로세스 신원 확인; 생존 확인 불가 작업은 interrupted 처리 |"},{"type":"add","oldNo":null,"newNo":311,"text":""},{"type":"add","oldNo":null,"newNo":312,"text":"브라우저 탭을 닫아도 실행은 유지. Git·파일 hash만으로 외부 에이전트의 동시 수정을 완전히 구분할 수 없으므로, 동일 worktree 동시 수정 발견 시 충돌 경고와 재검토 필요."},{"type":"add","oldNo":null,"newNo":313,"text":""},{"type":"add","oldNo":null,"newNo":314,"text":"## 7. 데이터 모델 초안"},{"type":"add","oldNo":null,"newNo":315,"text":""},{"type":"add","oldNo":null,"newNo":316,"text":"### 7.1 주요 엔터티"},{"type":"add","oldNo":null,"newNo":317,"text":""},{"type":"add","oldNo":null,"newNo":318,"text":"| 엔터티 | 주요 필드 | 의미·제약 |"},{"type":"add","oldNo":null,"newNo":319,"text":"|---|---|---|"},{"type":"add","oldNo":null,"newNo":320,"text":"| ReviewSession | id, schemaVersion, revision, repoId, worktreeId, worktreePath, branch, baseRef, baseSha, headSha, mergeBaseSha, currentSnapshotId, agent, status, createdAt, updatedAt | status: reviewing/fixing/rechecking/completed/archived |"},{"type":"add","oldNo":null,"newNo":321,"text":"| DiffSnapshot | id, sessionId, sourceType, comparisonMode, capturedAt, gitStateHash, files, artifactPaths | sourceType: local/github; 생성 후 불변 |"},{"type":"add","oldNo":null,"newNo":322,"text":"| FileChange | path, oldPath, changeType, oldBlobHash, newContentHash, binary, additions, deletions | 이름 변경과 바이너리 구분 |"},{"type":"add","oldNo":null,"newNo":323,"text":"| Thread | id, sessionId, anchor, status, commentIds, createdAt, resolvedAt | status: open/resolved; 위치 상태와 독립 |"},{"type":"add","oldNo":null,"newNo":324,"text":"| Anchor | snapshotId, path, oldPath, side, startLine, endLine, selectedTextHash, contextBefore, contextAfter, applicability | side: old/new; applicability: current/outdated/unmapped |"},{"type":"add","oldNo":null,"newNo":325,"text":"| Comment | id, threadId, author, body, createdAt, updatedAt | 멀티라인 범위는 Thread의 Anchor로 참조; 최초 코멘트가 스레드 생성 |"},{"type":"add","oldNo":null,"newNo":326,"text":"| AIRun | id, sessionId, snapshotId, agent, threadIds, promptHash, status, processIdentity, exitCode, resultPath, logPath, changedFiles, startedAt, endedAt | 실행과 코멘트 상태 분리 |"},{"type":"add","oldNo":null,"newNo":327,"text":"| PRCache | repositoryIdentity, number, state, isDraft, title, author, baseSha, headSha, fetchedAt, etag, detailPaths | 원격 캐시; 로컬 리뷰와 별도 저장 |"},{"type":"add","oldNo":null,"newNo":328,"text":"| PRLink | sessionId, repositoryIdentity, number, reviewedHeadSha | 동일 PR이라도 head SHA 변경 시 스냅샷 재검증 |"},{"type":"add","oldNo":null,"newNo":329,"text":""},{"type":"add","oldNo":null,"newNo":330,"text":"### 7.2 저장 스키마·위치"},{"type":"add","oldNo":null,"newNo":331,"text":""},{"type":"add","oldNo":null,"newNo":332,"text":"기본 저장 루트: `~/Library/Application Support/OrcaLocalSelfReview/`"},{"type":"add","oldNo":null,"newNo":333,"text":""},{"type":"add","oldNo":null,"newNo":334,"text":"| 위치 | 형식 | 내용 |"},{"type":"add","oldNo":null,"newNo":335,"text":"|---|---|---|"},{"type":"add","oldNo":null,"newNo":336,"text":"| `index.json` | JSON | 세션 목록·요약·schemaVersion |"},{"type":"add","oldNo":null,"newNo":337,"text":"| `sessions/\u003csessionId\u003e/session.json` | JSON | ReviewSession·Thread·Comment |"},{"type":"add","oldNo":null,"newNo":338,"text":"| `sessions/\u003csessionId\u003e/snapshots/\u003csnapshotId\u003e/` | JSON·텍스트 | 파일 메타데이터·diff·필요한 코드 문맥 |"},{"type":"add","oldNo":null,"newNo":339,"text":"| `sessions/\u003csessionId\u003e/runs/\u003crunId\u003e/` | JSON·텍스트 | AIRun·프롬프트·결과·제한된 로그 |"},{"type":"add","oldNo":null,"newNo":340,"text":"| `cache/github/` | JSON·diff | PR 조회 캐시 |"},{"type":"add","oldNo":null,"newNo":341,"text":"| `runtime/\u003cinstallationId\u003e/` | JSON | 디스커버리·인스턴스 상태·시작 잠금 |"},{"type":"add","oldNo":null,"newNo":342,"text":"| Orca storage | 작은 KV | 기본 에이전트·UI 설정·최근 선택 |"},{"type":"add","oldNo":null,"newNo":343,"text":"| Orca secrets | secret | 추가 인증 정보가 필요한 경우에만 사용 |"},{"type":"add","oldNo":null,"newNo":344,"text":""},{"type":"add","oldNo":null,"newNo":345,"text":"- Orca storage의 값 256KB·총 5MB 제한 때문에 diff·세션 본문 저장소로 사용하지 않음."},{"type":"add","oldNo":null,"newNo":346,"text":"- JSON에 `schemaVersion`·`revision`·UTC ISO 8601 타임스탬프 포함."},{"type":"add","oldNo":nul
